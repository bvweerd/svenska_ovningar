              - { any: ["tyckte", "tycker"], label: "Je geeft je mening (tyckte att …)" }
              - { any: ["åt", "var", "kom", "hade", "drack", "dansade", "sjöng"], label: "Je vertelt in de verleden tijd" }
            model: "I lördags var jag på min väns födelsedagsfest. Det kom ungefär tjugo gäster. Först drack vi champagne i trädgården. Sedan åt vi lasagne och sallad. Till efterrätt fanns det en stor chokladtårta. Jag tyckte att tårtan var jättegod. Till slut dansade vi till klockan två."

