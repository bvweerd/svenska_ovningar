      - id: lezen-kraftskiva
        title: "Lezen: kräftskiva"
        instruction: Lees de tekst. Is de bewering **rätt** of **fel**? Is hij fout, schrijf dan de juiste zin op.
        topic: berattande
        textTitle: Kräftskiva hos familjen Ek
        text: |
          I augusti hade Ingrid och Olle kräftskiva i trädgården. Alla deras vänner fick en inbjudan redan i juli. Alla gästerna hade roliga hattar och det fanns lyktor i träden. De åt kräftor, ost och knäckebröd och de sjöng många visor.

          Fleur hade aldrig ätit kräftor förut. Hon tyckte att det var svårt att skala dem, men hon tyckte att de var goda. Bram tror att han åt tjugo kräftor! Till slut fanns det inga kräftor kvar. Efter kräftorna åt de tårta och drack kaffe. Ingrid bakade tårtan själv. Bram var redan mätt, men han åt lite tårta ändå. Sedan dansade alla i trädgården. Festen slutade klockan ett på natten.

          Dagen efter var Bram trött. Han åt bara en smörgås till frukost. ”Jag tänker aldrig äta kräftor igen!” sa han. Fleur skrattar bara. Hon tror att han vill gå på kräftskiva igen redan nästa år.
        items:
          - { id: pztz, type: truefalse, statement: "Kräftskivan var i augusti.", answer: true }
          - { id: g3w5, type: truefalse, statement: "Gästerna fick inbjudan i augusti.", answer: false, tip: "Wanneer kregen de vrienden de uitnodiging?", correction: { answers: ["[Alla ]{gästerna|vännerna|deras vänner|de} fick {inbjudan|en inbjudan} [redan ]i juli.", "{Gästerna|Vännerna|De} fick {inbjudan|en inbjudan} [redan ]i juli."] } }
          - { id: ysqa, type: truefalse, statement: "Gästerna hade roliga hattar.", answer: true }
          - { id: qdtm, type: truefalse, statement: "Fleur hade ätit kräftor många gånger.", answer: false, tip: "Had ze ze al eens gegeten?", correction: { answers: ["{Fleur|Hon} hade aldrig ätit kräftor[ förut]."] } }
          - { id: nfdc, type: truefalse, statement: "Fleur tyckte att kräftorna var äckliga.", answer: false, tip: "Wat vond ze ervan?", correction: { answers: ["{Fleur|Hon} tyckte att {kräftorna|de} var goda."] } }
          - { id: bejs, type: truefalse, statement: "Bram åt inga kräftor.", answer: false, tip: "Hoeveel at Bram er?", correction: { answers: ["{Bram|Han} åt [ungefär ]tjugo kräftor.", "{Bram|Han} tror att han åt [ungefär ]tjugo kräftor."] } }
          - { id: 9b9h, type: truefalse, statement: "Festen slutade klockan elva.", answer: false, tip: "Hoe laat was het feest afgelopen?", correction: { answers: ["Festen slutade klockan ett[ på natten]."] } }
          - { id: vk3c, type: truefalse, statement: "Olle bakade tårtan.", answer: false, tip: "Wie bakte de taart?", correction: { answers: ["Ingrid bakade {tårtan|den}[ själv].", "Olle bakade inte {tårtan|den}.", "Det var Ingrid som bakade {tårtan|den}."] } }
          - { id: dq8k, type: truefalse, statement: "Bram var hungrig efter kräftorna.", answer: false, tip: "Lees het midden van de tweede alinea.", correction: { answers: ["{Bram|Han} var [redan ]mätt[ efter kräftorna].", "{Bram|Han} var inte hungrig[ efter kräftorna]."] } }
          - { id: jbcr, type: truefalse, statement: "Bram tänker äta kräftor igen nästa vecka.", answer: false, tip: "Wat zegt Bram de volgende dag?", correction: { answers: ["{Bram|Han} tänker aldrig äta kräftor igen.", "{Bram|Han} tänker inte äta kräftor[ igen][ nästa vecka]."] } }
          - { id: vns9, type: truefalse, statement: "Fleur tror att Bram vill gå på kräftskiva igen.", answer: true }

      - id: makkelijk-1
        title: "Makkelijk lezen: På kaféet"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "På kaféet"
        text: |
          Ingrid och Fleur är på ett kafé. Det finns kanelbullar och tårta. Ingrid tar en kanelbulle och en kopp kaffe. Fleur tycker att tårtan ser god ut, så hon tar den. Ingrid tror att den kostar mycket, men det gör den inte.
        items:
          - { id: 56zb, type: truefalse, statement: "Fleur tar en kanelbulle.", answer: false }
          - { id: gh3k, type: truefalse, statement: "Det finns tårta på kaféet.", answer: true }

      - id: makkelijk-2
        title: "Makkelijk lezen: Middagen"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Middagen"
        text: |
          Förra lördagen lagade Bram middag. Först skar han potatis och grönsaker. Sedan stekte han fisk. Fleur dukade bordet. Gästerna kom klockan sju. Alla åt mycket och blev mätta. Efter maten drack de kaffe och åt kaka. Bram tänker laga fisk igen nästa helg.
        items:
          - { id: rvrn, type: truefalse, statement: "Bram stekte kyckling.", answer: false }
          - { id: n3qj, type: truefalse, statement: "Fleur dukade bordet.", answer: true }

      - id: makkelijk-3
        title: "Makkelijk lezen: Fika på jobbet"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Fika på jobbet"
        text: |
          På Brams jobb fikar alla klockan tre. Det finns alltid kaffe och te, och på fredagar finns det kanelbullar. Bram tycker att det är trevligt att fika, för då pratar alla med varandra. Idag har Lisa från jobbet bakat en tårta. Bram tycker att den ser god ut, så han tar en stor bit. Han tror att Lisa har köpt tårtan, men det har hon inte.
        items:
          - { id: mctk, type: truefalse, statement: "Det finns kanelbullar varje dag.", answer: false }
          - { id: k4t5, type: mc, prompt: "Vem har bakat tårtan?", options: ["Bram.", "Lisa.", "Fleur."], answer: 1 }
          - { id: dgv8, type: truefalse, statement: "Lisa har köpt tårtan.", answer: false }

