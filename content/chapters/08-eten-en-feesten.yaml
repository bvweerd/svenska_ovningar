        topic: woordenschat
        kind: makkelijk
        textTitle: "En ny restaurang"
        text: |
          I fredags åt Fleur och Bram på en ny restaurang i stan. Först fick de bröd och vatten. Fleur beställde fisk med potatis, och Bram tog köttbullar. Maten var god, men det tog lång tid. Till efterrätt delade de på en glass. Notan blev sexhundra kronor. Fleur tänker gå dit igen med Ingrid.
        items:
          - { id: se8w, type: truefalse, statement: "Bram tog fisk.", answer: false }
          - { id: g3wb, type: mc, prompt: "Hur mycket kostade maten?", options: ["400 kronor.", "600 kronor.", "800 kronor."], answer: 1 }
          - { id: drgr, type: truefalse, statement: "De delade på en glass.", answer: true }

      - id: dialoog-fika
        title: Fika
        instruction: Zet het gesprek in het café in de goede volgorde.
        topic: mat-fraser
        items:
          - id: kzjc
            type: dialogue
            lines:
              - "Expediten: Hej! Vad får det vara?"
              - "Fleur: Jag skulle vilja ha en kaffe och en kanelbulle, tack."
              - "Expediten: Vill du ha mjölk i kaffet?"
              - "Fleur: Ja, lite mjölk, tack. Vad kostar det?"
              - "Expediten: Det blir 65 kronor. Äter du här eller tar du med?"
              - "Fleur: Jag äter här. Tack!"

      - id: taak-restaurang
        title: "Taak: in het restaurant"
        kind: taak
        instruction: "Je eet alleen in een restaurant. Je eet geen vlees. Je wilt water drinken, en na het eten wil je geen toetje, alleen de rekening. Je betaalt met je pinpas. **Doel:** bestel een vegetarisch gerecht en iets te drinken, en reken af. Kies of schrijf bij elke stap wat jij zegt."
        topic: mat-fraser
        items:
          - id: qgxf
            type: steps
            explain: "Gelukt: je hebt vegetarische soep gegeten, water gedronken en met je pinpas betaald."
            steps:
              - type: mc
                topic: det-finns
                prompt: "**Servitören:** Hej och välkommen! Vad får det vara? — *Je eet geen vlees. Vraag of er vegetarisch eten is.*"
                options:
                  - "Finns det vegetarisk mat?"
                  - "Är det vegetarisk mat?"
                  - "Det finns vegetarisk mat?"
                  - "Finns det kyckling?"
                answer: 0
                optionTips:
                  - null
                  - "Of iets er is (er is / er zijn): *Finns det …?*"
                  - "In een ja/nee-vraag komt het werkwoord vooraan: *Finns det …?*"
                  - "*kyckling* is kip, en dat is vlees."
              - type: translate
                topic: tycka-tro-tanka
                prompt: "**Servitören:** Ja, vi har en soppa med grönsaker. — *Zeg dat je denkt dat je de soep neemt.*"
                answers:
                  - "{Jag tror [att ]jag tar soppan|Då tar jag soppan|Jag tar soppan}[, tack]."
                feedback:
                  - { contains: ["tycker att jag", "tycker jag tar"], tip: "Iets wat je (nog) niet zeker weet: *tro*. *Jag tror att jag tar soppan.*" }
                  - { contains: "tänker att jag", tip: "Denken (niet zeker) = *tro*: *Jag tror att jag tar soppan.*" }
                  - { contains: "tar en soppa", tip: "De soep (die de ober net noemt) = *soppan*." }
              - type: translate
                topic: mat-fraser
                prompt: "**Servitören:** Och vad vill du dricka? — *Bestel een glas water.*"
                answers:
                  - "{Jag skulle vilja ha|Jag vill ha|Kan jag få|Jag tar} ett glas vatten[, tack]."
                  - "Ett glas vatten, tack."
                feedback:
                  - { contains: "en glas", tip: "*glas* is een ett-woord: *ett glas*." }
                  - { contains: ["glas vattnet", "glas med vatten"], tip: "Een glas water = *ett glas vatten*." }
                  - { contains: "vilja att", tip: "Na *skulle vilja* komt geen *att*: *jag skulle vilja ha …*" }
              - type: gap
                topic: tycka-tro-tanka
                prompt: "**Servitören:** Hur smakar soppan? — *Je vindt hem heel lekker.*"
                text: "Jag ___ att den är jättegod!"
                gaps:
                  - answers: ["tycker"]
                    options: ["tycker", "tror", "tänker", "smakar"]
                    feedback:
                      - { match: "tror", tip: "Je proeft de soep zelf: dat is je mening. Een mening = *tycker*." }
                      - { match: "tänker", tip: "*tänka* is nadenken of van plan zijn. Een mening = *tycker*." }
                      - { match: "smakar", tip: "*smaka* is smaken (de soep smaakt). Wat jij vindt = *tycker*." }
              - type: translate
                topic: mat-fraser
                prompt: "**Servitören:** Vill du ha någon efterrätt? — *Zeg: nee dank je, je zit vol. Vraag om de rekening.*"
                answers:
                  - "Nej tack, jag är [jätte]mätt. {Kan jag få|Får jag} {notan|räkningen}[, tack]?"
                  - "Nej tack, jag är [jätte]mätt. Får jag be om {notan|räkningen}[, tack]?"
                feedback:
                  - { contains: ["jag är full", "jag är vol"], tip: "Vol (na het eten) = *mätt*. *full* betekent dronken." }
                  - { contains: ["få nota", "få en nota", "få räkning"], tip: "De rekening = *notan* (of *räkningen*): *Kan jag få notan?*" }
                  - { contains: ["kan jag att", "kan jag får"], tip: "Na *kan* komt de infinitief zonder *att*: *kan jag få …*" }
              - type: mc
                topic: mat-fraser
                prompt: "**Servitören:** Varsågod. Det blir 245 kronor. — *Zeg dat het lekker was en vraag of je met je pinpas kunt betalen.*"
                options:
                  - "Tack, det var jättegott! Kan jag betala med kort?"
                  - "Tack, det var jättegod! Kan jag betala med kort?"
                  - "Tack, det var jättegott! Kan jag betalar med kort?"
                  - "Tack, det var äckligt! Kan jag betala med kort?"
                answer: 0
                optionTips:
                  - null
                  - "Na *det var* krijgt het bijvoeglijk naamwoord een -t: *det var jättegott*."
                  - "Na *kan* komt de infinitief: *betala*, niet *betalar*."
                  - "*äcklig* is vies. Je vond het juist lekker: *jättegott*."

      - id: schrijven-feest
        title: "Schrijven: een feest"
        instruction: "Bouw eerst je tekst op in vier stappen die de app nakijkt. Daarna vertel je, als je wilt, over een feest waar jij was."
        topic: berattande
        items:
          - { id: 5r2s, type: mc, prompt: "Je vertelt over een feest. Welke zin past als eerste zin?", options: ["I lördags var jag på en fest hos min vän.", "Sedan åt vi lasagne och sallad.", "Till slut dansade vi till klockan två."], answer: 0, tip: "De eerste zin zegt waar en wanneer. Sedan (daarna) en till slut (ten slotte) komen later in het verhaal." }
          - { id: jfxn, type: order, help: "Begint de zin met *först, sedan, efter …* of met een tijd, dan komt het werkwoord **direct daarna**, vóór het onderwerp.", topic: berattande, prompt: "Vertel wat jullie daarna aten.", start: "Sedan", tokens: ["åt", "vi", "lasagne", "och", "sallad"], answers: ["Sedan åt vi lasagne och sallad.", "Sedan åt vi sallad och lasagne."] }
          - { id: qc95, type: gap, topic: det-finns, prompt: "Kies de goede vorm. (Het feest was afgelopen zaterdag.)", text: "Till efterrätt ___ det en stor chokladtårta.", gaps: [{ answers: ["fanns"], options: ["fanns", "finns"], shuffle: false, tip: "Het feest is voorbij: verleden tijd, det fanns." }] }
          - { id: gd6g, type: gap, topic: tycka-tro-tanka, prompt: "Je geeft je mening over de taart die je hebt geproefd.", text: "Jag ___ att tårtan var jättegod.", gaps: [{ answers: ["tyckte"], options: ["tyckte", "trodde", "tänkte"], tip: "Een mening over iets wat je zelf hebt geproefd: tycka (tyckte)." }] }
          - id: beek
            type: free
            prompt: "Waar was het, wie waren er, wat aten jullie en wat vond je ervan? Vertel het in de verleden tijd en gebruik först, sedan of till slut."
            minWords: 35
            require:
              - { any: ["först", "sedan", "sen", "till slut", "efteråt"], label: "Je gebruikt först, sedan, efteråt of till slut" }
              - { any: ["tyckte", "tycker"], label: "Je geeft je mening (tyckte att …)" }
              - { any: ["åt", "var", "kom", "hade", "drack", "dansade", "sjöng"], label: "Je vertelt in de verleden tijd" }
            model: "I lördags var jag på min väns födelsedagsfest. Det kom ungefär tjugo gäster. Först drack vi champagne i trädgården. Sedan åt vi lasagne och sallad. Till efterrätt fanns det en stor chokladtårta. Jag tyckte att tårtan var jättegod. Till slut dansade vi till klockan två."

