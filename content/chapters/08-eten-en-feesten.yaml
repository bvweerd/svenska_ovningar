          - { id: henp, type: translate, topic: tycka-tro-tanka, prompt: "Iemand vraagt wat je van de soep vindt. Zeg dat je hem lekker vindt.", answers: ["Jag tycker[ att] {den|soppan} är god.", "Den är {väldigt |mycket |}god."], feedback: [{ contains: "tror att", tip: "Een mening over iets wat je proeft: tycker att." }] }
          - { id: 2hbk, type: translate, topic: det-finns, prompt: "Vraag of er melk in de koelkast is.", answers: ["Finns det [någon ]mjölk i {kylskåpet|kylen}?"], feedback: [{ contains: "Är det mjölk", tip: "Of iets er is: finns det …?" }] }
          - { id: w7tk, type: translate, topic: mat-fraser, prompt: "Je zit in een restaurant. Vraag de ober om de menukaart.", answers: ["Kan {vi|jag} få [se ]menyn[, tack]?", "Får {vi|jag} [se ]menyn[, tack]?"], feedback: [{ contains: ["få meny", "få en meny", "se meny"], tip: "De menukaart van dit restaurant: bepaalde vorm, menyn." }] }
          - { id: yty4, type: translate, topic: mat-fraser, prompt: "De ober vraagt: „Vad får det vara?” Zeg dat je graag een kaneelbroodje en een kop thee wilt.", answers: ["{Jag skulle vilja ha|Jag skulle gärna vilja ha|Jag skulle gärna ha|Jag vill ha|Jag vill gärna ha|Jag tar|Kan jag få} en kanelbulle och {en kopp te|ett te}[, tack].", "En kanelbulle och {en kopp te|ett te}[, tack]."], feedback: [{ contains: "ett kanelbulle", tip: "kanelbulle is een en-woord: en kanelbulle." }, { contains: "vilja att ha", tip: "Na vilja komt de infinitief zonder att: Jag skulle vilja ha …" }] }
          - { id: z4tw, type: translate, topic: mat-fraser, prompt: "Je hebt bij Ingrid gegeten. Zeg dat het heel lekker was.", answers: ["{Tack, |Tack för maten, |}det var {jättegott|väldigt gott|mycket gott}.", "{Tack, |Tack för maten, |}maten var {jättegod|väldigt god|mycket god}.", "{Tack, |Tack för maten, |}det smakade {jättegott|väldigt gott|mycket gott}."], feedback: [{ match: ["Det var jättegod.", "Det var god.", "Det var väldigt god.", "Det var mycket god."], tip: "Na det var zeg je gott, met -tt: Det var jättegott!" }, { contains: ["maten var gott", "maten var jättegott"], tip: "mat is een en-woord: maten var god (of: det var gott)." }] }
          - { id: 7sj8, type: translate, topic: tycka-tro-tanka, prompt: "Een collega vraagt wat je dit weekend doet. Zeg dat je van plan bent een taart te bakken.", answers: ["Jag tänker baka en tårta[ i helgen].", "I helgen tänker jag baka en tårta."], feedback: [{ contains: "tänker att baka", tip: "Na *tänker* (van plan zijn) komt de infinitief zonder *att*: *jag tänker baka*." }, { contains: ["jag tror", "jag tycker"], tip: "Van plan zijn = *tänka*: *jag tänker baka en tårta*." }, { contains: "ett tårta", tip: "*tårta* is een en-woord: *en tårta*." }, { contains: "helgen jag", tip: "Begin je met *I helgen*, dan komt het werkwoord op plaats 2: *I helgen **tänker jag** …*" }] }
          - { id: 36ew, type: translate, topic: berattande, prompt: "Vertel wat je gisteravond deed: eerst kookte je, daarna aten jullie samen. Begin de tweede zin met *Sedan*.", answers: ["{Först lagade jag {mat|middag}|Jag lagade {mat|middag} först}. {Sedan|Sen} åt vi [middag ]tillsammans."], feedback: [{ contains: ["sedan vi", "sen vi"], tip: "Begin je met *Sedan*, dan komt het werkwoord op plaats 2: *Sedan **åt vi** …*" }, { contains: "först jag", tip: "Begin je met *Först*, dan komt het werkwoord op plaats 2: *Först **lagade jag** mat*." }, { contains: ["kokade", "kokte"], tip: "Koken (eten maken) = *laga mat*: *jag lagade mat*." }, { contains: ["sedan äter", "sedan ätit", "jag lagar"], tip: "Gisteravond: verleden tijd (*lagade*, *åt*)." }] }
          - { id: qrz6, type: translate, topic: det-finns, prompt: "Een vriend vraagt om een boterham. Zeg dat er geen brood meer is.", answers: ["{Det finns|Tyvärr finns det} inget {bröd[ kvar]|mer bröd}.", "{Det finns|Tyvärr finns det} inte {mer bröd|något bröd[ kvar]}.", "{Vi|Jag} har inget bröd[ kvar]."], feedback: [{ contains: "tyvärr det finns", tip: "*Tyvärr* staat op plaats 1: het werkwoord komt direct erna, *Tyvärr finns det …*" }, { contains: ["ingen bröd", "inga bröd"], tip: "*bröd* is een ett-woord: *inget bröd*." }, { contains: ["det är inget", "det har inget"], tip: "Er is (geen) = *det finns* (*inget*)." }, { contains: "finns inte bröd", tip: "Geen (+ zelfstandig naamwoord) = *inget*: *det finns inget bröd*." }] }
          - { id: yswh, type: translate, topic: tycka-tro-tanka, prompt: "Een vriend vraagt of het morgen gaat regenen. Zeg dat je denkt van niet.", answers: ["[Nej, ]{jag tror inte {det|att det {regnar|ska regna}[ i morgon]}|det tror jag inte}."], feedback: [{ contains: ["tycker inte", "tycker jag inte"], tip: "Iets wat je niet zeker weet: *tro*. *Jag tror inte det.*" }, { contains: ["tänker inte", "tänker jag inte"], tip: "Iets wat je niet zeker weet: *tro*. *Jag tror inte det.*" }, { contains: "tror inte så", tip: "Denk van niet = *jag tror inte det* (niet *så*)." }] }

