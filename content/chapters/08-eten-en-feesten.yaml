chapter: 8
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan zeggen wat ik vind, denk of verwacht (tycka, tro, tänka)", topics: [tycka-tro-tanka] }
  - { text: "Ik kan in de verleden tijd vertellen over een feest of etentje", topics: [berattande] }
  - { text: "Ik kan zeggen wat er is en wat er te eten is", topics: [det-finns, mat-fraser] }

grammar:
  - id: tycka-tro-tanka
    title: Vinden, denken, geloven – tycka, tro, tänka
    summary: "**tycka** = vinden (mening), **tro** = denken/geloven (niet zeker), **tänka** = nadenken, denken aan, van plan zijn."
    body: |
      Het Nederlandse *denken* en *vinden* heeft in het Zweeds drie vertalingen:

      | Werkwoord | Gebruik | Voorbeeld |
      |---|---|---|
      | **tycka** | een **mening** of smaak | Jag **tycker** att filmen är bra. (Ik vind de film goed.) |
      | **tro** | iets **vermoeden**, niet zeker weten | Jag **tror** att det regnar imorgon. (Ik denk dat het morgen regent.) |
      | **tänka** | **nadenken**, denken **aan** iets | Jag **tänker** ofta på dig. |
      | **tänka** + infinitief | van plan zijn | Vi **tänker** åka till Paris. |

      Een handige test: kun je in het Nederlands *vinden* zeggen? Dan is het **tycka**. Kun je *vermoeden* of *verwachten* zeggen? Dan is het **tro**.

      - *Vad **tycker** du om maten?* – Wat vind je van het eten?
      - ***Tror** du att Olle kommer?* – Denk je dat Olle komt?
      - *Vad **tänker** du på?* – Waar denk je aan?

      En nog eentje: **tycka om** = houden van (hoofdstuk 3).

  - id: berattande
    title: Vertellen over vroeger
    summary: "In een verhaal over toen gebruik je de **preteritum**. Woorden als **då** (toen), **sedan** (daarna) en **när** (toen, als) helpen je verhaal op gang."
    body: |
      Vertel je wat er gebeurd is, dan staat het hele verhaal in de **preteritum**:

      *När jag var liten **bodde** vi i ett litet hus. Varje sommar **åkte** vi till mormor. Där **åt** vi jordgubbar och **badade** i sjön.*

      ### Tijdwoorden in een verhaal
      | Nu (nutid) | In een verhaal over toen (dåtid) |
      |---|---|
      | nu | då (toen) |
      | idag | den dagen |
      | igår | dagen innan |
      | imorgon | dagen efter |
      | i år | det året |

      Andere handige woorden: **först** (eerst), **sedan** (daarna), **efteråt** (achteraf, daarna), **till slut** (uiteindelijk), **när** (toen, wanneer).

      Begint de zin met zo'n woord, dan geldt de V2-regel: ***Sedan åkte** vi hem.*

  - id: det-finns
    title: Det finns – er is, er zijn
    summary: "**Det finns** = er is/er zijn. Vraag: **Finns det …?** Ontkenning met **ingen** (en-woord), **inget** (ett-woord), **inga** (meervoud)."
    body: |
      Met **det finns** zeg je dat iets bestaat of aanwezig is:

      - **Det finns** en bra restaurang i centrum.
      - I Västerås **finns det** en stor domkyrka. (inversie)
      - **Finns det** mjölk i kylskåpet?

      ### Geen: ingen, inget, inga
      | | Voorbeeld |
      |---|---|
      | en-woord | Det finns **ingen** mjölk. |
      | ett-woord | Det finns **inget** bröd. |
      | meervoud | Det finns **inga** ägg. |

      *Ingen/inget/inga* gebruik je ook met andere werkwoorden: *Vi har **inga** barn. Jag har **ingen** bil.*

  - id: mat-fraser
    title: Uit eten en fika
    summary: "*Jag skulle vilja ha …* (Ik zou graag … willen), *Kan vi få notan?*, *Smaklig måltid!*, *Skål!*, *Tack för maten!*"
    body: |
      | Zweeds | Nederlands |
      |---|---|
      | Vad får det vara? | Wat mag het zijn? |
      | Jag skulle vilja ha … | Ik zou graag … willen |
      | Kan jag få …? | Mag ik …? |
      | Äter du här eller tar du med? | Eet je hier of neem je het mee? |
      | Smaklig måltid! | Eet smakelijk! |
      | Skål! | Proost! |
      | Det var jättegott! | Het was heel lekker! |
      | Kan vi få notan? | Mogen we de rekening? |
      | Tack för maten! | Bedankt voor het eten! |

      **Fika** is een Zweeds begrip: even pauze nemen met koffie (of thee) en iets lekkers, zoals een *kanelbulle*. Je kunt het als werkwoord gebruiken: *Ska vi fika?*

      *Tack för maten* zeg je tegen wie heeft gekookt, ook thuis na elke maaltijd.

sections:
  - id: oefeningen
    title: Oefeningen
    exercises:
      - id: tycka-tro-tanka-kiezen
        title: Tycker, tror of tänker?
        instruction: Kies het werkwoord dat past.
        topic: tycka-tro-tanka
        shuffle: true
        items:
          - { id: 62jz, type: gap, text: "Vad ___ du om filmen? – Den var jättebra.", gaps: [{ answers: ["tycker"], options: ["tycker", "tror", "tänker"], shuffle: false, feedback: [{ match: "tror", tip: "Hier wordt naar je mening gevraagd (wat vind je): tycker." }] }] }
          - { id: 9q8f, type: gap, text: "Kommer Ingrid ikväll? – Jag ___ det, men jag vet inte.", gaps: [{ answers: ["tror"], options: ["tycker", "tror", "tänker"], shuffle: false, feedback: [{ match: "tycker", tip: "Je weet het niet zeker (je vermoedt het): tror." }] }] }
          - { id: 29v3, type: gap, text: "Jag ___ ofta på mina föräldrar i Nederländerna.", gaps: [{ answers: ["tänker"], options: ["tycker", "tror", "tänker"], shuffle: false }] }
          - { id: whg4, type: gap, text: "Vi ___ åka till Paris i sommar.", gaps: [{ answers: ["tänker"], options: ["tycker", "tror", "tänker"], shuffle: false, feedback: [{ match: "tror", tip: "Het gaat om een plan: tänker + infinitief." }] }] }
          - { id: d3jh, type: gap, text: "Jag ___ att den nya restaurangen är för dyr.", gaps: [{ answers: ["tycker"], options: ["tycker", "tror", "tänker"], shuffle: false }] }
          - { id: bkj8, type: gap, text: "Det är mörkt ute. Jag ___ att klockan är mycket.", gaps: [{ answers: ["tror"], options: ["tycker", "tror", "tänker"], shuffle: false }] }
          - { id: c8r2, type: gap, text: "Stör mig inte, jag ___!", gaps: [{ answers: ["tänker"], options: ["tycker", "tror", "tänker"], shuffle: false }] }
          - { id: 39cb, type: gap, text: "___ du att det blir regn imorgon?", gaps: [{ answers: ["Tror"], options: ["Tycker", "Tror", "Tänker"], shuffle: false }] }

      - id: tycka-tro-vertalen
        title: Vertaal met tycka, tro of tänka
        instruction: Vertaal naar het Zweeds.
        topic: tycka-tro-tanka
        items:
          - { id: hsgy, type: translate, prompt: "Ik vind de film goed.", answers: ["Jag tycker [att ]filmen är bra.", "Jag tycker om filmen."], feedback: [{ contains: ["tror att filmen", "tror filmen"], tip: "Een mening (vinden): tycker." }] }
          - { id: fa2s, type: translate, prompt: "Ik denk dat hij ziek is.", answers: ["Jag tror [att ]han är sjuk."], feedback: [{ contains: ["tycker att han", "tycker han"], tip: "Je weet het niet zeker (vermoeden): tror." }, { contains: "tänker att", tip: "Een vermoeden: tror." }] }
          - { id: gfc5, type: translate, prompt: "Waar denk je aan?", answers: ["Vad tänker du på?"], feedback: [{ match: "På vad tänker du", tip: "Het voorzetsel staat in het Zweeds meestal aan het eind: Vad tänker du på?" }] }
          - { id: 8ype, type: translate, prompt: "Wij zijn van plan een feest te geven.", answers: ["Vi tänker {ha|ordna} [en ]fest."], feedback: [{ contains: "tänker att", tip: "Na tänker (van plan zijn) komt de infinitief zonder att." }] }
          - { id: 38ws, type: translate, prompt: "Wat vind je van Västerås?", answers: ["Vad tycker du om Västerås?"], topic: vragen }
          - { id: 2x45, type: translate, prompt: "Ik vind het eten lekker.", answers: ["Jag tycker [att ]maten är god.", "Jag tycker om maten."], feedback: [{ contains: ["tror att maten", "tror maten"], tip: "Een mening (vinden): tycker." }] }
          - { id: exrh, type: translate, prompt: "Denk je dat Olle komt?", answers: ["Tror du [att ]Olle kommer?"], topic: vragen, feedback: [{ contains: "tycker du", tip: "Je vraagt naar een vermoeden, niet naar een mening: tror." }] }
          - { id: gum3, type: translate, prompt: "Ik denk vaak aan mijn familie.", answers: ["Jag tänker ofta på min familj."], feedback: [{ contains: ["tror ofta", "tycker ofta"], tip: "Aan iets denken = tänka på." }, { contains: "ofta tänker", tip: "ofta staat ná het werkwoord." }] }

      - id: tycka-tro-kiezen-maken
        title: Mening, vermoeden of plan? Kies en vertaal
        instruction: Kies eerst wat de zin uitdrukt, vertaal hem dan met *tycka*, *tro* of *tänka*.
        topic: tycka-tro-tanka
        shuffle: true
        items:
          - id: gr8k
            type: steps
            steps:
              - { type: mc, prompt: "Ik vind dat het eten lekker is. Wat drukt de zin uit?", options: ["een mening: tycka", "een vermoeden: tro", "nadenken of een plan: tänka"], answer: 0, shuffle: false, tip: "Je kunt *vinden* zeggen: een mening, tycka." }
              - { type: mc, prompt: "**Waarom?** Hoe weet je dat het *tycka* is?", options: ["Je kunt in het Nederlands *vinden* zeggen.", "Je weet niet zeker of het eten lekker is.", "Je bent van plan te eten."], answer: 0, tip: "De test uit de uitleg: vinden → tycka, vermoeden → tro, nadenken of van plan zijn → tänka." }
              - { type: translate, prompt: "Vertaal: Ik vind dat het eten lekker is.", answers: ["Jag tycker [att ]maten är god."], feedback: [{ contains: "tror", tip: "Het is een mening (vinden): tycker." }, { contains: "maten är gott", tip: "mat is een en-woord: maten är god." }] }
          - id: tgt5
            type: steps
            steps:
              - { type: mc, prompt: "Ik denk dat Olle morgen komt. Wat drukt de zin uit?", options: ["een mening: tycka", "een vermoeden: tro", "nadenken of een plan: tänka"], answer: 1, shuffle: false, tip: "Je weet het niet zeker, je vermoedt het: tro." }
              - { type: translate, prompt: "Vertaal: Ik denk dat Olle morgen komt.", answers: ["Jag tror [att ]Olle kommer {imorgon|i morgon}."], feedback: [{ contains: "tycker", tip: "Het is geen mening maar een vermoeden: tror." }, { contains: "tänker", tip: "Je vermoedt het: tror." }] }
          - id: tcnn
            type: steps
            steps:
              - { type: mc, prompt: "Ik denk vaak aan de zomer. Wat drukt de zin uit?", options: ["een mening: tycka", "een vermoeden: tro", "nadenken of een plan: tänka"], answer: 2, shuffle: false, tip: "Denken aan iets: tänka på." }
              - { type: translate, prompt: "Vertaal: Ik denk vaak aan de zomer.", answers: ["Jag tänker ofta på sommaren."], feedback: [{ contains: "tänker på sommaren ofta", tip: "Ofta staat direct na het werkwoord: Jag tänker ofta på …" }] }
          - id: mupk
            type: steps
            steps:
              - { type: mc, prompt: "Wat vind je van de film? Wat drukt de zin uit?", options: ["een mening: tycka", "een vermoeden: tro", "nadenken of een plan: tänka"], answer: 0, shuffle: false, tip: "Je vraagt naar een mening: tycka." }
              - { type: translate, prompt: "Vertaal: Wat vind je van de film?", answers: ["Vad tycker du om filmen?"], feedback: [{ contains: "tycker du av", tip: "Een mening over iets: tycka om." }] }
          - id: 4qd6
            type: steps
            steps:
              - { type: mc, prompt: "We zijn van plan in juli naar Gotland te gaan. Wat drukt de zin uit?", options: ["een mening: tycka", "een vermoeden: tro", "nadenken of een plan: tänka"], answer: 2, shuffle: false, tip: "Van plan zijn: tänka + infinitief." }
              - { type: translate, prompt: "Vertaal: We zijn van plan in juli naar Gotland te gaan.", answers: ["Vi tänker {åka|resa} till Gotland i juli."], feedback: [{ contains: "tänker att åka", tip: "Na tänka (van plan zijn) komt de infinitief zonder att." }] }
          - id: qnnn
            type: steps
            steps:
              - { type: mc, prompt: "Denk je dat het morgen regent? Wat drukt de zin uit?", options: ["een mening: tycka", "een vermoeden: tro", "nadenken of een plan: tänka"], answer: 1, shuffle: false, tip: "Je weet niet zeker of het morgen regent, je verwacht het: tro." }
              - { type: translate, prompt: "Vertaal: Denk je dat het morgen regent?", answers: ["Tror du [att ]det regnar {imorgon|i morgon}?"], feedback: [{ contains: "Tycker du", tip: "Je vraagt niet naar een mening maar naar een verwachting: tror." }] }
          - id: kkch
            type: steps
            steps:
              - { type: mc, prompt: "Bram vindt dat de soep te heet is. Wat drukt de zin uit?", options: ["een mening: tycka", "een vermoeden: tro", "nadenken of een plan: tänka"], answer: 0, shuffle: false, tip: "Je kunt *vinden* zeggen: een mening, tycka." }
              - { type: translate, prompt: "Vertaal: Bram vindt dat de soep te heet is.", answers: ["Bram tycker [att ]soppan är för varm."], feedback: [{ contains: "tror", tip: "Het is Brams mening: tycker." }] }
          - id: jkpu
            type: steps
            steps:
              - { type: mc, prompt: "Ik geloof dat ze in Uppsala woont. Wat drukt de zin uit?", options: ["een mening: tycka", "een vermoeden: tro", "nadenken of een plan: tänka"], answer: 1, shuffle: false, tip: "Je weet het niet zeker: tro." }
              - { type: translate, prompt: "Vertaal: Ik geloof dat ze in Uppsala woont.", answers: ["Jag tror [att ]hon bor i Uppsala."], feedback: [{ contains: "tycker", tip: "Je weet het niet zeker, het is geen mening: tror." }] }
          - id: 653r
            type: steps
            steps:
              - { type: mc, prompt: "Wilma is van plan een nieuwe fiets te kopen. Wat drukt de zin uit?", options: ["een mening: tycka", "een vermoeden: tro", "nadenken of een plan: tänka"], answer: 2, shuffle: false, tip: "Van plan zijn: tänka + infinitief." }
              - { type: translate, prompt: "Vertaal: Wilma is van plan een nieuwe fiets te kopen.", answers: ["Wilma tänker köpa en ny cykel."], feedback: [{ contains: "tänker att köpa", tip: "Na tänka (van plan zijn) komt de infinitief zonder att." }] }

      - id: det-finns-invullen
        title: Det finns
        instruction: Vul het ontbrekende woord in.
        topic: det-finns
        shuffle: true
        items:
          - { id: qxkd, type: gap, text: "___ det mjölk i kylskåpet?", gaps: [{ answers: ["Finns"] }] }
          - { id: 4tuw, type: gap, text: "I Västerås ___ det en stor domkyrka.", gaps: [{ answers: ["finns"] }] }
          - { id: d933, type: gap, text: "Det finns ___ bröd kvar.", hint: "(geen – bröd is een ett-woord)", gaps: [{ answers: ["inget"], options: ["ingen", "inget", "inga"], shuffle: false }] }
          - { id: 5x5s, type: gap, text: "Det finns ___ ägg i kylen.", hint: "(geen – meervoud)", gaps: [{ answers: ["inga"], options: ["ingen", "inget", "inga"], shuffle: false }] }
          - { id: gzp2, type: gap, text: "Tyvärr finns det ___ ledig plats.", hint: "(geen – plats is een en-woord)", gaps: [{ answers: ["ingen"], options: ["ingen", "inget", "inga"], shuffle: false }] }
          - { id: tk9w, type: gap, text: "Vi har ___ barn, men vi har en katt.", gaps: [{ answers: ["inga"], options: ["ingen", "inget", "inga"], shuffle: false }] }
          - { id: jqww, type: gap, text: "Det finns ___ mjölk kvar.", hint: "(geen – mjölk is een en-woord)", gaps: [{ answers: ["ingen"], options: ["ingen", "inget", "inga"], shuffle: false }] }
          - { id: cnpn, type: gap, text: "I vår stad ___ det många kaféer.", gaps: [{ answers: ["finns"] }] }

      - id: det-finns-vertalen
        title: Er is …
        instruction: Vertaal naar het Zweeds.
        topic: det-finns
        items:
          - { id: gmmw, type: translate, prompt: "Er is een goed restaurant in het centrum.", answers: ["Det finns en bra restaurang i centrum.", "I centrum finns det en bra restaurang."], feedback: [{ contains: "det är en bra", tip: "Er is (bestaat, is aanwezig) = det finns." }] }
          - { id: g7g4, type: translate, prompt: "Is er nog koffie?", answers: ["Finns det {mer |något |}kaffe[ kvar]?"] }
          - { id: 3q8g, type: translate, prompt: "Er zijn geen eieren.", answers: ["Det finns inga ägg."], feedback: [{ contains: "inte ägg", tip: "Geen + meervoud: inga." }] }
          - { id: cejj, type: translate, prompt: "Ik heb geen auto.", answers: ["Jag har {ingen|inte någon} bil."], feedback: [{ match: "Jag har inte en bil", tip: "Geen + en-woord: ingen. „Inte en” klinkt onnatuurlijk." }] }
          - { id: cs94, type: translate, prompt: "Er is geen melk meer.", answers: ["Det finns ingen mjölk kvar.", "Det finns inte {mer|någon} mjölk[ kvar]."] }
          - { id: 9yky, type: translate, prompt: "Zijn er nog kaartjes?", answers: ["Finns det [några ]biljetter kvar?"], topic: vragen }
          - { id: 66ym, type: translate, prompt: "In Zweden zijn veel meren.", answers: ["I Sverige finns det många sjöar.", "Det finns många sjöar i Sverige."], feedback: [{ contains: ["det är många sjöar", "är det många sjöar"], tip: "Er zijn (bestaan) = det finns." }, { contains: "sverige det finns", tip: "Na I Sverige vooraan komt eerst het werkwoord: I Sverige finns det …" }] }
          - { id: b45p, type: translate, prompt: "Wij hebben geen tijd.", answers: ["Vi har {ingen|inte|inte någon} tid."] }

      - id: restaurant-koppelen
        title: Aan tafel
        instruction: Koppel de Zweedse zin aan de betekenis.
        topic: mat-fraser
        items:
          - id: mnj2
            type: match
            pairs:
              - ["Jag skulle vilja ha …", "Ik zou graag … willen"]
              - ["Kan vi få notan?", "Mogen we de rekening?"]
              - ["Smaklig måltid!", "Eet smakelijk!"]
              - ["Skål!", "Proost!"]
              - ["Tack för maten!", "Bedankt voor het eten!"]
              - ["Det var jättegott!", "Het was heel lekker!"]

      - id: vertellen-verleden
        title: Vertellen over vroeger
        instruction: Zet de werkwoorden in de preteritum.
        topic: berattande
        items:
          - id: 5yxn
            type: gap
            text: "När jag var liten ___ (bo) vi i ett litet hus på landet. Varje sommar ___ (åka) vi till mormor. Där ___ (äta) vi jordgubbar och ___ (bada) i sjön."
            gaps:
              - { answers: ["bodde"] }
              - { answers: ["åkte"] }
              - { answers: ["åt"], feedback: [{ match: ["ätte", "ätade"], tip: "äta is sterk: åt." }] }
              - { answers: ["badade"] }
          - id: x5jj
            type: gap
            text: "Först ___ (gå) vi till stranden. Sedan ___ (köpa) pappa glass till alla. På kvällen ___ (grilla) vi korv och ___ (sjunga) sånger."
            gaps:
              - { answers: ["gick"] }
              - { answers: ["köpte"] }
              - { answers: ["grillade"] }
              - { answers: ["sjöng"], feedback: [{ match: ["sjungde", "sjungade"], tip: "sjunga is sterk: sjöng." }] }
          - id: tmav
            type: gap
            text: "Den dagen ___ (vara) det väldigt varmt. Vi ___ (ha) inget vatten, så vi ___ (bli) törstiga."
            gaps:
              - { answers: ["var"] }
              - { answers: ["hade"] }
              - { answers: ["blev"], feedback: [{ match: ["blidde", "blide"], tip: "bli is onregelmatig: blev." }] }
          - { id: 2ppy, type: gap, text: "Igår ___ (vakna) jag tidigt. Jag ___ (dricka) kaffe och ___ (läsa) tidningen.", gaps: [{ answers: ["vaknade"] }, { answers: ["drack"], feedback: [{ match: ["drickade", "drickte"], tip: "dricka is sterk: drack." }] }, { answers: ["läste"], feedback: [{ match: "läsade", tip: "läsa is een -er-werkwoord (läser): läste." }] }] }
          - { id: 86n4, type: gap, text: "I somras ___ (resa) vi till Norge. Vi ___ (bo) på ett hotell och ___ (se) fjällen.", gaps: [{ answers: ["reste"] }, { answers: ["bodde"] }, { answers: ["såg"], feedback: [{ match: ["sedde", "seed"], tip: "se is onregelmatig: såg." }] }] }
          - { id: cr95, type: gap, text: "På festen ___ (dansa) alla. Olle ___ (hålla) ett tal, och sedan ___ (äta) vi tårta.", gaps: [{ answers: ["dansade"] }, { answers: ["höll"], feedback: [{ match: ["hållde", "hålde"], tip: "hålla is sterk: höll." }] }, { answers: ["åt"], feedback: [{ match: ["ätte", "ätade"], tip: "äta is sterk: åt." }] }] }
          - { id: zz23, type: gap, text: "Förra vintern ___ (åka) vi till Kiruna. Det ___ (vara) minus trettio grader, men vi ___ (se) norrsken.", gaps: [{ answers: ["åkte"] }, { answers: ["var"] }, { answers: ["såg"], feedback: [{ match: ["sedde", "seed"], tip: "se is onregelmatig: såg." }] }] }
          - { id: uxtt, type: gap, text: "Olle ___ (vakna) sent. Han ___ (ta) en snabb dusch och ___ (springa) till bussen.", gaps: [{ answers: ["vaknade"] }, { answers: ["tog"], feedback: [{ match: ["tade", "tagde"], tip: "ta is sterk: tog." }] }, { answers: ["sprang"], feedback: [{ match: ["springade", "springde"], tip: "springa is sterk: sprang." }] }] }

      - id: verhaal-volgorde
        title: Het verhaal op volgorde
        instruction: Begin de zin met het gegeven woord.
        topic: berattande
        items:
          - { id: dn6x, type: order, start: "Först", tokens: ["vi", "åt", "middag"], answers: ["Först åt vi middag."] }
          - { id: shuk, type: order, start: "Sedan", tokens: ["Olle", "tal", "höll", "ett"], answers: ["Sedan höll Olle ett tal."] }
          - { id: b5bx, type: order, start: "Till slut", tokens: ["alla", "dansade"], answers: ["Till slut dansade alla."] }
          - { id: kgw8, type: order, start: "När festen var slut", tokens: ["gick", "vi", "hem"], answers: ["När festen var slut gick vi hem."] }
          - { id: ft79, type: order, start: "Efter middagen", tokens: ["vi", "kaffe", "drack"], answers: ["Efter middagen drack vi kaffe."] }
          - { id: 6hzm, type: order, start: "Sedan", tokens: ["till sjön", "gick", "alla"], answers: ["Sedan gick alla till sjön."] }
          - { id: tczs, type: order, start: "Klockan elva", tokens: ["hem", "åkte", "Fleur och Bram"], answers: ["Klockan elva åkte Fleur och Bram hem."] }
          - { id: khaw, type: order, start: "Till slut", tokens: ["somnade", "vi"], answers: ["Till slut somnade vi."] }

      - id: zoek-de-fout
        title: Zoek de fout
        instruction: In elke zin staat één fout. Klik op het foute woord en verbeter daarna de zin.
        topic: tycka-tro-tanka
        shuffle: true
        items:
