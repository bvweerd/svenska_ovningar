      - id: luisteren-gesprek
        title: "Luisteren: grillen bij het meer"
        instruction: Luister naar het gesprek. Is de bewering **rätt** of **fel**? Lees de tekst pas als je klaar bent.
        topic: vader
        listen: true
        textTitle: "Vid sjön"
        text: |
          Olle: Ska vi grilla vid sjön imorgon?

          Fleur: Gärna, men det ska regna imorgon.

          Olle: Bara på förmiddagen. På eftermiddagen blir det sol och tjugofem grader.

          Fleur: Vad bra! Jag tycker om när det är varmt.

          Olle: Det gör jag också. Ska vi bada?

          Fleur: Nej, inte jag. Vattnet är för kallt för mig!
        items:
          - { id: fupm, type: truefalse, statement: "Det ska regna på eftermiddagen.", answer: false }
          - { id: wj3q, type: truefalse, statement: "Det blir tjugofem grader.", answer: true }
          - { id: 2gqk, type: truefalse, statement: "Fleur vill bada.", answer: false }

