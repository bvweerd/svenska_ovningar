      - id: verbind-omvormen
        title: Maak er één zin van
        instruction: Maak één zin van de twee zinnen, met het woord tussen haakjes. Na *och, men, eller, för, så* en *utan* blijft de gewone volgorde.
        topic: konjunktioner
        items:
          - { id: uv2g, type: transform, prompt: "Det regnar. Vi stannar inne. (så)", answers: ["Det regnar[,] så vi stannar inne."], feedback: [{ contains: "så stannar vi", retry: true, tip: "Dat hoor je in spreektaal vaak, maar hier oefen je *så* als voegwoord (dus): daarna de gewone volgorde, eerst het onderwerp. Probeer het nog eens." }] }
          - { id: ku2w, type: transform, prompt: "Jag vill bada. Vattnet är för kallt. (men)", answers: ["Jag vill bada[,] men vattnet är för kallt."], feedback: [{ contains: "men är vattnet", tip: "Na *men* blijft de gewone volgorde: men vattnet är." }] }
          - { id: tqe8, type: transform, prompt: "Vi går hem. Det blir mörkt. (för)", answers: ["Vi går hem[,] för det blir mörkt."], feedback: [{ contains: "för blir det", tip: "Na *för* (want) blijft de gewone volgorde: för det blir." }] }
          - { id: bvxc, type: transform, prompt: "Olle fiskar. Wilma läser en bok. (och)", answers: ["Olle fiskar[,] och Wilma läser en bok."] }
          - { id: vekm, type: transform, prompt: "Ska vi grilla? Ska vi äta inne? (eller)", answers: ["Ska vi grilla[,] eller ska vi äta inne?", "Ska vi grilla eller äta inne?"] }
          - { id: 5q5a, type: transform, prompt: "Vi åker inte buss. Vi cyklar. (utan)", answers: ["Vi åker inte buss[,] utan vi cyklar.", "Vi åker inte buss[,] utan cyklar."], feedback: [{ contains: "men vi cyklar", tip: "Na een ontkenning (*inte*) gebruik je *utan* (maar wel)." }] }
          - { id: vfc9, type: transform, prompt: "Det är varmt. Vi äter ute. (så)", answers: ["Det är varmt[,] så vi äter ute."], feedback: [{ contains: "så äter vi", retry: true, tip: "Dat hoor je in spreektaal vaak, maar hier oefen je *så* als voegwoord (dus): daarna de gewone volgorde, eerst het onderwerp. Probeer het nog eens." }] }
          - { id: 8n7b, type: transform, prompt: "Fleur är trött. Hon har vandrat hela dagen. (för)", answers: ["Fleur är trött[,] för hon har vandrat hela dagen."], feedback: [{ contains: "för har hon", tip: "Na *för* (want) blijft de gewone volgorde: för hon har." }] }

      - id: wat-zeg-je
        title: Wat zeg je?
        instruction: Wat zeg je in het Zweeds? Er is vaak meer dan één goed antwoord.
        kind: situatie
        items:
          - { id: bnnn, type: translate, topic: ocksa-heller, prompt: "Iemand zegt: „Jag gillar inte regn.” Zeg dat jij het ook niet leuk vindt.", answers: ["{Inte jag heller|Det gör inte jag heller|Det gör jag inte heller}."], feedback: [{ contains: "Jag också", tip: "Bij een ontkenning: inte jag heller." }] }
          - { id: xgrr, type: translate, topic: ocksa-heller, prompt: "Iemand zegt: „Jag gillar sommaren.” Zeg dat jij dat ook doet.", answers: ["{Jag också|Det gör jag också|Jag med|Det gör jag med}.", "Jag gillar {också sommaren|den också}."], feedback: [{ contains: "Inte jag heller", tip: "Bij een bevestigende zin: jag också." }] }
          - { id: sh3k, type: translate, topic: konjunktioner, prompt: "Een vriend vraagt hoe het weer is. Zeg dat het regent, maar dat het warm is.", answers: ["Det regnar, men det är varmt[ ute]."], feedback: [{ contains: "men är det", tip: "men is een voegwoord: daarna blijft de gewone volgorde, men det är …" }, { match: "Det regnar, men det är varm.", tip: "Na det är krijgt het weerwoord een -t: varmt." }] }
          - { id: jmcf, type: translate, topic: konjunktioner, prompt: "Zeg dat je thuisblijft, want het sneeuwt.", answers: ["Jag stannar hemma, {för|för att|eftersom} det snöar."], feedback: [{ contains: "för snöar det", tip: "Na för blijft de gewone volgorde: för det snöar." }] }
          - { id: st7p, type: translate, topic: konjunktioner, prompt: "Zeg in twee zinnen dat het koud is en dat je daarom thuisblijft. Begin de tweede zin met *Därför*.", answers: ["Det är kallt[ ute][ idag]. Därför stannar jag hemma[ idag]."], feedback: [{ contains: "därför jag", tip: "*därför* is een bijwoord: daarna komt het werkwoord op plaats 2, *Därför **stannar jag** hemma*." }, { contains: "är kall.", tip: "Na *det är* krijgt het weerwoord een -t: *kallt*." }, { contains: "stannar jag hem.", tip: "Thuis (waar je bent) = *hemma*." }] }
          - { id: sbkc, type: translate, topic: konjunktioner, prompt: "Een vriend denkt dat je naar Spanje gaat. Zeg dat je niet naar Spanje gaat, maar naar Noorwegen.", answers: ["[Nej, ]jag {åker|ska åka|reser|ska resa} inte till Spanien[,] utan till Norge.", "[Nej, ]inte till Spanien[,] utan till Norge.", "[Nej, ]jag {åker|ska åka} till Norge[,] inte till Spanien."], feedback: [{ contains: "men till norge", tip: "Niet A maar B: na een ontkenning gebruik je *utan*." }, { contains: ["jag inte åker", "jag inte ska", "jag inte reser"], tip: "*inte* staat na het werkwoord: *jag åker inte …*" }] }
          - { id: aeeq, type: translate, topic: ocksa-heller, prompt: "Iemand zegt: „Jag kan inte åka skidor.” Zeg dat jij het ook niet kunt.", answers: ["{Inte jag heller|Det kan inte jag heller|Det kan jag inte heller|Jag kan inte det heller}."], feedback: [{ contains: "det gör", tip: "Bij *kan* herhaal je *kan*, niet *gör*: *Det kan inte jag heller*, of kort: *Inte jag heller*." }, { contains: ["också", "med"], tip: "Bij een ontkenning: *inte jag heller*." }] }
          - { id: 8u6f, type: translate, topic: ocksa-heller, prompt: "Iemand zegt: „Jag tycker inte om att tälta.” Zeg dat jij het wél leuk vindt.", answers: ["[Men ]{det gör jag|det tycker jag om|jag tycker om det|jag tycker om att tälta}[!]"], feedback: [{ contains: ["också", "med", "heller"], tip: "Je bent het níét eens: *Men det gör jag!*" }, { match: ["[Men ]{det tycker jag|det är jag}[!]"], tip: "Bij *tycker om* gebruik je *gör*: *Men det gör jag!*" }] }
          - { id: 2sb8, type: translate, topic: vader, prompt: "Een collega in Nederland belt. Zeg dat het hier vijf graden vriest en dat het sneeuwt.", answers: ["{Det är {fem minusgrader|minus fem[ grader]|fem grader kallt}[ här]|Här är det {fem minusgrader|minus fem[ grader]|fem grader kallt}}[,] och det snöar."], feedback: [{ contains: ["det är snö", "det sneeuwt", "det snöer"], tip: "Het sneeuwt = *det snöar*." }, { contains: ["och snöar det", "och snöar"], tip: "Na *och* blijft de gewone volgorde: *och det snöar*." }, { match: ["{Det är fem grader[ här]|Här är det fem grader}[,] och det snöar"], tip: "Vriezen: *fem minusgrader* (of *minus fem grader*)." }] }
          - { id: 53b8, type: translate, topic: allemansratten, prompt: "Je ziet iemand afval achterlaten in het bos. Zeg vriendelijk dat je geen afval in de natuur mag achterlaten.", answers: ["[Ursäkta, ]{man|du} får inte lämna skräp i {naturen|skogen}."], feedback: [{ contains: ["måste inte", "behöver inte"], tip: "Niet mogen = *får inte*." }, { contains: "får inte att", tip: "Na *får* komt geen *att*: *man får inte lämna …*" }, { contains: ["får inte lämnar", "får inte lämnade"], tip: "Na *får* komt de infinitief: *lämna*." }] }

