chapter: 7
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan zinnen verbinden met och, men, så, för en eller", topics: [konjunktioner] }
  - { text: "Ik kan instemmen met Det gör jag också en Inte jag heller", topics: [ocksa-heller] }
  - { text: "Ik kan over het weer en de natuur praten", topics: [vader, allemansratten] }

grammar:
  - id: konjunktioner
    title: Zinnen verbinden – och, men, eller, för, så, utan
    summary: "Na **och, men, eller, för, så, utan** blijft de woordvolgorde **gewoon** (geen inversie). Na een bijwoord zoals **därför** of **ändå** komt wél inversie, en ook na **så** als die een bijzin vooraan herhaalt (*Om det regnar, så stannar jag hemma*)."
    hint: "Na **och, men, så, för, utan** blijft de volgorde **gewoon**: onderwerp – werkwoord. Na een bijwoord als **därför** of **ändå** komt **inversie**: werkwoord – onderwerp."
    body: |
      Deze voegwoorden verbinden twee hoofdzinnen:

      | Zweeds | Betekenis | Voorbeeld |
      |---|---|---|
      | och | en | Fleur läser **och** Bram lagar mat. |
      | men | maar | Det är kallt, **men** solen skiner. |
      | eller | of | Vill du ha te **eller** kaffe? |
      | för | want | Vi äter glass, **för** det är varmt. |
      | så | dus, daarom | Nils är sjuk, **så** han stannar hemma. |
      | utan | maar (wel), na een ontkenning | Vi åker inte till Spanien **utan** till Grekland. |

      Na deze woorden komt de zin **gewoon**: onderwerp, dan werkwoord. Het voegwoord telt niet mee voor de V2-regel.

      In spreektaal hoor je na *så* (dus) vaak ook inversie: *Det regnar, så stannar jag hemma.* Schrijf hier de gewone volgorde; de app rekent de andere niet fout, maar vraagt je het nog eens te proberen.

      ### Pas op: bijwoorden
      Woorden als **därför** (daarom), **ändå** (toch), **sedan** (daarna) en **då** (dan) zijn géén voegwoorden. Ze staan op plaats 1, dus komt het werkwoord direct erna:

      | Voegwoord: geen inversie | Bijwoord: inversie |
      |---|---|
      | Det regnar, **så jag stannar** hemma. | Det regnar. **Därför stannar jag** hemma. |
      | Olle är trött, **men han jobbar** ändå. | Olle är trött. **Ändå jobbar han.** |

      ### så na een bijzin vooraan
      Begint de zin met een bijzin (*om …, när …, eftersom …*), dan kan er in spreektaal een extra **så** volgen. Die *så* is dan géén voegwoord: hij herhaalt de bijzin op plaats 1, dus komt het werkwoord er **direct** achter:

      - *Om det regnar, **så stannar jag** hemma.* (= *Om det regnar stannar jag hemma.*)
      - *När vi har ätit, **så går vi** ut.*

      Vergelijk: *Det regnar, **så jag stannar** hemma.* Daar betekent *så* „dus” en blijft de gewone volgorde.

  - id: ocksa-heller
    title: Ik ook! Ik ook niet!
    summary: "Eens zijn: **Det gör jag också.** Ook niet: **Inte jag heller.** Oneens: **Men det gör jag.** / **Det gör inte jag.** Gebruik *gör* in plaats van een gewoon werkwoord, maar herhaal *är, har, kan, ska*."
    body: |
      In het Zweeds herhaal je in een kort antwoord het werkwoord, met *det* vooraan.

      | Iemand zegt | Jij ook | Jij niet |
      |---|---|---|
      | Jag gillar glass. | **Det gör jag också.** | **Det gör inte jag.** |
      | Jag är trött. | **Det är jag också.** | **Det är inte jag.** |
      | Jag har en katt. | **Det har jag också.** | **Det har inte jag.** |
      | Jag kan simma. | **Det kan jag också.** | **Det kan inte jag.** |

      Bij een **gewoon werkwoord** (*gillar, bor, dricker* …) gebruik je **gör**. Bij *är, har* en modale werkwoorden (*kan, ska, vill* …) herhaal je dat werkwoord.

      ### Bij een ontkenning
      | Iemand zegt | Jij ook niet | Jij wel |
      |---|---|---|
      | Jag dricker inte kaffe. | **Inte jag heller.** | **Men det gör jag.** |
      | Jag kan inte simma. | **Inte jag heller.** | **Men det kan jag.** |

      *Också* = ook, *inte … heller* = ook niet.

  - id: vader
    title: Het weer
    summary: "*Det regnar, det snöar, det blåser, solen skiner.* Temperatuur: *Det är 20 grader varmt*, *Det är fem minusgrader*."
    hint: "Het weer: **det** + werkwoord in de goede tijd, of **det är** + bijvoeglijk naamwoord met **-t** (*det* telt als ett-woord)."
    body: |
      | Zweeds | Nederlands |
      |---|---|
      | Hur är vädret? | Hoe is het weer? |
      | Det regnar. | Het regent. |
      | Det snöar. | Het sneeuwt. |
      | Det blåser. | Het waait. |
      | Solen skiner. | De zon schijnt. |
      | Det är soligt / molnigt. | Het is zonnig / bewolkt. |
      | Det är varmt / kallt. | Het is warm / koud. |
      | Det är 20 grader varmt. | Het is 20 graden. |
      | Det är fem minusgrader. | Het vriest vijf graden. |

      Let op: na *det är* krijgt het bijvoeglijk naamwoord een **-t**: *det är varm**t**, det är kall**t***. In hoofdstuk 12 leer je waarom.

  - id: allemansratten
    title: Allemansrätten
    summary: "In Zweden mag iedereen de natuur in: wandelen, een nacht kamperen, bessen en paddenstoelen plukken. Regel: **inte störa – inte förstöra** (niet storen, niet vernielen)."
    body: |
      Dankzij de **allemansrätten** (het allemansrecht) mag iedereen in Zweden vrij de natuur in, ook op grond van een ander. Er hoort wel verantwoordelijkheid bij.

      | Du får … | Du får inte … |
      |---|---|
      | gå, cykla och åka skidor i naturen | gå genom någons trädgård |
      | tälta en natt (inte för nära ett hus) | köra bil i terrängen |
      | plocka bär, svamp och blommor (de meeste) | elda när det är eldningsförbud |
      | bada i sjöar och i havet | lämna skräp i naturen |

      *Eldningsförbud* (stookverbod) geldt vaak in de zomer, als het droog is.

sections:
  - id: oefeningen
    title: Oefeningen
    exercises:
      - id: voegwoord-kiezen
        title: Welk voegwoord?
        instruction: Kies het voegwoord dat past.
        topic: konjunktioner
        shuffle: true
        items:
          - { id: f3fa, type: gap, text: "Jag åker hem nu, ___ jag har huvudvärk.", gaps: [{ answers: ["för"], options: ["och", "men", "eller", "för", "så"], shuffle: false }] }
          - { id: 8wmc, type: gap, text: "Wilma har ett prov imorgon, ___ hon pluggar hela kvällen.", gaps: [{ answers: ["så"], options: ["och", "men", "eller", "för", "så"], shuffle: false, feedback: [{ match: "för", tip: "för geeft de reden (want). Hier volgt een gevolg: så (dus)." }] }] }
          - { id: m9n9, type: gap, text: "Vill du ha te ___ kaffe?", gaps: [{ answers: ["eller"], options: ["och", "men", "eller", "för", "så"], shuffle: false }] }
          - { id: c4g3, type: gap, text: "Jag tror att Olle kommer, ___ jag är inte säker.", gaps: [{ answers: ["men"], options: ["och", "men", "eller", "för", "så"], shuffle: false }] }
          - { id: k5h5, type: gap, text: "Fleur läser en bok ___ Bram lagar mat.", gaps: [{ answers: ["och"], options: ["och", "men", "eller", "för", "så"], shuffle: false }] }
          - { id: t9g9, type: gap, text: "Vi äter glass, ___ det är så varmt idag.", gaps: [{ answers: ["för"], options: ["och", "men", "eller", "för", "så"], shuffle: false, feedback: [{ match: "så", tip: "så geeft het gevolg (dus). Hier volgt de reden: för (want)." }] }] }
          - { id: 3w6h, type: gap, text: "Det regnar, ___ vi går ut ändå.", gaps: [{ answers: ["men"], options: ["och", "men", "eller", "för", "så"], shuffle: false }] }
          - { id: bxm5, type: gap, text: "Ska vi gå på bio ___ stanna hemma?", gaps: [{ answers: ["eller"], options: ["och", "men", "eller", "för", "så"], shuffle: false }] }

      - id: men-utan
        title: Men of utan?
        instruction: Kies *men* of *utan*.
        topic: konjunktioner
        shuffle: true
        items:
          - { id: 5bhy, type: gap, text: "Vi åker inte till Spanien ___ till Grekland.", gaps: [{ answers: ["utan"], options: ["men", "utan"], shuffle: false, feedback: [{ match: "men", tip: "Na een ontkenning, als je het eerste vervangt door iets anders („niet A maar B”): utan." }] }] }
          - { id: fuys, type: gap, text: "Det är inte varmt, ___ det är soligt.", gaps: [{ answers: ["men"], options: ["men", "utan"], shuffle: false, feedback: [{ match: "utan", tip: "Hier vervang je niets; je zet twee dingen tegenover elkaar: men." }] }] }
          - { id: kjkd, type: gap, text: "Bram dricker inte kaffe ___ te.", gaps: [{ answers: ["utan"], options: ["men", "utan"], shuffle: false }] }
          - { id: vcju, type: gap, text: "Nils är liten, ___ han är stark.", gaps: [{ answers: ["men"], options: ["men", "utan"], shuffle: false }] }
          - { id: 7pbr, type: gap, text: "Wilma spelar inte piano ___ gitarr.", gaps: [{ answers: ["utan"], options: ["men", "utan"], shuffle: false, feedback: [{ match: "men", tip: "Niet A maar B (je vervangt piano door gitarr): utan." }] }] }
          - { id: epwu, type: gap, text: "Det är kallt ute, ___ solen skiner.", gaps: [{ answers: ["men"], options: ["men", "utan"], shuffle: false, feedback: [{ match: "utan", tip: "Er staat geen ontkenning; je zet twee dingen tegenover elkaar: men." }] }] }
          - { id: rhya, type: gap, text: "Vi bor inte i Stockholm ___ i Västerås.", gaps: [{ answers: ["utan"], options: ["men", "utan"], shuffle: false }] }
          - { id: 6wtx, type: gap, text: "Maten är god, ___ den är lite dyr.", gaps: [{ answers: ["men"], options: ["men", "utan"], shuffle: false }] }

      - id: sa-darfor
        title: Så of därför?
        instruction: Maak de zin af. Let op het verschil tussen een voegwoord en een bijwoord.
        topic: konjunktioner
        items:
          - { id: et78, type: order, start: "Det regnar, så", tokens: ["jag", "stannar", "hemma"], answers: ["Det regnar, så jag stannar hemma."], feedback: [{ match: "Det regnar, så stannar jag hemma.", retry: true, tip: "Dat hoor je in spreektaal vaak, maar hier oefen je *så* als voegwoord (dus): daarna de gewone volgorde, eerst het onderwerp. Probeer het nog eens." }] }
          - { id: 79a2, type: order, start: "Det regnar. Därför", tokens: ["stannar", "jag", "hemma"], answers: ["Det regnar. Därför stannar jag hemma."], feedback: [{ match: "Det regnar. Därför jag stannar hemma.", tip: "Därför is een bijwoord op plaats 1: het werkwoord komt er direct achter." }] }
          - { id: exnq, type: order, start: "Olle är trött, men", tokens: ["han", "jobbar", "ändå"], answers: ["Olle är trött, men han jobbar ändå."], feedback: [{ match: "Olle är trött, men jobbar han ändå.", tip: "men is een voegwoord: daarna blijft de gewone volgorde, men han jobbar …" }] }
          - { id: z5vk, type: order, start: "Olle är trött. Ändå", tokens: ["han", "jobbar"], answers: ["Olle är trött. Ändå jobbar han."], feedback: [{ match: "Olle är trött. Ändå han jobbar.", tip: "Ändå is een bijwoord op plaats 1: het werkwoord komt er direct achter." }] }
          - { id: 6ehb, type: order, start: "Jag tar inte bussen, utan", tokens: ["jag", "cyklar"], answers: ["Jag tar inte bussen, utan jag cyklar."], feedback: [{ match: "Jag tar inte bussen, utan cyklar jag.", tip: "utan is een voegwoord: daarna blijft de gewone volgorde, utan jag cyklar." }] }
          - { id: bcv4, type: order, start: "Jag är hungrig, så", tokens: ["äter", "jag", "en smörgås"], answers: ["Jag är hungrig, så jag äter en smörgås."], feedback: [{ match: "Jag är hungrig, så äter jag en smörgås.", retry: true, tip: "Dat hoor je in spreektaal vaak, maar hier oefen je *så* als voegwoord (dus): daarna de gewone volgorde, eerst het onderwerp. Probeer het nog eens." }] }
          - { id: qfwk, type: order, start: "Jag är hungrig. Därför", tokens: ["jag", "äter", "en smörgås"], answers: ["Jag är hungrig. Därför äter jag en smörgås."], feedback: [{ match: "Jag är hungrig. Därför jag äter en smörgås.", tip: "Därför is een bijwoord op plaats 1: het werkwoord komt er direct achter." }] }
          - { id: zfzr, type: order, start: "Det är kallt, men", tokens: ["badar", "vi", "ändå"], answers: ["Det är kallt, men vi badar ändå."], feedback: [{ match: "Det är kallt, men badar vi ändå.", tip: "men is een voegwoord: daarna blijft de gewone volgorde, men vi badar …" }] }

      - id: zinnen-verbinden
        title: Verbind de zinnen
        instruction: Vertaal naar het Zweeds.
        topic: konjunktioner
        items:
          - { id: ky8a, type: translate, prompt: "Het is koud, dus ik trek een jas aan.", answers: ["Det är kallt, så jag {tar|sätter} på mig {en jacka|en rock|en kappa|jackan|rocken|kappan}."], feedback: [{ contains: "så tar jag", retry: true, tip: "Dat hoor je in spreektaal vaak, maar hier oefen je *så* als voegwoord (dus): daarna de gewone volgorde, eerst het onderwerp. Probeer het nog eens." }] }
          - { id: 7dx6, type: translate, prompt: "Ik ga naar huis, want ik ben moe.", answers: ["Jag {går|åker} hem, för jag är trött."], feedback: [{ contains: "går hemma", tip: "Naar huis is een richting: hem." }] }
          - { id: 8b4p, type: translate, prompt: "Het regent. Daarom blijven we binnen.", answers: ["Det regnar. Därför stannar vi {inne|inomhus}."], feedback: [{ contains: "därför vi", tip: "därför is een bijwoord: daarna komt eerst het werkwoord." }] }
          - { id: g9ck, type: translate, prompt: "Wil je zwemmen of wandelen?", answers: ["Vill du {bada|simma} eller {vandra|promenera|gå en promenad|ta en promenad}?"] }
          - { id: wez3, type: translate, prompt: "Nils is moe, maar hij speelt toch voetbal.", answers: ["Nils är trött, men han spelar {fotboll ändå|ändå fotboll}."], feedback: [{ contains: "men spelar han", tip: "Na het voegwoord men blijft de gewone volgorde: men han spelar …" }] }
          - { id: ce9x, type: translate, prompt: "We gaan niet met de bus, maar we fietsen.", answers: ["Vi {åker inte buss|åker inte med bussen|tar inte bussen}, utan [vi ]cyklar."], feedback: [{ contains: "men vi cyklar", tip: "Na een ontkenning, als je iets vervangt door iets anders: utan." }] }
          - { id: yyvj, type: translate, prompt: "Het is warm. Daarom zwemmen we in het meer.", answers: ["Det är varmt. Därför {badar|simmar} vi i sjön."], feedback: [{ contains: "därför vi", tip: "därför is een bijwoord: daarna komt eerst het werkwoord." }] }
          - { id: b5q8, type: translate, prompt: "Wilma heeft honger, dus ze eet een appel.", answers: ["Wilma är hungrig[,] så hon äter ett äpple."], feedback: [{ contains: "så äter hon", retry: true, tip: "Dat hoor je in spreektaal vaak, maar hier oefen je *så* als voegwoord (dus): daarna de gewone volgorde, eerst het onderwerp. Probeer het nog eens." }, { contains: "har hunger", tip: "Honger hebben = vara hungrig." }] }

      - id: ik-ook
        title: Ik ook!
        instruction: Kies de goede reactie.
        topic: ocksa-heller
        shuffle: true
        items:
          - { id: zf4g, type: mc, prompt: "– Jag gillar glass. – (Jij ook.)", options: ["Det gör jag också.", "Det är jag också.", "Inte jag heller."], answer: 0, tip: "gillar is een gewoon werkwoord: dan gebruik je gör." }
          - { id: 4yfa, type: mc, prompt: "– Jag är trött. – (Jij ook.)", options: ["Det gör jag också.", "Det är jag också.", "Inte jag heller."], answer: 1, tip: "Bij är herhaal je är." }
          - { id: c72k, type: mc, prompt: "– Jag kan inte simma. – (Jij ook niet.)", options: ["Det kan jag också.", "Inte jag heller.", "Det gör jag också."], answer: 1, tip: "Ook niet: Inte jag heller." }
          - { id: suza, type: mc, prompt: "– Jag har en katt. – (Jij ook.)", options: ["Det gör jag också.", "Det har jag också.", "Jag har också."], answer: 1, tip: "Bij har herhaal je har." }
          - { id: byzm, type: mc, prompt: "– Jag dricker inte kaffe. – (Jij wel.)", options: ["Men det gör jag.", "Inte jag heller.", "Det gör inte jag."], answer: 0, tip: "De ander doet het niet, jij wel: Men det gör jag." }
          - { id: cnyu, type: mc, prompt: "– Jag tycker om vintern. – (Jij niet.)", options: ["Det gör inte jag.", "Inte jag heller.", "Men det gör jag."], answer: 0, tip: "De ander wel, jij niet: Det gör inte jag." }
          - { id: cu3g, type: mc, prompt: "– Jag bor i Sverige. – (Jij ook.)", options: ["Det gör jag också.", "Det bor jag också.", "Inte jag heller."], answer: 0, tip: "bor is een gewoon werkwoord: dan gebruik je gör." }
          - { id: 3nxk, type: mc, prompt: "– Jag har ingen bil. – (Jij ook niet.)", options: ["Inte jag heller.", "Det har jag också.", "Men det har jag."], answer: 0, tip: "Ook niet: Inte jag heller." }

      - id: ik-ook-vertalen
        title: Ik ook – zelf schrijven
        instruction: Reageer in het Zweeds.
        topic: ocksa-heller
        items:
          - { id: h5t5, type: translate, prompt: "– Jag bor i Västerås. – Ik ook.", answers: ["Det gör jag också."], feedback: [{ match: ["Jag också", "Jag bor också i Västerås"], tip: "Dat kan in spreektaal, maar oefen hier de korte vorm: Det gör jag också." }, { match: "Det bor jag också", tip: "Bij een gewoon werkwoord (bor) gebruik je gör." }] }
          - { id: ex9t, type: translate, prompt: "– Jag har två barn. – Ik ook.", answers: ["Det har jag också."], feedback: [{ match: "Det gör jag också", tip: "Bij har herhaal je har." }] }
          - { id: 4w37, type: translate, prompt: "– Jag ska åka till Gotland. – Ik ook.", answers: ["Det ska jag också."], feedback: [{ match: "Det gör jag också.", tip: "Bij ska herhaal je ska: Det ska jag också." }] }
          - { id: yapn, type: translate, prompt: "– Jag förstår inte. – Ik ook niet.", answers: ["Inte jag heller.", "Det gör inte jag heller."], feedback: [{ contains: "också", tip: "Bij een ontkenning: heller in plaats van också." }] }
          - { id: kdcd, type: translate, prompt: "– Jag jobbar hemma idag. – Ik niet.", answers: ["Det gör inte jag.", "Inte jag."] }
          - { id: qvbs, type: translate, prompt: "– Jag är hungrig. – Ik ook.", answers: ["Det är jag också."], feedback: [{ match: "Det gör jag också", tip: "Bij är herhaal je är." }, { match: ["Jag också", "Jag är också hungrig"], tip: "Dat kan in spreektaal, maar oefen hier de korte vorm: Det är jag också." }] }
          - { id: g443, type: translate, prompt: "– Jag kan inte simma. – Ik ook niet.", answers: ["Inte jag heller.", "Det kan {inte jag|jag inte} heller."], feedback: [{ contains: "också", tip: "Bij een ontkenning: heller in plaats van också." }] }
          - { id: hyu8, type: translate, prompt: "– Jag gillar inte regn. – Ik wel.", answers: ["Men det gör jag.", "Det gör jag."], feedback: [{ match: ["Det gör jag också.","Inte jag heller."], tip: "De ander houdt níet van regen en jij wel: Men det gör jag." }] }

      - id: weer-koppelen
        title: Het weer
        instruction: Koppel de zin aan de betekenis.
        topic: vader
        items:
          - id: 29vk
            type: match
            pairs:
              - ["Det regnar.", "Het regent."]
              - ["Det snöar.", "Het sneeuwt."]
              - ["Det blåser.", "Het waait."]
              - ["Solen skiner.", "De zon schijnt."]
              - ["Det är molnigt.", "Het is bewolkt."]
              - ["Det är fem minusgrader.", "Het vriest vijf graden."]

      - id: weer-invullen
        title: Hoe is het weer?
        instruction: Vul het juiste woord in.
        topic: vader
        shuffle: true
        items:
          - { id: vzg8, type: gap, text: "Ta med paraplyet, det ___ (regna)!", gaps: [{ answers: ["regnar"] }] }
          - { id: 5dub, type: gap, text: "I januari ___ (snöa) det ofta i Kiruna.", gaps: [{ answers: ["snöar"] }] }
          - { id: 9sx6, type: gap, text: "Idag är det 25 grader. Det är ___ (warm).", gaps: [{ answers: ["varmt"], feedback: [{ match: "varm", tip: "Na det är krijgt het weerwoord een -t: varmt." }] }] }
          - { id: 23yh, type: gap, text: "Ta på dig mössan, det är ___ (koud)!", gaps: [{ answers: ["kallt"], feedback: [{ match: ["kall", "kalt"], tip: "Na det är: kall + t = kallt." }] }] }
          - { id: u88h, type: gap, text: "Det ___ (blåsa) mycket vid havet.", gaps: [{ answers: ["blåser"] }] }
          - { id: jddf, type: gap, text: "Det är ___ (zonnig) idag.", gaps: [{ answers: ["soligt"], feedback: [{ match: "solig", tip: "Na det är krijgt het weerwoord een -t: soligt." }] }] }
          - { id: nrep, type: gap, text: "Det ___ (åska) ikväll, så stanna inne!", gaps: [{ answers: ["åskar"] }] }
          - { id: 5ujr, type: gap, text: "Det är ___ (bewolkt), men det regnar inte.", gaps: [{ answers: ["molnigt"], feedback: [{ match: "molnig", tip: "Na det är krijgt het weerwoord een -t: molnigt." }] }] }

      - id: allemansrecht
        title: Mag dat?
        instruction: Wat zegt het allemansrecht? Is de zin **rätt** of **fel**?
        topic: allemansratten
        shuffle: true
        items:
          - { id: g3y8, type: truefalse, statement: "Du får plocka blåbär i skogen.", answer: true }
          - { id: wber, type: truefalse, statement: "Du får tälta en natt i skogen, men inte för nära ett hus.", answer: true }
          - { id: st7g, type: truefalse, statement: "Du får göra upp eld när det är eldningsförbud.", answer: false, tip: "Bij een stookverbod mag je geen vuur maken." }
          - { id: ws7p, type: truefalse, statement: "Du får gå genom någons trädgård.", answer: false, tip: "Een tuin bij iemands huis is privé." }
          - { id: 9vfn, type: truefalse, statement: "Du får bada i sjön.", answer: true }
          - { id: 5erf, type: truefalse, statement: "Du får köra bil i skogen där det inte finns någon väg.", answer: false, tip: "Met een auto mag je niet de natuur in (terrängen)." }
          - { id: rxgc, type: truefalse, statement: "Du får lämna skräp i naturen.", answer: false, tip: "Je neemt je afval altijd mee." }
          - { id: 6jsr, type: truefalse, statement: "Du får plocka svamp i skogen.", answer: true }

      - id: woorden-natuur
        title: "Woorden in een zin: weer en natuur"
        instruction: Kies het woord dat past.
        topic: woordenschat
