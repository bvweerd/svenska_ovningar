      - id: lezen-stuga
        title: "Lezen: een weekend in het zomerhuisje"
        instruction: Lees de tekst. Is de bewering **rätt** of **fel**? Is hij fout, schrijf dan de juiste zin op.
        topic: konjunktioner
        textTitle: Helg i stugan
        text: |
          Förra helgen var Fleur och Bram i Olle och Ingrids stuga vid en sjö i Dalarna. På lördagen var det soligt och varmt, så de badade i sjön och plockade blåbär i skogen. Bram ville grilla, men det var eldningsförbud, så de åt sallad i stället.

          På söndagen regnade det hela dagen. Olle och Bram spelade kort, men Fleur och Ingrid tog på sig regnkläder och gick en lång promenad. Fleur älskar regn – men det gör inte Bram!

          Sent på kvällen slutade det regna, och det blev soligt igen. Olle och Bram rodde ut på sjön. Vid stranden såg de en älg! Bram ville ta ett foto, men älgen gick in i skogen. Bram var ändå glad, för det var så tyst och skönt på sjön.

          På måndagen åkte Fleur och Bram hem till Västerås. Fleur ville inte åka hem, och inte Bram heller. Nästa sommar vill de tälta i fjällen!
        items:
          - { id: cgn3, type: truefalse, statement: "Stugan ligger vid en sjö.", answer: true }
          - { id: umkh, type: truefalse, statement: "På lördagen regnade det.", answer: false, tip: "Hoe was het weer op zaterdag?", correction: { answers: ["På lördagen var det soligt och varmt.", "På lördagen var det {soligt|varmt}."] } }
          - { id: gp35, type: truefalse, statement: "De grillade på lördagen.", answer: false, tip: "Waarom niet?", correction: { answers: ["De grillade inte, för det var eldningsförbud.", "De grillade inte.", "De åt sallad i stället."] } }
          - { id: w2rb, type: truefalse, statement: "De plockade blåbär.", answer: true }
          - { id: sexs, type: truefalse, statement: "Bram tycker om regn.", answer: false, tip: "Lees het eind van de tweede alinea.", correction: { answers: ["{Bram|Han} tycker inte om regn.", "{Bram|Han} älskar inte regn."] } }
          - { id: amxh, type: truefalse, statement: "På söndagen gick Fleur och Ingrid en promenad.", answer: true }
          - { id: y3zv, type: truefalse, statement: "Bram tog ett foto av älgen.", answer: false, tip: "Wat deed de eland?", correction: { answers: ["{Bram|Han} tog inte [ett ]foto[ av älgen].", "{Bram|Han} tog inget foto[ av älgen].", "{Bram|Han} fotograferade inte älgen.", "Älgen {gick|sprang} in i skogen.", "{Bram|Han} ville ta ett foto, men älgen {gick|sprang} in i skogen."] } }
          - { id: 8yta, type: truefalse, statement: "Fleur ville åka hem på måndagen.", answer: false, tip: "Lees de laatste alinea.", correction: { answers: ["{Fleur|Hon} ville inte åka hem[ till Västerås][ på måndagen].", "{Fleur|Hon} ville stanna[ i stugan]."] } }
          - { id: zb6e, type: truefalse, statement: "Bram ville inte heller åka hem.", answer: true }
          - { id: f7w7, type: truefalse, statement: "Nästa sommar vill de bo på hotell i fjällen.", answer: false, tip: "Waar willen ze slapen?", correction: { answers: ["Nästa sommar vill de {tälta|bo i tält|sova i tält}[ i fjällen].", "De vill {tälta|bo i tält|sova i tält}[ i fjällen].", "Nästa sommar vill de inte bo på hotell[ i fjällen].", "De vill inte bo på hotell[ i fjällen]."] } }

      - id: makkelijk-1
        title: "Makkelijk lezen: Regn i stugan"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Regn i stugan"
        text: |
          Familjen Ek har en stuga vid en sjö. I juli var de där i två veckor. Det regnade mycket, men de hade ändå roligt. De spelade spel och läste böcker. En dag sken solen, så de badade och plockade blåbär. Nils gillar inte regn, och det gör inte Wilma heller.
        items:
          - { id: t6y5, type: truefalse, statement: "Det regnade mycket.", answer: true }
          - { id: frqb, type: truefalse, statement: "Wilma gillar regn.", answer: false }

      - id: makkelijk-2
        title: "Makkelijk lezen: Tält i fjällen"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Tält i fjällen"
        text: |
          Olle och Wilma vandrade i fjällen. De sov i tält, för de ville vara ute i naturen. Det var kallt på natten, men de frös inte. På morgonen var det soligt. De såg en älg vid en sjö. Wilma ville ta ett foto, men älgen sprang in i skogen.
        items:
          - { id: 8dmd, type: truefalse, statement: "De sov på ett hotell.", answer: false }
          - { id: ptaa, type: truefalse, statement: "De såg en älg.", answer: true }

      - id: makkelijk-3
        title: "Makkelijk lezen: Svamp i skogen"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Svamp i skogen"
        text: |
          I september gick Ingrid och Fleur till skogen. De ville plocka svamp. Det var molnigt, men det regnade inte. I Sverige får alla vara i skogen och plocka svamp och blåbär. Ingrid hittade mycket svamp. Fleur hittade inte så mycket, men hon plockade blåbär. På kvällen lagade de mat med svampen.
        items:
          - { id: 44ky, type: truefalse, statement: "Det regnade i skogen.", answer: false }
          - { id: v52g, type: mc, prompt: "Vad plockade Fleur?", options: ["Bara svamp.", "Blåbär.", "Ingenting."], answer: 1 }
          - { id: 8nmn, type: truefalse, statement: "I Sverige får man plocka blåbär i skogen.", answer: true }

      - id: makkelijk-4
        title: "Makkelijk lezen: Vädret i veckan"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Vädret i veckan"
        text: |
          Nils lyssnar på väderprognosen på radion. På måndag blir det sol och tjugo grader. På tisdag blir det varmt också, men på onsdag kommer regnet. På torsdag blir det blåsigt. Nils vill bada på måndag, och det vill Wilma också. Olle vill inte bada, och det vill inte Ingrid heller. De vill hellre fiska.
        items:
          - { id: yd25, type: mc, prompt: "När kommer regnet?", options: ["På måndag.", "På tisdag.", "På onsdag."], answer: 2 }
          - { id: ag7f, type: truefalse, statement: "Ingrid vill bada.", answer: false }
          - { id: hbwe, type: truefalse, statement: "Wilma vill bada på måndag.", answer: true }

      - id: dialoog-zomerdag
        title: Wat gaan we doen?
        instruction: Zet het gesprek tussen Wilma en Nils in de goede volgorde.
        topic: konjunktioner
        items:
          - id: k4h5
            type: dialogue
            lines:
              - "Wilma: Vad ska vi göra idag?"
              - "Nils: Vi kan bada i sjön!"
              - "Wilma: Nej, det är för kallt. Det är bara femton grader."
              - "Nils: Men vi kan cykla till skogen och plocka svamp."
              - "Wilma: Okej, men det ska regna i eftermiddag, så vi måste vara hemma klockan tre."
              - "Nils: Det är lugnt. Vi tar med regnjackor."

      - id: taak-till-sjon
        title: "Taak: naar het meer"
        kind: taak
        instruction: "Je vriendin Wilma belt. Ze wil dit weekend met je naar het meer. Het weerbericht: zaterdag regent het, zondag wordt het zonnig en vijfentwintig graden. Je zwemt graag, net als Wilma, en je wilt ook niet fietsen: het is te ver. Het is stookverbod (*eldningsförbud*). **Doel:** spreek een dag af en wat jullie meenemen. Kies of schrijf bij elke stap wat jij zegt."
        topic: konjunktioner
        items:
          - id: vmct
            type: steps
            explain: "Gelukt: jullie gaan zondag naar het meer, met broodjes of salade, en jullie maken geen vuur."
            steps:
              - type: mc
                topic: konjunktioner
                prompt: "**Wilma:** Ska vi åka till sjön på lördag? — *Zaterdag regent het. Stel zondag voor.*"
                options:
                  - "På lördag regnar det, men på söndag blir det soligt."
                  - "På lördag det regnar, men på söndag blir det soligt."
                  - "På lördag regnar det, utan på söndag blir det soligt."
                  - "På lördag regnar det, men på söndag blir det molnigt."
                answer: 0
                optionTips:
                  - null
                  - "Na *På lördag* vooraan komt het werkwoord op plaats 2: *på lördag **regnar det***."
                  - "*utan* gebruik je alleen na een ontkenning (*inte A utan B*). Hier: *men*."
                  - "*molnigt* is bewolkt. Zondag wordt het zonnig: *soligt*."
              - type: translate
                topic: vader
                prompt: "**Wilma:** Söndag, okej! Hur varmt blir det? — *Zeg: vijfentwintig graden.*"
                answers:
                  - "[Det blir ]tjugofem grader[ varmt]."
                feedback:
                  - { contains: "25", tip: "Schrijf het getal voluit: *tjugofem*." }
                  - { contains: ["femtjugo", "fem och tjugo", "femochtjugo"], tip: "25 = *tjugofem*: eerst het tiental, dan de eenheid." }
                  - { contains: "tjugo fem", tip: "Getallen schrijf je aan elkaar: *tjugofem*." }
              - type: translate
                topic: ocksa-heller
                prompt: "**Wilma:** Härligt! Jag älskar att bada. — *Zeg dat jij dat ook doet.*"
                answers:
                  - "{Det gör jag också|Jag också|Det gör jag med|Jag med}[!]"
                  - "{Det älskar jag också|Jag älskar också att bada|Jag älskar det också}[!]"
                feedback:
                  - { contains: "det är jag", tip: "Bij een gewoon werkwoord (*älskar*) gebruik je *gör*: *Det gör jag också.*" }
                  - { contains: "heller", tip: "*heller* is alleen bij een ontkenning. Hier: *Det gör jag också.*" }
              - type: gap
                topic: konjunktioner
                prompt: "**Wilma:** Ska vi grilla korv vid sjön? — *Het is stookverbod.*"
                text: "Nej, det är eldningsförbud, ___ vi kan inte grilla."
                gaps:
                  - answers: ["så"]
                    options: ["så", "för", "men", "utan"]
                    feedback:
                      - { match: "för", tip: "*för* = want (een reden). Niet kunnen grillen is het gevolg van het stookverbod: *så* (dus)." }
                      - { match: "men", tip: "*men* = maar. Niet kunnen grillen is het gevolg: *så* (dus)." }
                      - { match: "utan", tip: "*utan* komt alleen na een ontkenning (*inte A utan B*). Hier: *så* (dus)." }
              - type: translate
                topic: konjunktioner
                prompt: "**Wilma:** Synd. Vad tar vi med då? — *Zeg: broodjes of salade.*"
                answers:
                  - "[Vi {tar med|kan ta med} ]{smörgåsar eller sallad|sallad eller smörgåsar}."
                feedback:
                  - { contains: [" och "], tip: "Of = *eller*: *smörgåsar eller sallad*." }
                  - { contains: ["kan tar", "kan att"], tip: "Na *kan* komt de infinitief zonder *att*: *vi kan ta med …*" }
                  - { contains: ["smörgåser", "smörgåsor"], tip: "Meervoud van *smörgås*: *smörgåsar*." }
              - type: translate
                topic: ocksa-heller
                prompt: "**Wilma:** Jag vill inte cykla dit. Det är för långt. — *Zeg dat jij het ook niet wilt.*"
                answers:
                  - "{Inte jag heller|Det vill inte jag heller|Det vill jag inte heller}[. {Vi tar bussen|Vi kan ta bussen|Vi {åker|kan åka} buss[en]}]."
                feedback:
                  - { match: ["{Jag med|Jag också|Det vill jag med|Det vill jag också}"], tip: "Bij een ontkenning: *Inte jag heller*." }
                  - { contains: "det gör", tip: "Bij *vill* herhaal je *vill*: *Det vill inte jag heller*, of kort: *Inte jag heller*." }

      - id: schrijven-weer
        title: "Schrijven: zomer of winter?"
        instruction: "Bouw eerst je tekst op in vier stappen die de app nakijkt. Daarna schrijf je, als je wilt, over je eigen favoriete seizoen."
        topic: konjunktioner
        items:
          - { id: 7x6t, type: mc, prompt: "Kies de beste openingszin.", options: ["Jag tycker mest om sommaren, för då är det varmt.", "Jag tycker mest om sommaren, för då det är varmt.", "Jag tycker mest om sommaren, för det då är varmt."], answer: 0, tip: "Na för komt een gewone hoofdzin. Begint die met då, dan volgt het werkwoord: då är det." }
          - { id: yr2x, type: translate, topic: vader, prompt: "In de herfst regent het vaak.", answers: ["På hösten regnar det ofta.", "Det regnar ofta på hösten."], feedback: [{ contains: "hösten det regnar", tip: "Begin je met På hösten, dan komt het werkwoord op plaats 2: På hösten regnar det …" }] }
          - { id: c72y, type: gap, prompt: "Kies het woord dat past.", text: "På vintern är det kallt och mörkt, ___ jag stannar mest inne.", gaps: [{ answers: ["så"], options: ["så", "för", "men"], tip: "Binnen blijven is het gevolg van de kou: så (dus)." }] }
          - { id: j2f2, type: order, prompt: "Maak de zin af: waarom blijf je binnen?", start: "Jag stannar inne, för", tokens: ["det", "regnar", "idag"], answers: ["Jag stannar inne, för det regnar idag.", "Jag stannar inne, för idag regnar det."] }
          - id: gkdz
            type: free
            prompt: "Vertel welk seizoen je het leukst vindt, hoe het weer dan is en wat je dan graag doet. Verbind je zinnen met och, men, för of så."
            minWords: 30
            require:
              - { any: ["för", "så", "men"], label: "Je verbindt zinnen met för, så of men" }
              - { any: ["regnar", "snöar", "blåser", "solen", "varmt", "kallt", "grader", "soligt"], label: "Je beschrijft het weer" }
              - { any: ["sommaren", "vintern", "hösten", "våren", "i sommar", "i vinter"], label: "Je noemt een seizoen" }
            model: "Jag tycker mest om sommaren, för då är det varmt och ljust länge på kvällarna. Solen skiner ofta och det är ungefär tjugo grader. På sommaren badar jag i sjön och jag läser böcker i trädgården. Vintern är också fin, men det är kallt och mörkt, så jag stannar mest inne."

