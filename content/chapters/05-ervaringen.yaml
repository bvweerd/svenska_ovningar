chapter: 5

grammar:
  - id: supinum
    title: De voltooide tijd (perfekt)
    summary: "**har + supinum**: *jobba → har jobbat*, *köpa → har köpt*, *bo → har bott*, *skriva → har skrivit*."
    body: |
      De perfekt maak je met **har** + de **supinum**. De supinum lijkt op het Nederlandse voltooid deelwoord, maar is een aparte vorm die je alleen na *har* (of *hade*) gebruikt. Het Zweedse voltooid deelwoord als bijvoeglijk naamwoord ziet er soms anders uit: *Jag **har skrivit** en text*, maar *en **skriven** text*. *Har* is voor iedereen hetzelfde, ook waar het Nederlands *ben* gebruikt: *Jag **har** varit i Kiruna* (Ik **ben** in Kiruna geweest).

      | Infinitief | Preteritum | Supinum | Regel |
      |---|---|---|---|
      | jobba | jobbade | jobb**at** | -ar-werkwoorden: **-at** |
      | köpa, ringa | köpte, ringde | köp**t**, ring**t** | -er-werkwoorden: stam + **-t** |
      | bo, tro | bodde, trodde | bo**tt**, tro**tt** | korte werkwoorden: **-tt** |
      | skriva, dricka | skrev, drack | skriv**it**, druck**it** | sterke werkwoorden: **-it** |

      ### Onregelmatig
      | Infinitief | Supinum |
      |---|---|
      | vara | varit |
      | ha | haft |
      | gå | gått |
      | se | sett |
      | få | fått |
      | göra | gjort |
      | säga | sagt |
      | äta | ätit |
      | komma | kommit |
      | ta | tagit |

  - id: perfekt-preteritum
    title: Perfekt of preteritum?
    summary: "**Preteritum** bij een **bepaald moment** in het verleden (*igår, i fredags, för två år sedan*). **Perfekt** bij ervaringen zonder tijdstip en bij iets wat **tot nu** doorloopt."
    body: |
      Het Zweeds is strenger dan het Nederlands. In het Nederlands zeg je *Gisteren heb ik een boek gekocht*, maar in het Zweeds moet dat in de **preteritum**:

      - **Igår köpte jag en bok.** (niet: *~~Igår har jag köpt en bok~~*)

      | Preteritum | Perfekt |
      |---|---|
      | Er is een **tijdstip** in het verleden: *igår, i måndags, förra året, för en vecka sedan, när jag var liten* | **Geen tijdstip**, het gaat om de ervaring: *Har du varit i Kiruna?* |
      | Het is **afgelopen**: *Jag bodde i Utrecht i tre år.* (nu niet meer) | Het loopt **tot nu** door: *Jag har bott i Sverige i tre år.* (en woon er nog) |
      | Je **vertelt** een verhaal over toen | Het **resultaat** is nu belangrijk: *Jag har tappat nyckeln!* |

      Handige woorden bij de perfekt: *någonsin* / *någon gång* (ooit), *aldrig* (nooit), *redan* (al), *inte än* (nog niet).

  - id: hem-hemma
    title: Waar of waarheen? hemma – hem
    summary: "Ben je ergens (**plaats**): *hemma, där, här, ute, inne*. Ga je ergens heen (**richting**): *hem, dit, hit, ut, in*. Vraag: **var?** (waar) of **vart?** (waarheen)."
    body: |
      Het Zweeds heeft aparte woorden voor **waar je bent** en **waar je naartoe gaat**:

      | Plaats (var?) | Richting (vart?) | Nederlands |
      |---|---|---|
      | hemma | hem | thuis – naar huis |
      | där | dit | daar – daarheen |
      | här | hit | hier – hierheen |
      | ute | ut | buiten – naar buiten |
      | inne | in | binnen – naar binnen |
      | uppe | upp | boven – naar boven |
      | nere | ner | beneden – naar beneden |

      - Jag är **hemma**. – Jag går **hem**.
      - Barnen leker **ute**. – Gå **ut** och lek!
      - **Var** bor du? – **Vart** ska du?

  - id: an
    title: Vergelijken met än
    summary: "Na **än** (dan) en **som** (als) mag de onderwerpsvorm én de objectvorm: *Nils är yngre än **jag*** of *än **mig***. *än jag* is formeler, *än mig* gewoner in spreektaal."
    body: |
      Bij een vergelijking met *än* (dan) of *lika … som* (even … als) zijn **twee vormen goed**:

      | Formeler (onderwerpsvorm) | Gewoner in spreektaal (objectvorm) |
      |---|---|
      | Nils är yngre **än jag**. | Nils är yngre **än mig**. |
      | Wilma är längre **än han**. | Wilma är längre **än honom**. |
      | Hon är lika gammal **som vi**. | Hon är lika gammal **som oss**. |

      Volgens Språkrådet zijn beide vormen correct. *Än jag* klinkt wat formeler (… dan ik ben), *än mig* hoor je meer in gewone spreektaal. Let op: een bezittelijk voornaamwoord (*min, hans, våra*) betekent iets anders: *Nils är yngre än jag* (dan ik), maar *Min bil är större än din* (dan de jouwe).

      Een paar vergelijkende vormen die je hier tegenkomt: *äldre* (ouder), *yngre* (jonger), *längre* (langer), *större* (groter), *snabbare* (sneller). In hoofdstuk 12 leer je ze maken.

sections:
  - id: oefeningen
    title: Oefeningen
    exercises:
      - id: perfekt-regelmatig
        title: Perfekt – regelmatig
        instruction: Vul de supinum in van het werkwoord tussen haakjes.
        topic: supinum
        items:
          - { id: j7dr, type: gap, text: "Jag har ___ (arbeta) länge idag.", gaps: [{ answers: ["arbetat"] }] }
          - { id: 84nb, type: gap, text: "Har du ___ (köpa) mjölk?", gaps: [{ answers: ["köpt"], feedback: [{ match: ["köpat", "köpte"], tip: "köpa is een -er-werkwoord: stam + -t (köpt)." }] }] }
          - { id: 2uzg, type: gap, text: "Fleur har ___ (besöka) Uppsala.", gaps: [{ answers: ["besökt"] }] }
          - { id: ekq7, type: gap, text: "Vi har ___ (bo) här i två år.", gaps: [{ answers: ["bott"], feedback: [{ match: ["boat", "bot", "bodd"], tip: "bo is een kort werkwoord: -tt (bott)." }] }] }
          - { id: ad9n, type: gap, text: "Grannarna har ___ (måla) huset.", gaps: [{ answers: ["målat"] }] }
          - { id: qg2w, type: gap, text: "Bram har ___ (ringa) till jobbet.", gaps: [{ answers: ["ringt"], feedback: [{ match: "ringat", tip: "ringa is een -er-werkwoord (ringer): ringt." }] }] }
          - { id: ve2e, type: gap, text: "Har ni ___ (höra) nyheterna?", gaps: [{ answers: ["hört"] }] }
          - { id: vkxe, type: gap, text: "Wilma har ___ (städa) rummet.", gaps: [{ answers: ["städat"], feedback: [{ match: "städt", tip: "städa is een -ar-werkwoord (städar): städat." }] }] }

      - id: supinum-tabel
        title: Sterke en onregelmatige werkwoorden
        instruction: Vul de supinum in.
        topic: supinum
        items:
          - id: 6aft
            type: table
            columns: ["Infinitief", "Preteritum", "Supinum"]
            rows:
              - ["vara", "var", { answers: ["varit"] }]
              - ["ha", "hade", { answers: ["haft"], feedback: [{ match: ["hadit", "hat"], tip: "ha is onregelmatig: haft." }] }]
              - ["gå", "gick", { answers: ["gått"], feedback: [{ match: ["gickit", "gåit"], tip: "gå is onregelmatig: gått." }] }]
              - ["komma", "kom", { answers: ["kommit"] }]
              - ["äta", "åt", { answers: ["ätit"], feedback: [{ match: ["åtit", "ätt"], tip: "De supinum van äta heeft weer een ä: ätit." }] }]
              - ["dricka", "drack", { answers: ["druckit"], feedback: [{ match: ["drickit", "drackit"], tip: "dricka – drack – druckit: de klinker wordt u." }] }]
              - ["se", "såg", { answers: ["sett"] }]
              - ["skriva", "skrev", { answers: ["skrivit"] }]
              - ["göra", "gjorde", { answers: ["gjort"] }]
              - ["ta", "tog", { answers: ["tagit"] }]

      - id: perfekt-sterk
        title: Perfekt in een zin
        instruction: Vul de supinum in.
        topic: supinum
        shuffle: true
        items:
          - { id: wya5, type: gap, text: "Har du ___ (se) domkyrkan i Uppsala?", gaps: [{ answers: ["sett"] }] }
          - { id: panb, type: gap, text: "Vi har aldrig ___ (vara) i Norrland.", gaps: [{ answers: ["varit"] }] }
          - { id: 4jrm, type: gap, text: "Har du ___ (äta) surströmming?", gaps: [{ answers: ["ätit"] }] }
          - { id: g5a8, type: gap, text: "Nils har ___ (få) en ny cykel.", gaps: [{ answers: ["fått"] }] }
          - { id: k3bt, type: gap, text: "Jag har ___ (sova) dåligt i natt.", gaps: [{ answers: ["sovit"] }] }
          - { id: z2wf, type: gap, text: "Wilma har ___ (skriva) en sång.", gaps: [{ answers: ["skrivit"] }] }
          - { id: scxm, type: gap, text: "Vad har du ___ (göra) idag?", gaps: [{ answers: ["gjort"] }] }
          - { id: cbuj, type: gap, text: "Bram har ___ (dricka) för mycket kaffe.", gaps: [{ answers: ["druckit"], feedback: [{ match: ["drickat", "druckat", "drickit"], tip: "dricka is sterk: drack – druckit." }] }] }

      - id: perfekt-of-preteritum
        title: Perfekt of preteritum?
        instruction: Kies de vorm die past.
        topic: perfekt-preteritum
        shuffle: true
        items:
          - { id: ctye, type: gap, text: "Igår ___ jag en bra film. (se)", gaps: [{ answers: ["såg"], options: ["såg", "har sett"], shuffle: false, feedback: [{ match: "har sett", tip: "igår is een bepaald moment: preteritum." }] }] }
          - { id: cyb7, type: gap, text: "Jag ___ i Sverige i tre år nu. (bo)", gaps: [{ answers: ["har bott"], options: ["bodde", "har bott"], shuffle: false, feedback: [{ match: "bodde", tip: "Je woont er nu nog: perfekt." }] }] }
          - { id: 5nba, type: gap, text: "För en vecka sedan ___ vi till Göteborg. (åka)", gaps: [{ answers: ["åkte"], options: ["åkte", "har åkt"], shuffle: false, feedback: [{ match: "har åkt", tip: "för en vecka sedan is een bepaald moment: preteritum." }] }] }
          - { id: up78, type: gap, text: "___ du sett min nyckel? Jag hittar den inte.", gaps: [{ answers: ["Har"], options: ["Har", "Såg"], shuffle: false, feedback: [{ match: "Såg", tip: "Geen tijdstip, en het resultaat is nu belangrijk: perfekt." }] }] }
          - { id: z52v, type: gap, text: "Olle ___ aldrig ___ i Japan.", gaps: [{ answers: ["har"], options: ["har", "var"], shuffle: false }, { answers: ["varit"], options: ["varit", "var"], shuffle: false }] }
          - { id: we79, type: gap, text: "I måndags ___ Fleur sjuk. (vara)", gaps: [{ answers: ["var"], options: ["var", "har varit"], shuffle: false, feedback: [{ match: "har varit", tip: "i måndags (afgelopen maandag) is een bepaald moment: preteritum." }] }] }
          - { id: 6eqg, type: gap, text: "I fjol ___ vi i Norge. (vara)", gaps: [{ answers: ["var"], options: ["var", "har varit"], shuffle: false, feedback: [{ match: "har varit", tip: "i fjol (vorig jaar) is een afgesloten tijd: preteritum." }] }] }
          - { id: t2ab, type: gap, text: "– Har du ätit? – Ja, jag ___ för en timme sedan. (äta)", gaps: [{ answers: ["åt"], options: ["åt", "har ätit"], shuffle: false, feedback: [{ match: "har ätit", tip: "för en timme sedan is een bepaald moment: preteritum." }] }] }

      - id: perfekt-vertalen
        title: Vertaal
        instruction: Vertaal naar het Zweeds. Let op de tijd!
        topic: perfekt-preteritum
        items:
          - { id: 3vkp, type: translate, prompt: "Gisteren heb ik een boek gekocht.", answers: ["{Igår|I går} köpte jag en bok.", "Jag köpte en bok {igår|i går}."], feedback: [{ contains: "har köpt", tip: "In het Nederlands zeg je „heb gekocht”, maar met igår gebruik je in het Zweeds de preteritum." }, { contains: "igår jag", tip: "Na Igår komt eerst het werkwoord." }] }
          - { id: vrb9, type: translate, prompt: "Ik woon al drie jaar in Zweden.", answers: ["Jag har bott i Sverige i tre år[ nu].", "Nu har jag bott i Sverige i tre år."], feedback: [{ match: "Jag bor i Sverige i tre år", tip: "Iets wat tot nu doorloopt met een duur: perfekt (har bott) + i tre år." }] }
          - { id: dcr5, type: translate, prompt: "Ben je ooit in Stockholm geweest?", answers: ["Har du {någonsin|någon gång} varit i Stockholm?"], feedback: [{ contains: "är du", tip: "Bij de perfekt gebruik je altijd har, ook waar het Nederlands „ben” zegt." }] }
          - { id: pend, type: translate, prompt: "We hebben nog nooit surströmming gegeten.", answers: ["Vi har aldrig ätit surströmming."], feedback: [{ contains: "aldrig har", tip: "aldrig staat na har." }] }
          - { id: a4fa, type: translate, prompt: "Wat heb je vandaag gedaan?", answers: ["Vad har du gjort {idag|i dag}?"] }
          - { id: jza3, type: translate, prompt: "Twee jaar geleden woonden we in Utrecht.", answers: ["För två år {sedan|sen} bodde vi i Utrecht.", "Vi bodde i Utrecht för två år {sedan|sen}."], feedback: [{ contains: "har bott", tip: "Twee jaar geleden is een bepaald moment, en het is voorbij: preteritum." }] }
          - { id: e67t, type: translate, prompt: "Wilma heeft het huiswerk al gemaakt.", answers: ["Wilma har redan gjort {läxorna|läxan}."], feedback: [{ contains: "wilma redan har", tip: "redan staat ná har." }, { contains: "gjorde", tip: "„Heeft al gemaakt”, zonder tijdstip: perfekt (har gjort)." }] }
          - { id: hbhe, type: translate, prompt: "Vorige week hebben we een film gezien.", answers: ["Förra veckan såg vi en film.", "Vi såg en film förra veckan."], feedback: [{ contains: "har sett", tip: "Met förra veckan (een afgesloten tijd) gebruik je in het Zweeds de preteritum." }, { contains: "veckan vi", tip: "Na Förra veckan komt eerst het werkwoord." }] }

      - id: hemma-hem
        title: Waar of waarheen?
        instruction: Kies het woord dat past.
        topic: hem-hemma
        shuffle: true
        items:
          - { id: htgj, type: gap, text: "Jag är ___ nu.", gaps: [{ answers: ["hemma"], options: ["hemma", "hem"], shuffle: false, feedback: [{ match: "hem", tip: "Je bent ergens (plaats): hemma." }] }] }
          - { id: bg9y, type: gap, text: "Klockan fem går jag ___.", gaps: [{ answers: ["hem"], options: ["hemma", "hem"], shuffle: false, feedback: [{ match: "hemma", tip: "Je gaat ergens heen (richting): hem." }] }] }
          - { id: d7f9, type: gap, text: "Kom ___!", gaps: [{ answers: ["hit"], options: ["här", "hit"], shuffle: false }] }
          - { id: jrp8, type: gap, text: "Barnen leker ___.", gaps: [{ answers: ["ute"], options: ["ute", "ut"], shuffle: false }] }
          - { id: ggh9, type: gap, text: "Gå ___ och lek!", gaps: [{ answers: ["ut"], options: ["ute", "ut"], shuffle: false }] }
          - { id: h8mm, type: gap, text: "Kiruna? Vi åker ___ i vinter.", gaps: [{ answers: ["dit"], options: ["där", "dit"], shuffle: false }] }
          - { id: 4k3e, type: gap, text: "Katten är ___ i huset.", gaps: [{ answers: ["inne"], options: ["inne", "in"], shuffle: false }] }
          - { id: n2rz, type: gap, text: "Nils springer ___ till övervåningen.", gaps: [{ answers: ["upp"], options: ["uppe", "upp"], shuffle: false }] }

      - id: var-vart
        title: Var of vart?
        instruction: Kies het juiste vraagwoord.
        topic: hem-hemma
        shuffle: true
        items:
          - { id: 588a, type: mc, prompt: "___ ska du? – Till affären.", options: ["Vart", "Var"], answer: 0, shuffle: false, tip: "Het antwoord is een richting (naar de winkel): vart." }
          - { id: 4aaz, type: mc, prompt: "___ bor du? – I Västerås.", options: ["Vart", "Var"], answer: 1, shuffle: false, tip: "Het antwoord is een plaats: var." }
          - { id: nu7t, type: mc, prompt: "___ åker ni i sommar? – Till Gotland.", options: ["Vart", "Var"], answer: 0, shuffle: false, tip: "Het antwoord is een richting: vart." }
          - { id: dhkb, type: mc, prompt: "___ är mina nycklar? – På bordet.", options: ["Vart", "Var"], answer: 1, shuffle: false, tip: "Het antwoord is een plaats: var." }
          - { id: gveb, type: mc, prompt: "___ går bussen? – Till centrum.", options: ["Vart", "Var"], answer: 0, shuffle: false, tip: "Het antwoord is een richting (naar het centrum): vart." }
          - { id: e543, type: mc, prompt: "___ jobbar Fleur? – På ett kontor.", options: ["Vart", "Var"], answer: 1, shuffle: false, tip: "Het antwoord is een plaats: var." }
          - { id: 8f3m, type: mc, prompt: "___ ligger Kiruna? – I norra Sverige.", options: ["Vart", "Var"], answer: 1, shuffle: false, tip: "Het antwoord is een plaats: var." }
          - { id: q44x, type: mc, prompt: "___ ska ni åka i helgen? – Till Stockholm.", options: ["Vart", "Var"], answer: 0, shuffle: false, tip: "Het antwoord is een richting: vart." }

      - id: an-subjekt
        title: Vergelijken met än
        instruction: Vul in. Bij een voornaamwoord zijn vaak twee vormen goed.
        topic: an
        shuffle: true
        items:
          - { id: xt5b, type: gap, text: "Nils är yngre ___ jag.", gaps: [{ answers: ["än"], options: ["än", "som"], shuffle: false, feedback: [{ match: "som", tip: "Na een vergelijkende vorm (yngre, äldre …) komt än. som hoort bij lika … som." }] }] }
          - { id: pw8u, type: gap, text: "Wilma är längre än ___. (hij)", gaps: [{ answers: ["han", "honom"], feedback: [{ match: "hans", tip: "hans is bezittelijk (zijn). Na än: han of honom." }] }] }
          - { id: 73ek, type: gap, text: "Ni är äldre än ___. (wij)", gaps: [{ answers: ["vi", "oss"], feedback: [{ match: ["vår", "våra"], tip: "vår is bezittelijk (ons). Na än: vi of oss." }] }] }
          - { id: py3t, type: gap, text: "Olle springer snabbare än ___. (zij, meervoud)", gaps: [{ answers: ["de", "dem"], feedback: [{ match: "deras", tip: "deras is bezittelijk (hun). Na än: de of dem." }] }] }
          - { id: udhs, type: gap, text: "Fleur är lika gammal ___ jag.", gaps: [{ answers: ["som"], options: ["som", "än"], shuffle: false, feedback: [{ match: "än", tip: "Even … als is lika … som." }] }] }
          - { id: a73p, type: gap, text: "Bram är äldre än ___. (ik)", gaps: [{ answers: ["jag", "mig"], feedback: [{ match: ["min", "mitt"], tip: "min is bezittelijk (mijn). Na än: jag of mig." }] }] }
          - { id: yt9c, type: gap, text: "Olle är lika lång ___ Bram.", gaps: [{ answers: ["som"], options: ["som", "än"], shuffle: false, feedback: [{ match: "än", tip: "Even … als is lika … som." }] }] }
          - { id: y366, type: gap, text: "Ingrid är äldre än ___. (zij, enkelvoud)", gaps: [{ answers: ["hon", "henne"], feedback: [{ match: "hennes", tip: "hennes is bezittelijk (haar). Na än: hon of henne." }] }] }

      - id: lezen-mail
        title: "Lezen: een mail van Fleur"
        instruction: Fleur schrijft een vriendin. Is de bewering **rätt** of **fel**? Is hij fout, schrijf dan de juiste zin op.
        topic: perfekt-preteritum
        textTitle: Hej Lotte!
        text: |
          Nu har vi bott i Västerås i nästan ett år. Tiden går fort! Vi har lärt oss mycket svenska och vi har träffat många trevliga människor.

          Förra månaden åkte vi till Stockholm och besökte Vasamuseet. I somras var vi en vecka i Dalarna. Bram har aldrig sett norrsken, men jag såg det en gång i Kiruna för fem år sedan. Vi har inte varit i Göteborg än. Kanske åker vi dit i höst!

          Kram, Fleur
        items:
          - { id: e258, type: truefalse, statement: "Fleur och Bram har bott i Västerås i fem år.", answer: false, tip: "Lees de eerste zin.", correction: { answers: ["{Fleur och Bram|De} har bott i Västerås i nästan ett år."] } }
          - { id: 2dry, type: truefalse, statement: "De har träffat många trevliga människor.", answer: true }
          - { id: yn5a, type: truefalse, statement: "Förra månaden åkte de till Stockholm.", answer: true }
          - { id: dcbw, type: truefalse, statement: "Bram har sett norrsken.", answer: false, tip: "Wie heeft het noorderlicht gezien?", correction: { answers: ["{Bram|Han} har aldrig sett norrsken.", "{Bram|Han} har inte sett norrsken."] } }
          - { id: gghv, type: truefalse, statement: "De har varit i Göteborg.", answer: false, tip: "Lees het eind van de tweede alinea.", correction: { answers: ["{De|Fleur och Bram|Bram och Fleur} har inte varit i Göteborg[ än].", "{De|Fleur och Bram|Bram och Fleur} har aldrig varit i Göteborg."] } }
          - { id: rh88, type: truefalse, statement: "Fleur såg norrsken i Kiruna.", answer: true }

      - id: dialoog-kiruna
        title: Ben je er ooit geweest?
        instruction: Zet het gesprek tussen Olle en Bram in de goede volgorde.
        topic: perfekt-preteritum
        items:
          - id: ngzm
            type: dialogue
            lines:
              - "Olle: Har du någon gång varit i Kiruna, Bram?"
              - "Bram: Nej, aldrig. Har du?"
              - "Olle: Ja, jag var där för tre år sedan. Det var jättefint."
              - "Bram: Såg du norrsken?"
              - "Olle: Ja, flera gånger! Du måste åka dit i vinter."
              - "Bram: Det låter fantastiskt. Jag ska prata med Fleur."

      - id: schrijven-ervaringen
        title: "Schrijven: waar ben je geweest?"
        instruction: Schrijf over plaatsen waar je geweest bent, en over één reis in het bijzonder.
        topic: perfekt-preteritum
        items:
          - id: 6gu6
            type: free
            prompt: "Vertel in welke landen of steden je al bent geweest en waar je nog nooit bent geweest. Vertel daarna over één reis: wanneer was het en wat deed je?"
            minWords: 35
            require:
              - { any: ["har varit", "har sett", "har bott", "har besökt"], label: "Je gebruikt de perfekt (har varit …)" }
              - { any: ["aldrig", "inte än", "någon gång"], label: "Je zegt waar je nog nooit bent geweest (aldrig …)" }
              - { any: ["förra", "sedan", "i somras", "när jag"], label: "Je noemt een moment in het verleden (för … sedan, förra året …)" }
            model: "Jag har varit i många länder i Europa, till exempel Frankrike, Italien och Norge. Jag har aldrig varit i Asien. För två år sedan reste jag till Lofoten med min syster. Vi hyrde en liten stuga vid havet. Vi vandrade varje dag och åt mycket fisk. Det var en fantastisk resa."

      - id: zoek-de-fout
        title: Zoek de fout
        instruction: In elke zin staat één fout. Klik op het foute woord en verbeter daarna de zin.
        topic: perfekt-preteritum
        shuffle: true
        items:
