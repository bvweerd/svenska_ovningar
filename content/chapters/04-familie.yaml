chapter: 4
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan vertellen wat ik vorige week heb gedaan", topics: [preteritum, starka-verb] }
  - { text: "Ik kan over mijn familie vertellen met min, din, hans, hennes …", topics: [possessiv, familj] }

grammar:
  - id: preteritum
    title: De verleden tijd (preteritum) – regelmatig
    summary: "**-ar → -ade** (jobbade), **-er → -de/-te** (ringde, köpte), korte werkwoorden **→ -dde** (bodde). Voor alle personen dezelfde vorm."
    body: |
      De preteritum gebruik je voor iets wat op een **bepaald moment in het verleden** gebeurde: *igår, i måndags, förra veckan, förra året, för två år sedan*.

      | Groep | Presens | Preteritum | Regel |
      |---|---|---|---|
      | 1 | jobbar, pratar, tittar | jobb**ade**, prat**ade**, titt**ade** | -ar wordt **-ade** |
      | 2a | ringer, stänger, hör | ring**de**, stäng**de**, hör**de** | stam + **-de** |
      | 2b | köper, läser, åker | köp**te**, läs**te**, åk**te** | stam op **k, p, s, t, x** + **-te** |
      | 3 | bor, tror, mår | bo**dde**, tro**dde**, må**dde** | korte werkwoorden + **-dde** |

      De stam is de infinitief zonder *-a*: *köpa → köp*. Eindigt die stam op een "harde" medeklinker (**k, p, s, t, x**), dan wordt het **-te**, anders **-de**. Vergelijk het Nederlandse 't kofschip.

      In leerboeken en woordenlijsten heten deze werkwoorden vaak **groep 1, 2a, 2b en 3**; de sterke en onregelmatige werkwoorden (hieronder) zijn **groep 4**. Soms staat er alleen het groepsnummer: *köpa (2b)* betekent dus *köpte*. Bij groep 1 tot en met 3 weet je zo de vormen; groep 4 leer je uit je hoofd.

  - id: starka-verb
    title: Sterke en onregelmatige werkwoorden
    summary: "Veel gewone werkwoorden veranderen van klinker en krijgen **geen uitgang**: *gå → gick, äta → åt, vara → var*. Andere zijn op hun eigen manier onregelmatig: *ha → hade, göra → gjorde, säga → sa*. Uit je hoofd leren."
    body: |
      **Sterke** werkwoorden veranderen van klinker en krijgen in de preteritum geen uitgang (*gick, åt, drack, skrev*). Een paar andere werkwoorden zijn **onregelmatig**: ze krijgen wél een uitgang, maar de stam verandert (*hade, gjorde, sa/sade*). Samen heten ze in leerboeken **groep 4**.

      | Infinitief | Presens | Preteritum | Nederlands |
      |---|---|---|---|
      | vara | är | var | zijn |
      | ha | har | hade | hebben |
      | göra | gör | gjorde | doen |
      | säga | säger | sa (sade) | zeggen |
      | gå | går | gick | gaan, lopen |
      | komma | kommer | kom | komen |
      | äta | äter | åt | eten |
      | dricka | dricker | drack | drinken |
      | sova | sover | sov | slapen |
      | skriva | skriver | skrev | schrijven |
      | se | ser | såg | zien |
      | få | får | fick | krijgen, mogen |
      | ta | tar | tog | nemen |
      | ge | ger | gav | geven |
      | bli | blir | blev | worden |
      | sjunga | sjunger | sjöng | zingen |

      De modale werkwoorden: *kan → kunde*, *vill → ville*, *ska → skulle*, *måste → måste*.

  - id: possessiv
    title: Bezittelijke voornaamwoorden
    summary: "*min/mitt/mina*, *din/ditt/dina*, *vår/vårt/våra*, *er/ert/era* passen zich aan; *hans, hennes, deras* niet. Daarna komt de **onbepaalde vorm**: *min bil*, niet *~~min bilen~~*."
    body: |
      | | en-woord | ett-woord | meervoud |
      |---|---|---|---|
      | mijn | min bil | mitt hus | mina barn |
      | jouw | din bil | ditt hus | dina barn |
      | zijn | hans bil | hans hus | hans barn |
      | haar | hennes bil | hennes hus | hennes barn |
      | ons | vår bil | vårt hus | våra barn |
      | jullie | er bil | ert hus | era barn |
      | hun | deras bil | deras hus | deras barn |

      Na een bezittelijk voornaamwoord staat het zelfstandig naamwoord in de **onbepaalde vorm**: *min bil, mitt hus, mina barn*. Dus niet *~~min bilen~~*.

      Je kunt ook bezit aangeven met **-s**, zonder apostrof: *Olles bil, mormors trädgård*.

      In hoofdstuk 10 leer je nog *sin, sitt, sina* (zijn/haar eigen).

  - id: familj
    title: Familie
    summary: "Opa's, oma's, ooms en tantes zeg je via moeders of vaders kant: **mor**mor = moeders moeder, **far**bror = vaders broer."
    body: |
      Het Zweeds zegt precies van welke kant van de familie iemand is: **mor-** (moeder) of **far-** (vader).

      | Zweeds | Letterlijk | Nederlands |
      |---|---|---|
      | mormor | moeders moeder | oma (van moederskant) |
      | morfar | moeders vader | opa (van moederskant) |
      | farmor | vaders moeder | oma (van vaderskant) |
      | farfar | vaders vader | opa (van vaderskant) |
      | moster | moeders zus | tante |
      | faster | vaders zus | tante |
      | morbror | moeders broer | oom |
      | farbror | vaders broer | oom |

      Verder: *föräldrar* (ouders), *syskon* (broers en zussen), *bror* (broer), *syster* (zus), *kusin* (neef/nicht: kind van oom of tante), *barnbarn* (kleinkind).

sections:
  - id: oefeningen
    title: Oefeningen
    exercises:
      - id: ontdek-preteritum
        title: Ontdek de regel – verleden tijd
        instruction: Bekijk de voorbeelden en ontdek zelf de regel. Pas hem daarna toe. De uitleg staat ook op de kaart *De verleden tijd*.
        topic: preteritum
        items:
          - id: esgu
            type: steps
            steps:
              - { type: mc, prompt: "Kijk: *jobbar – jobbade*, *lagar – lagade*, *städar – städade*. Wat valt op?", options: ["Werkwoorden op -ar krijgen -ade.", "Alle werkwoorden krijgen -te.", "De -ar valt weg en er komt -de achter."], answer: 0, shuffle: false, tip: "jobbar, lagar en städar eindigen op -ar, en in de verleden tijd op -ade." }
              - { type: gap, text: "Igår ___ (titta) vi på film.", gaps: [{ answers: ["tittade"], feedback: [{ match: ["tittde", "tittte", "tittar"], tip: "titta – tittar is een -ar-werkwoord: -ade, tittade." }] }] }
          - id: 6pn7
            type: steps
            steps:
              - { type: mc, prompt: "Kijk: *ringer – ringde*, *hör – hörde*, maar *köper – köpte*, *läser – läste*. Wanneer -te?", options: ["Als de stam op k, p, s, t of x eindigt.", "Als het werkwoord lang is.", "Bij alle werkwoorden op -er."], answer: 0, shuffle: false, tip: "köp- en läs- eindigen op p en s: dan -te. ring- en hör- niet: dan -de." }
              - { type: gap, text: "I lördags ___ (åka) vi till Uppsala.", gaps: [{ answers: ["åkte"], feedback: [{ match: ["åkde", "åkade"], tip: "De stam åk- eindigt op k: -te, åkte." }] }] }

      - id: pret-regelmatig
        title: Verleden tijd – regelmatig
        instruction: Vul de preteritum in van het werkwoord tussen haakjes.
        topic: preteritum
        items:
          - { id: 95y5, type: gap, text: "Igår ___ (jobba) Fleur hemma.", gaps: [{ answers: ["jobbade"] }] }
          - { id: fbzt, type: gap, text: "I måndags ___ (köpa) Bram en ny jacka.", gaps: [{ answers: ["köpte"], feedback: [{ match: ["köpade", "köpde"], tip: "De stam köp- eindigt op een p: dan wordt het -te." }] }] }
          - { id: pq6d, type: gap, text: "Förra året ___ (bo) vi i Utrecht.", gaps: [{ answers: ["bodde"], feedback: [{ match: ["boade", "bode", "bote"], tip: "bo is een kort werkwoord: -dde." }] }] }
          - { id: fpb5, type: gap, text: "Igår kväll ___ (ringa) mormor.", gaps: [{ answers: ["ringde"], feedback: [{ match: ["ringte", "ringade"], tip: "De stam ring- eindigt op een g: dan wordt het -de." }] }] }
          - { id: 9ghr, type: gap, text: "Vi ___ (läsa) tidningen vid frukosten.", gaps: [{ answers: ["läste"], feedback: [{ match: "läsde", tip: "De stam läs- eindigt op een s: dan wordt het -te." }] }] }
          - { id: k4fa, type: gap, text: "Nils ___ (leka) med hunden hela dagen.", gaps: [{ answers: ["lekte"] }] }
          - { id: f4t7, type: gap, text: "Wilma ___ (spela) gitarr igår kväll.", gaps: [{ answers: ["spelade"] }] }
          - { id: b434, type: gap, text: "Olle ___ (tro) att det var söndag.", gaps: [{ answers: ["trodde"] }] }
          - { id: aw4p, type: gap, text: "De ___ (stänga) affären klockan sex.", gaps: [{ answers: ["stängde"] }] }

      - id: pret-tabel
        title: Presens en preteritum
        instruction: Vul de preteritum in.
        topic: preteritum
        items:
          - id: um4z
            type: table
            columns: ["Infinitief", "Presens", "Preteritum"]
            rows:
              - ["prata", "pratar", { answers: ["pratade"] }]
              - ["köpa", "köper", { answers: ["köpte"] }]
              - ["höra", "hör", { answers: ["hörde"] }]
              - ["åka", "åker", { answers: ["åkte"] }]
              - ["må", "mår", { answers: ["mådde"] }]
              - ["resa", "reser", { answers: ["reste"] }]
              - ["fira", "firar", { answers: ["firade"] }]

      - id: sterk-tabel
        title: Sterke werkwoorden
        instruction: Vul de preteritum in. Deze werkwoorden zijn onregelmatig.
        topic: starka-verb
        items:
          - id: r65f
            type: table
            columns: ["Infinitief", "Presens", "Preteritum"]
            rows:
              - ["vara", "är", { answers: ["var"] }]
              - ["ha", "har", { answers: ["hade"] }]
              - ["gå", "går", { answers: ["gick"], feedback: [{ match: ["gådde", "gåde"], tip: "gå is onregelmatig: gick." }] }]
              - ["komma", "kommer", { answers: ["kom"], feedback: [{ match: ["kommde", "kommade", "komde"], tip: "komma is sterk: kom, zonder uitgang." }] }]
              - ["äta", "äter", { answers: ["åt"], feedback: [{ match: ["äte", "ätte", "ätade"], tip: "äta is sterk: de klinker wordt å, zonder uitgang." }] }]
              - ["dricka", "dricker", { answers: ["drack"] }]
              - ["se", "ser", { answers: ["såg"] }]
              - ["ta", "tar", { answers: ["tog"] }]

      - id: sterk-in-zin
        title: Sterke werkwoorden in een zin
        instruction: Vul de preteritum in.
        topic: starka-verb
        shuffle: true
        items:
          - { id: d8wr, type: gap, text: "Igår ___ (vara) vi på en fest.", gaps: [{ answers: ["var"] }] }
          - { id: 8a2c, type: gap, text: "Wilma ___ (skriva) ett brev till mormor.", gaps: [{ answers: ["skrev"], feedback: [{ match: "skrivde", tip: "skriva is sterk: skrev." }] }] }
          - { id: 2wpb, type: gap, text: "Vi ___ (äta) pizza i fredags.", gaps: [{ answers: ["åt"] }] }
          - { id: 4dt9, type: gap, text: "Nils ___ (sova) länge i morse.", gaps: [{ answers: ["sov"], feedback: [{ match: ["sovde", "sovade"], tip: "sova is sterk: sov." }] }] }
          - { id: ax6h, type: gap, text: "Jag ___ (få) ett paket igår.", gaps: [{ answers: ["fick"] }] }
          - { id: 5jgb, type: gap, text: "Bram ___ (säga) ingenting.", gaps: [{ answers: ["sa", "sade"], feedback: [{ match: "sägde", tip: "säga is onregelmatig: sa (of sade)." }] }] }
          - { id: 7kh5, type: gap, text: "Fleur ___ (gå) till jobbet i måndags.", gaps: [{ answers: ["gick"] }] }
          - { id: p9ht, type: gap, text: "Förra sommaren ___ (ta) vi tåget till Kiruna.", gaps: [{ answers: ["tog"] }] }
          - { id: w8dz, type: gap, text: "Vad ___ (göra) du i helgen?", gaps: [{ answers: ["gjorde"], feedback: [{ match: ["görde", "göde"], tip: "göra is onregelmatig: gjorde." }] }] }

      - id: nu-of-vroeger
        title: Nu of in het verleden?
        instruction: Kies eerst de goede tijd. Vertaal daarna de zin.
        topic: preteritum
        items:
          - id: bp62
            type: steps
            steps:
              - { type: mc, prompt: "Igår ___ vi hemma. (stanna)", options: ["stannade", "stannar"], answer: 0, shuffle: false, tip: "igår (gisteren) vraagt om de verleden tijd." }
              - { type: translate, prompt: "Gisteren bleef Fleur thuis.", answers: ["{Igår|I går} stannade Fleur hemma.", "Fleur stannade hemma {igår|i går}."] }
          - id: sfgn
            type: steps
            steps:
              - { type: mc, prompt: "Nu ___ Bram i Sverige. (bo)", options: ["bor", "bodde"], answer: 0, shuffle: false, tip: "nu vraagt om de tegenwoordige tijd." }
              - { type: translate, prompt: "Vroeger woonde hij in Utrecht.", answers: ["{Förut|Tidigare|Förr} bodde han i Utrecht.", "Han bodde i Utrecht {förut|tidigare|förr}."] }
          - id: vkmj
            type: steps
            steps:
              - { type: mc, prompt: "För två år sedan ___ Olle 40 år. (fylla)", options: ["fyllde", "fyller"], answer: 0, shuffle: false, tip: "för två år sedan (twee jaar geleden) vraagt om de verleden tijd." }
              - { type: translate, prompt: "Vorig jaar werd Wilma veertien.", answers: ["Förra året fyllde Wilma fjorton[ år].", "Wilma fyllde fjorton[ år] förra året.", "{I fjol|Ifjol} fyllde Wilma fjorton[ år].", "Wilma fyllde fjorton[ år] {i fjol|ifjol}."], feedback: [{ contains: "blev", tip: "Jarig worden (een leeftijd bereiken) is „fylla … år”: Wilma fyllde fjorton." }] }
          - id: 9xwq
            type: steps
            steps:
              - { type: mc, prompt: "Varje dag ___ Nils till skolan. (gå)", options: ["går", "gick"], answer: 0, shuffle: false, tip: "varje dag (elke dag) gaat over een gewoonte nu: tegenwoordige tijd." }
              - { type: translate, prompt: "Vorige week liep Nils naar school.", answers: ["Förra veckan gick Nils till skolan.", "Nils gick till skolan förra veckan."] }
          - id: 5jk5
            type: steps
            steps:
              - { type: mc, prompt: "Förra sommaren ___ vi till Gotland. (åka)", options: ["åkte", "åker"], answer: 0, shuffle: false, tip: "förra sommaren (vorige zomer) vraagt om de verleden tijd." }
              - { type: translate, prompt: "Vorige zomer gingen we naar Gotland.", answers: ["Förra sommaren åkte vi till Gotland.", "Vi åkte till Gotland förra sommaren."] }
          - id: ag5j
            type: steps
            steps:
              - { type: mc, prompt: "På söndagar ___ Ingrid bullar. (baka)", options: ["bakar", "bakade"], answer: 0, shuffle: false, tip: "på söndagar (op zondagen) is een gewoonte nu: tegenwoordige tijd." }
              - { type: translate, prompt: "Gisteren bakte Ingrid een taart.", answers: ["{Igår|I går} bakade Ingrid en tårta.", "Ingrid bakade en tårta {igår|i går}."] }
          - id: 8new
            type: steps
            steps:
              - { type: mc, prompt: "I morse ___ Bram kaffe. (dricka)", options: ["drack", "dricker"], answer: 0, shuffle: false, tip: "i morse (vanochtend, al voorbij) vraagt om de verleden tijd." }
              - { type: translate, prompt: "Vanochtend dronk Fleur thee.", answers: ["{I morse|Imorse} drack Fleur te.", "Fleur drack te {i morse|imorse}."], feedback: [{ contains: "drickade", tip: "dricka is sterk: drack." }] }
          - id: sbg8
            type: steps
            steps:
              - { type: mc, prompt: "Just nu ___ Wilma en bok. (läsa)", options: ["läser", "läste"], answer: 0, shuffle: false, tip: "just nu (op dit moment) vraagt om de tegenwoordige tijd." }
              - { type: translate, prompt: "Gisteren las Wilma de hele dag.", answers: ["{Igår|I går} läste Wilma hela dagen.", "Wilma läste hela dagen {igår|i går}."], feedback: [{ contains: "hela dagen igår wilma", tip: "Na de tijdsbepaling vooraan komt eerst het werkwoord." }] }

      - id: possessiv-vorm
        title: Min bil of min bilen?
        instruction: Welke zin is goed?
        topic: possessiv
        shuffle: true
        items:
          - { id: qrub, type: mc, prompt: "Mijn auto is rood.", options: ["Min bil är röd.", "Min bilen är röd.", "Mitt bil är röd."], answer: 0, tip: "Na een bezittelijk voornaamwoord: onbepaalde vorm (bil). bil is een en-woord: min." }
          - { id: df28, type: mc, prompt: "Onze kinderen heten Wilma en Nils.", options: ["Våra barn heter Wilma och Nils.", "Våra barnen heter Wilma och Nils.", "Vårt barn heter Wilma och Nils."], answer: 0, tip: "Meervoud: våra + onbepaalde vorm (barn)." }
          - { id: 6wuw, type: mc, prompt: "De tuin van oma is mooi.", options: ["Mormors trädgård är fin.", "Mormors trädgården är fin.", "Mormor's trädgård är fin."], answer: 0, tip: "Bezit met -s, zonder apostrof, en daarna de onbepaalde vorm." }
          - { id: vwha, type: mc, prompt: "Ons huis is groot.", options: ["Vårt hus är stort.", "Vår hus är stort.", "Vårt huset är stort."], answer: 0, tip: "hus is een ett-woord: vårt. Daarna komt de onbepaalde vorm (hus)." }
          - { id: xfma, type: mc, prompt: "Waar is jouw sleutel?", options: ["Var är din nyckel?", "Var är ditt nyckel?", "Var är din nyckeln?"], answer: 0, tip: "nyckel is een en-woord: din. Daarna komt de onbepaalde vorm (nyckel)." }
          - { id: v6gx, type: mc, prompt: "Mijn ouders wonen in Utrecht.", options: ["Mina föräldrar bor i Utrecht.", "Min föräldrar bor i Utrecht.", "Mina föräldrarna bor i Utrecht."], answer: 0, tip: "Meervoud: mina + onbepaalde vorm (föräldrar)." }
          - { id: xkxp, type: mc, prompt: "Hun hond heet Sigge.", options: ["Deras hund heter Sigge.", "Dem hund heter Sigge.", "Deras hunden heter Sigge."], answer: 0, tip: "Hun (bezit) = deras, met de onbepaalde vorm (hund)." }
          - { id: sph4, type: mc, prompt: "Het boek van Olle ligt op tafel.", options: ["Olles bok ligger på bordet.", "Olles boken ligger på bordet.", "Olle's bok ligger på bordet."], answer: 0, tip: "Bezit met -s, zonder apostrof, en daarna de onbepaalde vorm." }

      - id: possessiv-kiezen
        title: Van wie is het?
        instruction: Kies het bezittelijk voornaamwoord dat past bij de betekenis tussen haakjes.
        topic: possessiv
        shuffle: true
        items:
          - { id: dqym, type: gap, text: "Det här är ___ bil. (mijn)", gaps: [{ answers: ["min"], options: ["min", "mitt", "mina"] }] }
          - { id: 5c3w, type: gap, text: "___ äpple är grönt. (mijn)", gaps: [{ answers: ["Mitt"], options: ["Min", "Mitt", "Mina"], feedback: [{ match: "Min", tip: "äpple is een ett-woord: mitt." }] }] }
          - { id: 6cdb, type: gap, text: "Var är ___ barn? (jouw, meervoud)", gaps: [{ answers: ["dina"], options: ["din", "ditt", "dina"] }] }
          - { id: vjvm, type: gap, text: "___ hus är stort. (ons)", gaps: [{ answers: ["Vårt"], options: ["Vår", "Vårt", "Våra"], feedback: [{ match: "Vår", tip: "hus is een ett-woord: vårt." }] }] }
          - { id: 7ex6, type: gap, text: "Ingrid är ___ fru. (zijn, van Olle)", gaps: [{ answers: ["hans"], options: ["hans", "hennes", "honom"], feedback: [{ match: "hennes", tip: "Ingrid is de vrouw van Olle, een man: hans." }, { match: "honom", tip: "honom is het lijdend voorwerp (hem zien). Bezit: hans." }] }] }
          - { id: y42g, type: gap, text: "Det är ___ katt. (haar)", gaps: [{ answers: ["hennes"], options: ["hans", "hennes", "henne"], feedback: [{ match: "henne", tip: "henne is het lijdend voorwerp (haar zien). Bezit: hennes." }] }] }
          - { id: wzdj, type: gap, text: "___ föräldrar bor i Spanien. (hun)", gaps: [{ answers: ["Deras"], options: ["De", "Dem", "Deras"] }] }
          - { id: jjf4, type: gap, text: "Är det här ___ väskor? (jullie)", gaps: [{ answers: ["era"], options: ["er", "ert", "era"] }] }

      - id: voornaamwoord-kiezen-maken
        title: Hon, henne of hennes? Kies en vertaal
        instruction: Kies eerst welke vorm het **vetgedrukte** woord krijgt, vertaal dan de zin.
        topic: possessiv
        shuffle: true
        items:
          - id: nkxt
            type: steps
            steps:
              - { type: mc, prompt: "Ik zie **haar** auto. Welke vorm is *haar* hier?", options: ["hon (onderwerp)", "henne (lijdend voorwerp)", "hennes (bezit)"], answer: 2, shuffle: false, tip: "Het gaat erom van wie de auto is: hennes." }
              - { type: mc, prompt: "**Waarom?** Waarom *hennes* en niet *henne*?", options: ["Haar zegt hier van wie de auto is: dat is bezit.", "Na ser komt altijd een bezittelijk voornaamwoord.", "Hennes gebruik je alleen bij en-woorden."], answer: 0, tip: "Henne = haar als lijdend voorwerp (Jag ser henne). Hennes = haar als bezit (hennes bil)." }
              - { type: translate, prompt: "Vertaal: Ik zie haar auto.", answers: ["Jag ser hennes bil."], feedback: [{ contains: "henne bil", tip: "Van wie is de auto? Bezit: hennes." }, { contains: "hennes bilen", tip: "Na een bezittelijk voornaamwoord de onbepaalde vorm: hennes bil." }] }
          - id: wejr
            type: steps
            topic: objekt
            steps:
              - { type: mc, prompt: "Ik zie **haar** morgen. Welke vorm is *haar* hier?", options: ["hon (onderwerp)", "henne (lijdend voorwerp)", "hennes (bezit)"], answer: 1, shuffle: false, tip: "Je ziet háár: zij is het lijdend voorwerp. Er komt geen ding achter: henne." }
              - { type: translate, prompt: "Vertaal: Ik zie haar morgen.", answers: ["Jag {ser|träffar} henne {imorgon|i morgon}.", "Jag ska {se|träffa} henne {imorgon|i morgon}."], feedback: [{ contains: "hennes", tip: "Er komt geen ding achter haar: het lijdend voorwerp is henne." }] }
          - id: 87zg
            type: steps
            topic: objekt
            steps:
