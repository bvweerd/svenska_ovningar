      - id: lezen-feest
        title: "Lezen: een familiefeest"
        instruction: Ingrid vertelt over afgelopen zomer. Is de bewering **rätt** of **fel**? Is hij fout, schrijf dan de juiste zin op.
        topic: preteritum
        textTitle: Mormor fyllde nittio
        text: |
          Förra sommaren hade vi en stor familjefest. Min mormor fyllde nittio år! Hela familjen kom: mina föräldrar, min bror Per med sin fru och deras tre barn, och min moster Karin, som bor i Göteborg. Karin kom på fredagen och stannade i tre dagar.

          Vi firade i mormors trädgård. Olle grillade och barnen lekte. Nils spelade fotboll med Pers barn och Wilma tog många foton. Mormor fick många presenter, men hon tyckte bäst om ett gammalt foto från Wilma. På kvällen sjöng vi och dansade. Det var en fantastisk dag! Nu vill mormor ha en fest varje år.
        items:
          - { id: pjey, type: truefalse, statement: "Mormor fyllde åttio år.", answer: false, tip: "Hoe oud werd ze?", correction: { answers: ["{Mormor|Hon} fyllde nittio[ år]."] } }
          - { id: xnas, type: truefalse, statement: "Ingrids moster bor i Göteborg.", answer: true }
          - { id: 9ka8, type: truefalse, statement: "Festen var på en restaurang.", answer: false, tip: "Waar vierden ze het?", correction: { answers: ["Festen var i mormors trädgård.", "De firade i mormors trädgård."] } }
          - { id: exg7, type: truefalse, statement: "Olle grillade.", answer: true }
          - { id: ygw9, type: truefalse, statement: "Mormor fick inga presenter.", answer: false, tip: "Kreeg ze cadeaus?", correction: { answers: ["{Mormor|Hon} fick många presenter."] } }
          - { id: ky5s, type: truefalse, statement: "På kvällen sjöng de.", answer: true }
          - { id: yqb5, type: truefalse, statement: "Karin stannade i tre dagar.", answer: true }
          - { id: hpa4, type: truefalse, statement: "Wilma spelade fotboll med Pers barn.", answer: false, tip: "Wie speelde er voetbal, en wat deed Wilma?", correction: { answers: ["Nils spelade fotboll med Pers barn.", "Nils spelade fotboll.", "{Wilma|Hon} tog [många ]foton.", "{Wilma|Hon} spelade inte fotboll.", "{Wilma|Hon} fotograferade."] } }
          - { id: mkgw, type: truefalse, statement: "Mormor vill ha en fest varje år.", answer: true }

      - id: makkelijk-1
        title: "Makkelijk lezen: Farmor fyller år"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Farmor fyller år"
        text: |
          Förra veckan fyllde Olles mamma åttio år. Hela familjen besökte henne. Nils ritade ett kort och Wilma köpte en present. De åt tårta och drack kaffe i trädgården. Farmor skrattade mycket. Hon var glad hela dagen.
        items:
          - { id: sv9y, type: truefalse, statement: "Olles mamma fyllde sextio år.", answer: false }
          - { id: un95, type: truefalse, statement: "Nils ritade ett kort.", answer: true }
          - { id: zzgs, type: truefalse, statement: "De åt i köket.", answer: false }

      - id: makkelijk-2
        title: "Makkelijk lezen: Brams familj"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Brams familj"
        text: |
          Bram har en bror och en syster. Hans bror heter Tim och bor i Amsterdam. Hans syster heter Eva. Hon är gift och har två barn, en son och en dotter. Förut bodde hela familjen i Utrecht. Förra året besökte Eva och barnen Bram i Västerås.
        items:
          - { id: ayy4, type: truefalse, statement: "Bram har två bröder.", answer: false }
          - { id: npqg, type: truefalse, statement: "Eva har en son och en dotter.", answer: true }

      - id: makkelijk-3
        title: "Makkelijk lezen: En ledig dag"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "En ledig dag"
        text: |
          Igår var Fleur ledig. Hon sov länge och åt frukost i sängen. Sedan ringde hennes mamma från Nederländerna. De pratade i en timme. På eftermiddagen gick Fleur till stan och köpte en ny jacka. På kvällen lagade Bram middag.
        items:
          - { id: f3ya, type: truefalse, statement: "Fleur jobbade igår.", answer: false }
          - { id: yqn2, type: truefalse, statement: "Fleurs mamma ringde.", answer: true }
          - { id: henh, type: mc, prompt: "Vad köpte Fleur?", options: ["En jacka.", "En bok.", "En present."], answer: 0 }

      - id: makkelijk-4
        title: "Makkelijk lezen: Olles syster"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Olles syster"
        text: |
          Olle har en syster. Hon heter Lena och bor i Malmö. Hennes man heter Lars. De har tre barn. Förra sommaren kom de till Västerås. Barnen badade i sjön med Wilma och Nils. Lena och Olle pratade i trädgården. Det var en bra vecka.
        items:
          - { id: nmb4, type: truefalse, statement: "Lena bor i Malmö.", answer: true }
          - { id: 9dxj, type: mc, prompt: "Hur många barn har Lena?", options: ["Två.", "Tre.", "Fyra."], answer: 1 }
          - { id: uzpm, type: truefalse, statement: "Barnen badade i havet.", answer: false }

      - id: taak-mormor
        title: "Taak: het feest van oma"
        kind: taak
        instruction: "Het is maandag. Je collega Jonas vraagt naar je weekend. Zaterdag was je bij je oma (moeders moeder), die tachtig werd. Je ouders, je broer en je neef (*kusin*) waren er ook. Je gaf haar een foto van de hele familie, en jullie hebben in de tuin gegrild. Je oma woont bij je oom (moeders broer) en zijn vrouw. **Doel:** vertel Jonas over het feest. Kies of schrijf bij elke stap wat jij zegt."
        topic: preteritum
        items:
          - id: hk9s
            type: steps
            explain: "Gelukt: Jonas weet nu wie er op het feest was, wat je je oma gaf en wat jullie deden."
            steps:
              - type: mc
                topic: starka-verb
                prompt: "**Jonas:** Hej! Vad gjorde du i helgen? — *Zeg dat je bij je oma was en dat ze tachtig werd.*"
                options:
                  - "Jag var hos min mormor. Hon fyllde åttio år."
                  - "Jag är hos min mormor. Hon fyller åttio år."
                  - "Jag var hos min farmor. Hon fyllde åttio år."
                  - "Jag var hos mitt mormor. Hon fyllde åttio år."
                answer: 0
                optionTips:
                  - null
                  - "Het was zaterdag: verleden tijd (*var*, *fyllde*)."
                  - "*farmor* is de moeder van je vader. De moeder van je moeder is *mormor*."
                  - "*mormor* is een en-woord: *min mormor*."
              - type: translate
                topic: possessiv
                prompt: "**Jonas:** Grattis till henne! Vem var där? — *Zeg: mijn ouders, mijn broer en mijn neef.*"
                answers:
                  - "Mina föräldrar, min bror och min kusin[ {var {också där|där[ också]}|kom[ också]}]."
                feedback:
                  - { contains: ["min föräldrar", "mitt föräldrar"], tip: "*föräldrar* is meervoud: *mina föräldrar*." }
                  - { contains: ["mitt bror", "mina bror", "mitt kusin"], tip: "*bror* en *kusin* zijn en-woorden: *min bror*, *min kusin*." }
                  - { contains: "är där", tip: "Het feest was zaterdag: verleden tijd, *var där*." }
              - type: gap
                topic: starka-verb
                prompt: "**Jonas:** Vad gav du henne? — *Je gaf haar een foto van de hele familie.*"
                text: "Jag ___ henne ett foto av hela familjen."
                gaps:
                  - answers: ["gav"]
                    options: ["gav", "gade", "ger", "fick"]
                    feedback:
                      - { match: "gade", tip: "*ge* is onregelmatig: *ge – gav*." }
                      - { match: "ger", tip: "Het was zaterdag: verleden tijd, *gav*." }
                      - { match: "fick", tip: "*fick* is kreeg. Jij gaf de foto: *gav*." }
              - type: translate
                topic: preteritum
                prompt: "**Jonas:** Vad fint! Vad gjorde ni på festen? — *Zeg dat jullie in de tuin grilden en veel lachten.*"
                answers:
                  - "Vi grillade i trädgården[,] och [vi ]skrattade mycket."
                  - "Vi grillade och skrattade mycket i trädgården."
                feedback:
                  - { contains: ["grillde", "skrattde"], tip: "Werkwoorden op *-ar* krijgen *-ade*: *grillade*, *skrattade*." }
                  - { contains: ["vi grillar", "skrattar"], tip: "Het feest was zaterdag: verleden tijd (*grillade*, *skrattade*)." }
                  - { contains: ["i trädgård ", "i trädgård."], tip: "In de tuin = *i trädgården*." }
              - type: mc
                topic: possessiv
                prompt: "**Jonas:** Bor din mormor ensam? — *Nee: ze woont bij je oom (moeders broer) en zijn vrouw.*"
                options:
                  - "Nej, hon bor hos min morbror och hans fru."
                  - "Nej, hon bor hos min farbror och hans fru."
                  - "Nej, hon bor hos min morbror och hennes fru."
                  - "Nej, hon bor hos min morbror och hans frun."
                answer: 0
                optionTips:
                  - null
                  - "*farbror* is de broer van je vader. De broer van je moeder is *morbror*."
                  - "*hennes* is haar. De vrouw van je oom is *hans fru* (zijn vrouw)."
                  - "Na *hans* komt de onbepaalde vorm: *hans fru*."

      - id: schrijven-familie
        title: "Schrijven: jouw familie"
        instruction: "Bouw eerst je tekst op in vier stappen die de app nakijkt. Daarna schrijf je, als je wilt, over je eigen familie."
        topic: preteritum
        items:
          - { id: 9sjj, type: gap, topic: possessiv, prompt: "Kies het goede woord.", text: "___ föräldrar bor i Arnhem.", gaps: [{ answers: ["Mina"], options: ["Mina", "Min", "Mitt"], tip: "föräldrar is meervoud: mina." }] }
          - { id: mpd4, type: gap, text: "Förra helgen ___ (besöka) jag mina föräldrar.", gaps: [{ answers: ["besökte"], feedback: [{ match: ["besökade", "besöker"], tip: "Förra helgen is verleden tijd. besöka is een -er-werkwoord: besökte." }] }] }
          - { id: hjdy, type: order, prompt: "Vertel wat jullie gisteren samen deden.", start: "Igår", tokens: ["åt", "vi", "middag", "tillsammans"], answers: ["Igår åt vi middag tillsammans."] }
          - { id: u4b7, type: gap, topic: starka-verb, text: "På söndagen ___ (gå) vi en lång promenad.", gaps: [{ answers: ["gick"], feedback: [{ match: ["gådde", "gåde", "går"], tip: "gå is onregelmatig: gick." }] }] }
          - id: 9qz8
            type: free
            prompt: "Vertel over je familie (wie zijn er, waar wonen ze) en over iets wat je onlangs samen gedaan hebt. Gebruik de verleden tijd."
            minWords: 35
            require:
              - { any: ["min", "mitt", "mina"], label: "Je gebruikt min, mitt of mina" }
              - { any: ["igår", "i går", "förra", "i helgen", "i somras", "sedan"], label: "Je noemt een moment in het verleden (igår, förra veckan …)" }
              - { any: ["var", "hade", "gick", "åt", "kom", "träffade", "besökte", "firade", "gjorde"], label: "Je gebruikt de verleden tijd" }
            model: "Min familj är inte så stor. Mina föräldrar bor i Arnhem och min syster bor i Gent med sin man. Min bror bor i Kanada. Förra helgen besökte jag mina föräldrar. Vi åt middag tillsammans och på söndagen gick vi en lång promenad. Min mamma fyllde 65 år, så vi firade med tårta. Det var mysigt."

