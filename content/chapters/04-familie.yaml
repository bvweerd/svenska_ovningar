      - id: luisteren-gesprek
        title: "Luisteren: het weekend van Ingrid"
        instruction: Luister naar het gesprek. Is de bewering **rätt** of **fel**? Lees de tekst pas als je klaar bent.
        topic: preteritum
        listen: true
        textTitle: "I helgen"
        text: |
          Fleur: Hej Ingrid! Vad gjorde du i helgen?

          Ingrid: Min syster och hennes barn kom till oss. Vi lagade mat och spelade spel.

          Fleur: Vad trevligt! Hur gamla är hennes barn?

          Ingrid: Hennes son är sex och hennes dotter är nio. De sov hos oss på lördagen.

          Fleur: Var det jobbigt?

          Ingrid: Lite. Nils och hans kusin pratade hela natten!
        items:
          - { id: 95g4, type: truefalse, statement: "Ingrids syster kom på besök.", answer: true }
          - { id: zyjz, type: truefalse, statement: "Systerns son är nio år.", answer: false }
          - { id: saft, type: truefalse, statement: "Barnen sov hos Ingrid.", answer: true }

      - id: luisteren-dictee
        title: "Dictee"
        instruction: Luister en maak de zin die je hoort.
        topic: starka-verb
        shuffle: true
        items:
