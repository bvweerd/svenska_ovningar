    intro: Een grote gemengde herhaling met stof uit alle hoofdstukken.
    exercises:
      - id: eindherhaling-1
        title: Eindherhaling (1)
        instruction: Beantwoord de vragen. Ze gaan over alle hoofdstukken door elkaar.
        shuffle: true
        items:
          - { id: a223, type: gap, topic: adjektiv-bestamd, text: "Har du sett den ___ filmen? (ny)", gaps: [{ answers: ["nya"] }] }
          - { id: qmcm, type: gap, topic: komparation, text: "Wilma är ___ än Nils. (gammal)", gaps: [{ answers: ["äldre"] }] }
          - { id: u5q3, type: translate, topic: bisats-ordfoljd, prompt: "Ik weet dat hij nooit te laat komt.", answers: ["Jag vet att han aldrig kommer för sent."], feedback: [{ contains: "kommer aldrig", tip: "In de bijzin staat aldrig vóór het werkwoord." }] }
          - { id: f8cn, type: gap, topic: sin-sitt-sina, text: "Nils öppnar ___ julklappar.", gaps: [{ answers: ["sina"], options: ["sin", "sitt", "sina", "hans"], shuffle: false }] }
          - { id: 3ntd, type: gap, topic: perfekt-preteritum, text: "Förra julen ___ (vara) vi i Nederländerna.", gaps: [{ answers: ["var"] }] }
          - { id: k6t2, type: gap, topic: positionsverb, text: "Granen ___ i vardagsrummet.", gaps: [{ answers: ["står"], options: ["ligger", "står", "sitter"], shuffle: false }] }
          - { id: j634, type: gap, topic: reflexiv, text: "Vi måste skynda ___, annars missar vi tåget.", gaps: [{ answers: ["oss"], options: ["oss", "er", "sig"], shuffle: false }] }
          - { id: h98b, type: gap, topic: tycka-tro-tanka, text: "Vad ___ du om julmaten?", gaps: [{ answers: ["tycker"], options: ["tycker", "tror", "tänker"], shuffle: false }] }
          - { id: dkrf, type: clock, time: "15:00" }
          - { id: ncr8, type: gap, topic: ordningstal, text: "Lucia firas den ___ december. (13)", gaps: [{ answers: ["trettonde"] }] }
          - { id: 85gu, type: translate, topic: det-finns, prompt: "Er zijn geen peperkoekjes meer.", answers: ["Det finns {inga|inte några} pepparkakor kvar."], feedback: [{ contains: "inte pepparkakor", tip: "Geen + meervoud: inga." }] }
          - { id: g5gr, type: order, topic: tidsuttryck, start: "På julafton", tokens: ["tittar", "många svenskar", "på Kalle Anka"], answers: ["På julafton tittar många svenskar på Kalle Anka."] }

      - id: eindherhaling-2
        title: Eindherhaling (2)
        instruction: Vertaal naar het Zweeds. Hierin komt van alles terug.
        items:
          - { id: n5sr, type: translate, topic: v2, prompt: "Morgen gaan we naar oma.", answers: ["Imorgon {ska vi åka|åker vi|ska vi|går vi} till {mormor|farmor}.", "Vi {ska åka|åker|ska|går} till {mormor|farmor} imorgon."], feedback: [{ contains: "imorgon vi", tip: "Na een tijdsbepaling vooraan komt eerst het werkwoord." }] }
          - { id: aqek, type: translate, topic: perfekt-preteritum, prompt: "Ik heb nog nooit een eland gezien.", answers: ["Jag har aldrig sett {någon|en} älg."], feedback: [{ contains: "aldrig har", tip: "aldrig staat na har." }] }
          - { id: 2q95, type: translate, topic: adjektiv-obestamd, prompt: "Ze hebben een groot rood huis.", answers: ["De har ett stort rött hus."], feedback: [{ contains: "stor röd hus", tip: "hus is een ett-woord: stort rött." }] }
          - { id: 5hmr, type: translate, topic: indirekt-tal, prompt: "Ze vraagt of je komt.", answers: ["Hon frågar om du kommer."], feedback: [{ contains: "om kommer du", tip: "In de bijzin: eerst het onderwerp, dan het werkwoord." }] }
