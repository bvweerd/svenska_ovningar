      - id: lezen-lucia
        title: "Lezen: Lucia en kerstavond"
        instruction: Lees de tekst. Is de bewering **rätt** of **fel**? Is hij fout, schrijf dan de juiste zin op.
        topic: adjektiv-bestamd
        textTitle: December hos familjen Ek
        text: |
          Den trettonde december var det luciatåg i Nils skola. Wilma var Lucia. Hon hade ett långt vitt linne och en krona med ljus på huvudet. Nils var stjärngosse. Alla föräldrarna satt i den stora aulan och lyssnade. Efteråt drack de glögg och åt lussekatter och pepparkakor.

          På julafton kom Fleur och Bram till familjen Ek. Klockan tre tittade alla på Kalle Anka på tv, som många svenskar gör varje år. Sedan åt de julbord med skinka, sill och köttbullar. På kvällen kom tomten med julklappar. Nils fick den största julklappen – en ny cykel!

          På juldagen sov alla länge. Sedan ville Nils prova sin nya cykel, fastän det låg mycket snö ute. Fleur och Bram åt lunch med familjen och åkte sedan hem till sin nya lägenhet. Fleur tyckte att julen i Sverige var mysigare än julen i Nederländerna. Alla ljusen i de mörka fönstren var så vackra!
        items:
          - { id: czre, type: truefalse, statement: "Luciatåget var den tjugofjärde december.", answer: false, tip: "Wanneer is Lucia?", correction: { answers: ["Luciatåget var den trettonde december."] } }
          - { id: 635e, type: truefalse, statement: "Wilma var Lucia.", answer: true }
          - { id: s772, type: truefalse, statement: "Nils var tomte i luciatåget.", answer: false, tip: "Wat was Nils?", correction: { answers: ["{Nils|Han} var stjärngosse."] } }
          - { id: hyxw, type: truefalse, statement: "Efter luciatåget drack de glögg.", answer: true }
          - { id: d3nw, type: truefalse, statement: "På julafton tittade de på Kalle Anka klockan fem.", answer: false, tip: "Hoe laat?", correction: { answers: ["På julafton tittade {de|alla} på Kalle Anka klockan tre.", "{De|Alla} tittade på Kalle Anka klockan tre[ på julafton].", "Klockan tre tittade {de|alla} på Kalle Anka[ på julafton]."] } }
          - { id: 7va6, type: truefalse, statement: "Nils fick en ny cykel.", answer: true }
          - { id: jtf4, type: truefalse, statement: "På juldagen gick alla upp tidigt.", answer: false, tip: "Lees het begin van de laatste alinea.", correction: { answers: ["På juldagen sov alla länge.", "Alla sov länge[ på juldagen]."] } }
          - { id: bkja, type: truefalse, statement: "Nils ville prova sin nya cykel.", answer: true }
          - { id: 4vpd, type: truefalse, statement: "Fleur och Bram bor i ett stort hus.", answer: false, tip: "Waar wonen Fleur en Bram?", correction: { answers: ["{Fleur och Bram|De} bor i en [ny ]lägenhet.", "{Fleur och Bram|De} har en [ny ]lägenhet."] } }
          - { id: u93x, type: truefalse, statement: "Fleur tyckte att julen i Nederländerna var mysigare.", answer: false, tip: "Welke kerst vond Fleur gezelliger?", correction: { answers: ["{Fleur|Hon} tyckte att julen i Sverige var mysigare[ än julen i Nederländerna].", "Julen i Sverige var mysigare[ än julen i Nederländerna]."] } }

      - id: makkelijk-1
        title: "Makkelijk lezen: Den lilla granen"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Den lilla granen"
        text: |
          Familjen Ek ska köpa en gran. Wilma vill ha en stor gran, men Nils vill ha en liten. De köper en liten gran, eftersom vardagsrummet inte är så stort. De pyntar granen med röda kulor och vita ljus. Den lilla granen är vackrare än förra årets gran, tycker Ingrid.
        items:
          - { id: xvdd, type: truefalse, statement: "De köper en stor gran.", answer: false }
          - { id: chtw, type: truefalse, statement: "Granen har röda kulor.", answer: true }

      - id: makkelijk-2
        title: "Makkelijk lezen: Julklapparna"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Julklapparna"
        text: |
          Bram har köpt julklappar till alla. Fleur får ett par varma vantar, Wilma får en ny bok och Nils får det största paketet. I paketet finns en fotboll. Nils är gladast av alla. Han vill spela fotboll nu, men ute är det mörkt och kallt.
        items:
          - { id: sxcm, type: truefalse, statement: "Nils får en fotboll.", answer: true }
          - { id: zgsc, type: truefalse, statement: "Wilma får vantar.", answer: false }

      - id: dialoog-cadeau
        title: Een kerstcadeau
        instruction: Zet het gesprek tussen Ingrid en Fleur in de goede volgorde.
        topic: adjektiv-obestamd
        items:
          - id: j68q
            type: dialogue
            lines:
              - "Ingrid: God jul, Fleur! Här är en liten julklapp till dig."
              - "Fleur: Tack, vad snällt! Får jag öppna den nu?"
              - "Ingrid: Ja, självklart!"
              - "Fleur: Åh, vilka fina vantar! Har du stickat dem själv?"
              - "Ingrid: Ja, det har jag. Tycker du om färgen?"
              - "Fleur: Jag älskar den! Nu blir jag aldrig kall om händerna."

