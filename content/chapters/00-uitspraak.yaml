chapter: 0
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik hoor het verschil tussen de sje- en de tje-klank, en weet wanneer k, g en sk zacht klinken", topics: [sje-tje, hard-zacht] }
  - { text: "Ik hoor of een klinker lang of kort is en waar de klemtoon ligt", topics: [klinkerlengte, klemtoon] }
  - { text: "Ik herken gewone spreektaalvormen en weet hoe je ze schrijft", topics: [spreektaal] }

grammar:
  - id: sje-tje
    title: Sje-ljud en tje-ljud
    summary: "**sj, skj, stj, -tion** en **sk** + zachte klinker → sje-ljud; **tj, kj** en **k** + zachte klinker → tje-ljud."
    body: |
      Het Zweeds heeft twee klanken die het Nederlands niet kent.

      ### Sje-ljud
      Een ruisende klank, ergens tussen *sj* en *ch*. Je hoort hem in *sju* (zeven).

      | Spelling | Voorbeeld |
      |---|---|
      | sj | sju, sjö |
      | skj | skjorta |
      | stj | stjärna |
      | sk + zachte klinker | sked, skön |
      | -tion, -sion | station, version |
      | ch (leenwoorden) | choklad, chef |

      ### Tje-ljud
      Een lichte, scherpe klank, zoals de *ch* in het Duitse *ich*. Je hoort hem in *tjugo* (twintig).

      | Spelling | Voorbeeld |
      |---|---|
      | tj | tjugo, tjej |
      | kj | kjol |
      | k + zachte klinker | kyrka, köpa |

  - id: hard-zacht
    title: Harde en zachte klinkers
    summary: "Na **k, g** en **sk** bepaalt de klinker de klank: **a, o, u, å** zijn hard, **e, i, y, ä, ö** zijn zacht."
    body: |
      Het Zweeds verdeelt de klinkers in twee groepen:

      | Hard | Zacht |
      |---|---|
      | a, o, u, å | e, i, y, ä, ö |

      Staat er een **k**, **g** of **sk** voor een klinker, dan hangt de uitspraak af van die klinker:

      | | Voor harde klinker | Voor zachte klinker |
      |---|---|---|
      | k | [k]: *katt, kul* | tje-ljud: *kör, kyrka* |
      | g | [g]: *gata, god* | [j]: *göra, gilla* |
      | sk | [sk]: *skola, skål* | sje-ljud: *skön, sked* |

      Let op: dit geldt aan het begin van een woord (of lettergreep met klemtoon). In een lettergreep zonder klemtoon blijft *sk* meestal gewoon [sk]: *fiskar*, *fisken*. Een bekende uitzondering is *människa*: dat zeg je wél met een sje-klank. Ook *kille* en *kex* zijn uitzonderingen: daar hoor je een gewone [k].

  - id: klinkerlengte
    title: Lange en korte klinkers
    summary: "Eén medeklinker na de klinker → meestal **lang** (*tak*); twee medeklinkers → **kort** (*tack*)."
    body: |
      In een beklemtoonde lettergreep is de klinker óf lang óf kort. Dat hoor je goed en het kan het verschil in betekenis maken.

      | Lang | Kort |
      |---|---|
      | tak (dak) | tack (dank) |
      | glas (glas) | glass (ijs) |
      | vit (wit) | vitt (wit, ett-vorm) |
      | ful (lelijk) | full (vol) |

      Vuistregel: staat er één medeklinker na de klinker, dan is de klinker meestal lang. Staan er twee (of meer), dan is hij kort.

      Let op: een aantal korte, veelgebruikte woorden heeft een **korte** klinker, ook al staat er maar één medeklinker achter: *han, man, kan, hon, vem, som, dem, den, rum, hem*.

  - id: klemtoon
    title: Klemtoon
    summary: "Meestal ligt de klemtoon op de **eerste** lettergreep; leenwoorden hebben hem vaak achteraan, werkwoorden op **-era** op de *e*."
    body: |
      - Bij de meeste Zweedse woorden ligt de klemtoon op de **eerste lettergreep**: *flicka*, *morgon*, *kvinna*.
      - Veel **leenwoorden** hebben de klemtoon op de **laatste lettergreep**: *station*, *banan*, *telefon*, *choklad*.
      - Werkwoorden op **-era** hebben de klemtoon op de *e* van *-era*: *promenera*, *studera*, *reparera*.
      - De voorvoegsels **be-** en **för-** krijgen in werkwoorden geen klemtoon: *betala*, *förstå*, *berätta*. In zelfstandige naamwoorden krijgt *för-* vaak wél klemtoon: *FÖRmiddag*, *FÖRnamn*.

  - id: spreektaal
    title: Spreektaal
    summary: "Een aantal veelgebruikte woorden spreek je anders uit dan je ze schrijft: *jag* → *ja*, *och* → *å*, *de* → *dom*."
    body: |
      Sommige korte woorden worden in gewone spreektaal anders uitgesproken dan ze geschreven worden. In gewone schrijftaal schrijf je ze zoals in de linkerkolom. Alleen *sen* wordt ook in nette teksten vaak geschreven; *mej, dej, nåt* en *dom* zie je alleen in informele berichtjes.

      | Geschreven | Gesproken |
      |---|---|
      | jag | ja |
      | och | å |
      | att (vóór een infinitief: *att äta*) | å |
      | mig, dig, sig | mej, dej, sej |
      | de, dem | dom |
      | det | de |
      | något | nåt |
      | sedan | sen |
      | säger | säjer |

      De *å* in de tabel bij *och* en *att* staat voor een **korte** o, zoals in *pot*: niet de lange klank van *två* of *på*. Wie het woord benadrukt, spreekt *och* soms uit als *ock*. Het voegwoord *att* („dat”: *Jag vet att …*) spreek je meestal gewoon met t uit.

sections:
  - id: oefeningen
    title: Oefeningen
    exercises:
      - id: sje-of-tje
        title: Sje-ljud of tje-ljud?
        instruction: Welke klank hoor je aan het begin van het woord?
        topic: sje-tje
        shuffle: true
        items:
          - { id: 9u6e, type: mc, prompt: "**sju** (zeven)", options: ["sje-ljud", "tje-ljud"], answer: 0, shuffle: false, tip: "Kijk naar de spelling: sj." }
          - { id: xceg, type: mc, prompt: "**tjugo** (twintig)", options: ["sje-ljud", "tje-ljud"], answer: 1, shuffle: false, tip: "tj is altijd een tje-ljud, een lichte klank zoals de ch in het Duitse *ich*." }
          - { id: ynkg, type: mc, prompt: "**kjol** (rok)", options: ["sje-ljud", "tje-ljud"], answer: 1, shuffle: false, tip: "kj is, net als tj, een tje-ljud." }
          - { id: gf3h, type: mc, prompt: "**sked** (lepel)", options: ["sje-ljud", "tje-ljud"], answer: 0, shuffle: false, tip: "sk vóór een zachte klinker (e) wordt een sje-ljud." }
          - { id: 6ak4, type: mc, prompt: "**kyrka** (kerk)", options: ["sje-ljud", "tje-ljud"], answer: 1, shuffle: false, tip: "k vóór een zachte klinker (y) wordt een tje-ljud." }
          - { id: xyqe, type: mc, prompt: "**stjärna** (ster)", options: ["sje-ljud", "tje-ljud"], answer: 0, shuffle: false, tip: "stj is, net als sj en skj, een sje-ljud: de t hoor je niet." }
          - { id: 9dbd, type: mc, prompt: "**köpa** (kopen)", options: ["sje-ljud", "tje-ljud"], answer: 1, shuffle: false, tip: "k vóór een zachte klinker (ö) wordt een tje-ljud." }
          - { id: hg92, type: mc, prompt: "**choklad** (chocolade)", options: ["sje-ljud", "tje-ljud"], answer: 0, shuffle: false, tip: "ch in een leenwoord (choklad, chef) is een sje-ljud." }
          - { id: skpa, type: mc, prompt: "**tjej** (meisje)", options: ["sje-ljud", "tje-ljud"], answer: 1, shuffle: false, tip: "Kijk naar de spelling: tj." }
          - { id: c3t9, type: mc, prompt: "**skjorta** (overhemd)", options: ["sje-ljud", "tje-ljud"], answer: 0, shuffle: false, tip: "skj is, net als sj en stj, een sje-ljud: de k hoor je niet." }
          - { id: f24q, type: mc, prompt: "**sjö** (meer)", options: ["sje-ljud", "tje-ljud"], answer: 0, shuffle: false, tip: "sj is altijd een sje-ljud." }
          - { id: 8vd8, type: mc, prompt: "**kär** (verliefd)", options: ["sje-ljud", "tje-ljud"], answer: 1, shuffle: false, tip: "k vóór een zachte klinker (ä) wordt een tje-ljud." }

      - id: sje-aan-het-eind
        title: "Ook midden en achteraan: -tion"
        instruction: Welke woorden bevatten een sje-ljud? Kies alle goede antwoorden.
        topic: sje-tje
        items:
          - id: dt4r
            type: multi
            options: ["station", "information", "tidning", "skina", "kaka", "kök"]
            answers: [0, 1, 3]
            tip: "Denk aan -tion en aan sk vóór een zachte klinker (i) aan het begin van een woord."
          - id: 7qve
            type: multi
            prompt: "Welke woorden bevatten een sje-ljud?"
            options: ["version", "nation", "sjuk", "kniv", "skal", "tjock"]
            answers: [0, 1, 2]
            tip: "-sion, -tion en sj zijn een sje-ljud. tj (tjock) is een tje-ljud, sk vóór een harde klinker (skal) is [sk], en de k in kniv spreek je gewoon uit."

      - id: hard-of-zacht
        title: Harde of zachte klank?
        instruction: Hoe spreek je de eerste klank uit?
        topic: hard-zacht
        shuffle: true
        items:
          - { id: 3fjq, type: mc, prompt: "**katt** (kat)", options: ["[k], zoals in kat", "tje-ljud"], answer: 0, shuffle: false, tip: "a is een harde klinker." }
          - { id: z4pe, type: mc, prompt: "**kör** (koor)", options: ["[k], zoals in kat", "tje-ljud"], answer: 1, shuffle: false, tip: "ö is een zachte klinker." }
          - { id: fmka, type: mc, prompt: "**kul** (leuk)", options: ["[k], zoals in kat", "tje-ljud"], answer: 0, shuffle: false, tip: "u is een harde klinker." }
          - { id: sfqh, type: mc, prompt: "**gata** (straat)", options: ["[g], zoals in het Engelse *go*", "[j], zoals in jas"], answer: 0, shuffle: false, tip: "a is een harde klinker." }
          - { id: 6wby, type: mc, prompt: "**göra** (doen)", options: ["[g], zoals in het Engelse *go*", "[j], zoals in jas"], answer: 1, shuffle: false, tip: "ö is een zachte klinker." }
          - { id: sehw, type: mc, prompt: "**gilla** (leuk vinden)", options: ["[g], zoals in het Engelse *go*", "[j], zoals in jas"], answer: 1, shuffle: false, tip: "i is een zachte klinker." }
          - { id: 6azc, type: mc, prompt: "**skola** (school)", options: ["[sk]", "sje-ljud"], answer: 0, shuffle: false, tip: "o is een harde klinker." }
          - { id: gn6a, type: mc, prompt: "**skön** (fijn, lekker)", options: ["[sk]", "sje-ljud"], answer: 1, shuffle: false, tip: "ö is een zachte klinker." }

      - id: zachte-klinkers
        title: Welke klinkers zijn zacht?
        instruction: Kies alle zachte klinkers.
        topic: hard-zacht
        items:
          - id: m6cy
            type: multi
            options: ["a", "e", "i", "o", "u", "y", "å", "ä", "ö"]
            answers: [1, 5, 7, 8, 2]
            shuffle: false
            tip: "Er zijn er vijf. De harde zijn a, o, u en å."
          - id: 395y
            type: multi
            prompt: "Bij welke woorden klinkt de g als [j]?"
            options: ["göra", "gata", "gilla", "gå", "gärna", "god"]
            answers: [0, 2, 4]
            tip: "g vóór een zachte klinker (ö, i, ä) klinkt als [j]. Vóór een harde klinker (a, å, o) blijft het [g]."

      - id: lang-of-kort
        title: Lange of korte klinker?
        instruction: Is de klinker in het vetgedrukte woord lang of kort?
        topic: klinkerlengte
        shuffle: true
        items:
          - { id: 6n9j, type: mc, prompt: "**tak** (dak)", options: ["lang", "kort"], answer: 0, shuffle: false, tip: "Na de a staat maar één medeklinker." }
          - { id: a8au, type: mc, prompt: "**tack** (dank je)", options: ["lang", "kort"], answer: 1, shuffle: false, tip: "Na de a staan twee medeklinkers (ck)." }
          - { id: 4vwe, type: mc, prompt: "**glas** (glas)", options: ["lang", "kort"], answer: 0, shuffle: false, tip: "Na de a staat maar één medeklinker." }
          - { id: q8e3, type: mc, prompt: "**glass** (ijsje)", options: ["lang", "kort"], answer: 1, shuffle: false, tip: "Na de a staan twee medeklinkers (ss)." }
          - { id: 59ny, type: mc, prompt: "**ful** (lelijk)", options: ["lang", "kort"], answer: 0, shuffle: false, tip: "Na de u staat maar één medeklinker." }
          - { id: zkat, type: mc, prompt: "**full** (vol)", options: ["lang", "kort"], answer: 1, shuffle: false, tip: "Na de u staan twee medeklinkers (ll)." }
          - { id: mkad, type: mc, prompt: "**vit** (wit)", options: ["lang", "kort"], answer: 0, shuffle: false, tip: "Na de i staat maar één medeklinker." }
          - { id: v26d, type: mc, prompt: "**vitt** (wit, bij een ett-woord)", options: ["lang", "kort"], answer: 1, shuffle: false, tip: "Na de i staan twee medeklinkers (tt)." }

      - id: klemtoon
        title: Waar ligt de klemtoon?
        instruction: Kies de lettergreep met de klemtoon.
        topic: klemtoon
        shuffle: true
        items:
          - { id: ck5s, type: mc, prompt: "**flicka** (meisje)", options: ["FLICK-a", "flick-A"], answer: 0, shuffle: false, tip: "Een gewoon Zweeds woord: klemtoon vooraan." }
          - { id: ztgp, type: mc, prompt: "**station** (station)", options: ["STA-tion", "sta-TION"], answer: 1, shuffle: false, tip: "Een leenwoord: klemtoon achteraan." }
          - { id: eunb, type: mc, prompt: "**banan** (banaan)", options: ["BA-nan", "ba-NAN"], answer: 1, shuffle: false, tip: "Een leenwoord, net als in het Nederlands." }
          - { id: 3gb9, type: mc, prompt: "**betala** (betalen)", options: ["BE-ta-la", "be-TA-la", "be-ta-LA"], answer: 1, shuffle: false, tip: "Het voorvoegsel be- krijgt geen klemtoon." }
          - { id: 8tu5, type: mc, prompt: "**promenera** (wandelen)", options: ["PRO-me-ne-ra", "pro-ME-ne-ra", "pro-me-NE-ra"], answer: 2, shuffle: false, tip: "Werkwoorden op -era: klemtoon op de e van -era." }
          - { id: cjy4, type: mc, prompt: "**förstå** (begrijpen)", options: ["FÖR-stå", "för-STÅ"], answer: 1, shuffle: false, tip: "In een werkwoord krijgt het voorvoegsel för- geen klemtoon." }
          - { id: 69nd, type: mc, prompt: "**morgon** (ochtend)", options: ["MOR-gon", "mor-GON"], answer: 0, shuffle: false, tip: "Een gewoon Zweeds woord: klemtoon vooraan." }
          - { id: u3be, type: mc, prompt: "**telefon** (telefoon)", options: ["TE-le-fon", "te-le-FON"], answer: 1, shuffle: false, tip: "Een leenwoord: klemtoon achteraan." }

      - id: spreektaal
        title: Zo zeg je het
        instruction: Hoe wordt het vetgedrukte woord in gewone spreektaal meestal uitgesproken?
        topic: spreektaal
        shuffle: true
        items:
          - { id: pjwx, type: mc, prompt: "**jag** (ik)", options: ["ja", "jag, met duidelijke g", "jak"], answer: 0, tip: "De g aan het eind valt meestal weg." }
          - { id: jmkx, type: mc, prompt: "**och** (en)", options: ["o, kort zoals in *pot* (informeel geschreven als *å*)", "och, met ch zoals in *lach*", "oech, met de oe van *boek*"], answer: 0, tip: "De ch valt weg en de o is kort, zoals in *pot*. Met nadruk zeggen Zweden soms *ock*." }
          - { id: tdkq, type: mc, prompt: "**de** (zij, meervoud)", options: ["dom", "dee", "de"], answer: 0, tip: "In spreektaal klinken de en dem allebei als dom." }
          - { id: er54, type: mc, prompt: "**mig** (mij)", options: ["mej", "mig, met g", "mie"], answer: 0, tip: "mig, dig en sig klinken als mej, dej en sej." }
          - { id: jvqd, type: mc, prompt: "**något** (iets)", options: ["nåt", "nogot", "nägot"], answer: 0, tip: "In spreektaal wordt dit woord ingekort." }
          - { id: 8n3v, type: mc, prompt: "**sedan** (daarna)", options: ["sen", "sedan, met duidelijke d", "sedde"], answer: 0, tip: "In spreektaal wordt dit woord ingekort." }
          - { id: pr7s, type: mc, prompt: "**det** (het)", options: ["de", "dett", "det, met duidelijke t"], answer: 0, tip: "De t aan het eind valt in spreektaal meestal weg." }
          - { id: pz4z, type: mc, prompt: "**säger** (zegt)", options: ["säjer", "säger, met harde g", "sär"], answer: 0, tip: "De g klinkt hier als een j." }

      - id: spreektaal-terug
        title: Van spreektaal naar schrijftaal
        instruction: Je hoort de spreektaalvorm. Schrijf het woord zoals het **geschreven** wordt.
        topic: spreektaal
        shuffle: true
        items:
          - { id: 2xe6, type: gap, text: "Je hoort *ja* → je schrijft ___", gaps: [{ answers: ["jag"] }] }
          - { id: 6drk, type: gap, text: "Je hoort *dom* (zij) → je schrijft ___", gaps: [{ answers: ["de"] }] }
          - { id: 37hx, type: gap, text: "Je hoort *mej* → je schrijft ___", gaps: [{ answers: ["mig"], feedback: [{ match: "mej", tip: "Zo spreek je het uit. In informele berichtjes zie je ook mej, maar de gewone schrijfwijze is met een g aan het eind." }] }] }
          - { id: r6ny, type: gap, text: "Je hoort *nåt* → je schrijft ___", gaps: [{ answers: ["något"] }] }
          - { id: tbg8, type: gap, text: "Je hoort *sen* (daarna) → je schrijft ___", gaps: [{ answers: ["sedan"], feedback: [{ match: "sen", tip: "sen mag je ook schrijven, maar hier zoeken we de volledige vorm." }] }] }
          - { id: yv7a, type: gap, text: "Je hoort *de* (het) → je schrijft ___", gaps: [{ answers: ["det"] }] }
          - { id: v4s7, type: gap, text: "Je hoort *dej* → je schrijft ___", gaps: [{ answers: ["dig"], feedback: [{ match: "dej", tip: "Zo spreek je het uit. De gewone schrijfwijze is met een g aan het eind." }] }] }
          - { id: qkq8, type: gap, text: "Je hoort *säjer* → je schrijft ___", gaps: [{ answers: ["säger"] }] }

  - id: luisteren
    title: Luisteren
    intro: Deze oefeningen gebruiken de voorleesfunctie van je browser. Werkt dat niet goed, kijk dan bij „Luisteren instellen”.
    exercises:
      - id: luisteren-lengte
        title: "Luisteren: lang of kort?"
        instruction: Luister en kies het woord dat je hoort.
        topic: klinkerlengte
        shuffle: true
        items:
          - { id: j4fw, type: listen, say: "tak", options: ["tak", "tack"], answer: 0 }
          - { id: kezd, type: listen, say: "glass", options: ["glass", "glas"], answer: 0 }
          - { id: zpf3, type: listen, say: "full", options: ["full", "ful"], answer: 0 }
          - { id: dhzb, type: listen, say: "vitt", options: ["vitt", "vit"], answer: 0 }
          - { id: swrs, type: listen, say: "mat", options: ["mat", "matt"], answer: 0 }

      - id: luisteren-sje-tje
        title: "Luisteren: sje-ljud of tje-ljud?"
        instruction: Luister. Welke klank hoor je aan het begin van het woord?
        topic: sje-tje
        shuffle: true
        items:
          - { id: g9fs, type: listen, say: "sjuk", options: ["sje-ljud", "tje-ljud"], answer: 0 }
          - { id: awru, type: listen, say: "kyrka", options: ["tje-ljud", "sje-ljud"], answer: 0 }
          - { id: n98e, type: listen, say: "skjorta", options: ["sje-ljud", "tje-ljud"], answer: 0 }
          - { id: sec3, type: listen, say: "tjugo", options: ["tje-ljud", "sje-ljud"], answer: 0 }
          - { id: zhdt, type: listen, say: "sked", options: ["sje-ljud", "tje-ljud"], answer: 0 }
