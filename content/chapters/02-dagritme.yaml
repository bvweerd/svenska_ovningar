        textTitle: "Wilmas vecka"
        text: |
          På måndagar börjar skolan klockan åtta. Wilma vaknar klockan sju. Hon duschar och äter frukost. Sedan tar hon bussen till skolan. På eftermiddagen tränar hon. På kvällen läser hon. På fredagar slutar skolan klockan tolv. På lördagar vill Wilma sova.
