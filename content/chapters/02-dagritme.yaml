chapter: 2
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan vertellen hoe mijn dag en week eruitzien", topics: [tidsuttryck, dagar] }
  - { text: "Ik kan het meervoud van zelfstandige naamwoorden maken", topics: [plural] }
  - { text: "Ik kan iemand iets vragen of opdragen, en zeggen wat ik wil, kan of moet", topics: [imperativ, modala] }

# Personages: Fleur en Bram (Nederlands stel in Västerås), buren Ingrid en Olle Ek
# met hun kinderen Wilma (15) en Nils (10).

grammar:
  - id: tidsuttryck
    title: Tijdsbepaling vooraan
    summary: "Begin je de zin met een tijd (*idag, på morgonen, klockan sju*), dan blijft het werkwoord op **plaats 2** en komt het onderwerp op **plaats 3**."
    body: |
      Een tijdsbepaling staat in het Zweeds vaak vooraan in de zin. De V2-regel uit hoofdstuk 1 blijft gelden: het werkwoord staat op plaats 2. Het onderwerp schuift naar plaats 3.

      | Plaats 1 | Plaats 2 (werkwoord) | Plaats 3 (onderwerp) | Rest |
      |---|---|---|---|
      | Bram | vaknar | – | klockan halv sju. |
      | Klockan halv sju | vaknar | Bram. | |
      | På morgonen | dricker | han | kaffe. |
      | Efter jobbet | handlar | Fleur | mat. |

      Dat werkt precies zoals in het Nederlands: *'s Ochtends drinkt hij koffie.*

      Een veelgemaakte fout is de Engelse volgorde: *~~På morgonen han dricker kaffe~~*.

  - id: dagar
    title: Dagen en dagdelen
    summary: "Dagen schrijf je met een **kleine letter**. *På måndag* = (aanstaande) maandag, *på måndagar* = op maandagen. Dagdelen: *på morgonen, på kvällen* …"
    body: |
      ### De dagen van de week
      *måndag, tisdag, onsdag, torsdag, fredag, lördag, söndag*. Ze krijgen in het Zweeds **geen hoofdletter**, net als de maanden (*januari, februari* …).

      | Zweeds | Betekenis |
      |---|---|
      | på måndag | (aanstaande) maandag |
      | på måndagar | op maandagen, elke maandag |
      | i helgen | dit weekend |

      ### Dagdelen
      | Zweeds | Betekenis |
      |---|---|
      | på morgonen | 's ochtends |
      | på förmiddagen | in de (late) ochtend |
      | på eftermiddagen | 's middags |
      | på kvällen | 's avonds |
      | på natten | 's nachts |

      ### Handige woorden
      *idag* (vandaag), *imorgon* (morgen), *ikväll* (vanavond), *varje dag* (elke dag), *först* (eerst), *sedan* of *sen* (daarna), *efter jobbet* (na het werk). *Idag, imorgon* en *ikväll* mag je ook los schrijven: *i dag, i morgon, i kväll*.

  - id: plural
    title: Meervoud
    summary: "Het meervoud heeft vijf vormen: **-or, -ar, -er, -n** of **geen uitgang**. Bepaald meervoud: meestal **-na** erachter (*bilar → bilarna*)."
    body: |
      Het meervoud is in het Zweeds minder voorspelbaar dan in het Nederlands. Deze vuistregels helpen:

      | Soort woord | Meervoud | Voorbeeld |
      |---|---|---|
      | en-woord op **-a** | **-or** (a valt weg) | en flicka → flickor |
      | veel en-woorden, ook op **-e** en **-ing** | **-ar** | en bil → bilar, en pojke → pojkar, en tidning → tidningar |
      | en-woorden met klemtoon achteraan, leenwoorden | **-er** | en film → filmer, en student → studenter |
      | ett-woord op een **klinker** | **-n** | ett äpple → äpplen |
      | ett-woord op een **medeklinker** | geen uitgang | ett hus → hus, ett barn → barn |
      | en-woord op **-are** | geen uitgang | en lärare → lärare |

      Sommige woorden veranderen van klinker: *en bok → böcker*, *en stad → städer*, *en man → män*. Die leer je uit je hoofd.

      In leerboeken en grammatica's heten deze vormen vaak **groep 1 tot en met 5**: 1 = **-or**, 2 = **-ar**, 3 = **-er**, 4 = **-n**, 5 = **geen uitgang**. Leer bij een nieuw woord het meervoud meteen mee: *en bil – bilar*.

      ### Bepaald meervoud (de …)
      | Meervoud | Bepaald meervoud | Regel |
      |---|---|---|
      | flickor, bilar, filmer | flickor**na**, bilar**na**, filmer**na** | **-na** erachter |
      | äpplen | äpplen**a** | op -n: **-a** erachter |
      | hus, barn | hus**en**, barn**en** | geen uitgang: **-en** erachter |
      | lärare | lärar**na** | -are wordt **-arna** |

  - id: imperativ
    title: De gebiedende wijs (imperativ)
    summary: "Werkwoorden op **-ar**: de gebiedende wijs is gelijk aan de infinitief (*Vänta!*). Werkwoorden op **-er**: haal de **-a** weg (*läsa → Läs!*)."
    body: |
      Met de imperativ geef je een opdracht of een advies.

      | Infinitief | Presens | Imperativ | Regel |
      |---|---|---|---|
      | vänta, titta, öppna | väntar, tittar, öppnar | **Vänta! Titta! Öppna!** | gelijk aan de infinitief |
      | läsa, stänga, skriva | läser, stänger, skriver | **Läs! Stäng! Skriv!** | infinitief zonder -a |
      | höra, köra | hör, kör | **Hör! Kör!** | stam eindigt al op -r |
      | gå, bo | går, bor | **Gå! Bo!** | korte werkwoorden: gelijk aan de infinitief |
      | komma, vara, göra | kommer, är, gör | **Kom! Var! Gör!** | uit je hoofd leren |

      Ontkennen doe je met *inte* erachter: **Gå inte!** **Var inte rädd!**

      Een imperativ klinkt in het Zweeds al snel kortaf, ook met *tack* erachter. Wil je het echt vriendelijk vragen, gebruik dan een vraag: *Kan du stänga dörren?* Of zet er *är du snäll* achter: *Stäng dörren, är du snäll.*

  - id: modala
    title: Modale werkwoorden
    summary: "*kan, vill, ska, måste, får* + **infinitief zonder att**: *Jag vill äta.* *Inte* staat direct na het modale werkwoord."
    body: |
      | Infinitief | Presens | Betekenis | Voorbeeld |
      |---|---|---|---|
      | kunna | kan | kunnen | Jag kan simma. |
      | vilja | vill | willen | Nils vill ha en hund. |
      | – | ska | gaan, zullen (plan) | Ikväll ska vi äta pizza. |
      | – | måste | moeten | Vi måste jobba imorgon. |
      | få | får | mogen | Får jag öppna fönstret? |

      ### Twee regels
      - Na een modaal werkwoord komt de **infinitief zonder att**: *Jag vill äta*, niet *~~Jag vill att äta~~* en niet *~~Jag vill äter~~*.
      - Het modale werkwoord is de persoonsvorm en staat dus op **plaats 2**. *Inte* komt direct erna, de infinitief achteraan: *Jag kan **inte** komma.* Bij inversie: *Idag kan jag **inte** komma.*

      *Ska* en *måste* hebben geen gangbare infinitief. De verleden tijd is *skulle* en *måste*. *Få* betekent behalve **mogen** ook **krijgen**: *Jag får ett brev.* (Ik krijg een brief.)

      Let op: *får inte* betekent **mag niet**. Voor **hoeft niet** gebruik je *behöver inte*: *Du behöver inte komma.*

sections:
  - id: oefeningen
    title: Oefeningen
    exercises:
      - id: tijd-vooraan
        title: Een tijd vooraan in de zin
        instruction: Maak een zin die begint met het gegeven woord. Klik de woorden in de goede volgorde aan.
        topic: tidsuttryck
        items:
          - { id: w2yc, type: order, start: "På morgonen", tokens: ["dricker", "Bram", "kaffe"], answers: ["På morgonen dricker Bram kaffe."] }
          - { id: zfbv, type: order, start: "Klockan sju", tokens: ["Fleur", "vaknar"], answers: ["Klockan sju vaknar Fleur."] }
          - { id: n3jf, type: order, start: "På tisdagar", tokens: ["Nils", "spelar", "fotboll"], answers: ["På tisdagar spelar Nils fotboll."] }
          - { id: a79y, type: order, start: "Efter jobbet", tokens: ["handlar", "Fleur", "mat"], answers: ["Efter jobbet handlar Fleur mat."] }
          - { id: py28, type: order, start: "Ikväll", tokens: ["vi", "tittar", "på film"], answers: ["Ikväll tittar vi på film."] }
          - { id: rupg, type: order, start: "Varje dag", tokens: ["tar", "bussen", "Wilma"], answers: ["Varje dag tar Wilma bussen."] }
          - { id: yhgc, type: order, start: "Klockan åtta", tokens: ["skolan", "börjar"], answers: ["Klockan åtta börjar skolan."] }
          - { id: chxd, type: order, start: "På söndagar", tokens: ["bakar", "Ingrid", "bullar"], answers: ["På söndagar bakar Ingrid bullar."] }

      - id: tijd-vertalen
        title: Vertaal met de tijd vooraan
        instruction: Vertaal naar het Zweeds. Begin de zin met de tijdsbepaling, net als in het Nederlands.
        topic: tidsuttryck
        fixedOrder: true
        items:
          - { id: 8ve7, type: translate, prompt: "Maandag werk ik thuis.", answers: ["På måndag {jobbar|arbetar} jag hemma."], feedback: [{ contains: "måndag jag", tip: "Na de tijdsbepaling komt eerst het werkwoord, dan pas jag." }, { match: ["Måndag jobbar jag hemma", "Måndag arbetar jag hemma"], tip: "Bijna! Voor een dag zet je „på”: på måndag." }] }
          - { id: wrqp, type: translate, prompt: "'s Avonds kijkt Bram tv.", answers: ["{På kvällen|På kvällarna|Om kvällarna} {tittar|ser} Bram på {tv|teve}."], feedback: [{ match: ["På kvällen tittar Bram tv", "På kvällarna tittar Bram tv", "Om kvällarna tittar Bram tv", "På kvällen tittar Bram teve", "På kvällarna tittar Bram teve", "Om kvällarna tittar Bram teve"], tip: "Kijken naar iets is „titta på”: tittar på tv." }, { match: ["Ikväll tittar Bram på tv", "Ikväll tittar Bram på teve", "I kväll tittar Bram på tv", "I kväll tittar Bram på teve", "Bram tittar på tv ikväll", "Bram tittar på teve ikväll", "Bram tittar på tv i kväll", "Bram tittar på teve i kväll"], tip: "„Ikväll” is vanavond (één keer). 's Avonds als gewoonte is „på kvällen”, „på kvällarna” of „om kvällarna”." }] }
          - { id: nh5p, type: translate, prompt: "Om zeven uur eet ik ontbijt.", answers: ["Klockan sju äter jag frukost."] }
          - { id: 3nge, type: translate, prompt: "Vandaag neemt Fleur de bus.", answers: ["{Idag|I dag} tar Fleur bussen.", "{Idag|I dag} åker Fleur [med ]bussen.", "{Idag|I dag} åker Fleur buss."], feedback: [{ match: ["Idag tar Fleur en buss", "I dag tar Fleur en buss"], tip: "De bus is bepaald: bussen." }] }
          - { id: zbhw, type: translate, prompt: "Elke zaterdag slapen we lang.", answers: ["{På lördagar|På lördagarna|Om lördagarna|Varje lördag} sover vi länge."], feedback: [{ match: ["På lördag sover vi länge", "På lördag sover vi lång"], tip: "Het gaat om een gewoonte (elke zaterdag): på lördagar. På lördag betekent aanstaande zaterdag." }, { match: ["På lördagar sover vi lång", "På lördagarna sover vi lång", "Om lördagarna sover vi lång", "Varje lördag sover vi lång"], tip: "Lang (in tijd) is „länge”; „lång” gebruik je voor lengte." }] }
          - { id: g93s, type: translate, prompt: "Morgen gaat Wilma naar school.", answers: ["{Imorgon|I morgon} går Wilma till skolan."], feedback: [{ contains: "imorgon Wilma", tip: "Na de tijdsbepaling komt eerst het werkwoord, dan pas Wilma." }] }
          - { id: eh6a, type: translate, prompt: "Om half acht drinkt Olle koffie.", answers: ["[Klockan ]halv åtta dricker Olle kaffe."], feedback: [{ contains: "åtta Olle", tip: "Na de tijdsbepaling komt eerst het werkwoord, dan pas Olle." }, { contains: "halv sju", tip: "halv + het volgende uur: half acht = halv åtta." }] }
          - { id: se8d, type: translate, prompt: "Na het werk kookt Bram.", answers: ["Efter {jobbet|arbetet} lagar Bram {mat|middag}."], feedback: [{ contains: "Bram lagar", tip: "Na de tijdsbepaling komt eerst het werkwoord, dan pas Bram." }] }

      - id: weekdagen
        title: De dagen van de week
        instruction: Koppel de Zweedse dag aan de Nederlandse.
        topic: dagar
        items:
          - id: mpxu
            type: match
            pairs:
              - ["måndag", "maandag"]
              - ["tisdag", "dinsdag"]
              - ["onsdag", "woensdag"]
              - ["torsdag", "donderdag"]
              - ["fredag", "vrijdag"]
              - ["lördag", "zaterdag"]
              - ["söndag", "zondag"]

      - id: dagdelen
        title: Wanneer?
        instruction: Kies de tijdsbepaling die het beste past.
        topic: dagar
        shuffle: true
        items:
          - { id: dpj2, type: gap, text: "Jag sover på ___.", gaps: [{ answers: ["natten"], options: ["morgonen", "eftermiddagen", "kvällen", "natten"] }] }
          - { id: 86jv, type: gap, text: "Bram äter frukost på ___.", gaps: [{ answers: ["morgonen"], options: ["morgonen", "eftermiddagen", "kvällen", "natten"] }] }
          - { id: gvws, type: gap, text: "På ___, efter middagen, tittar vi på tv.", gaps: [{ answers: ["kvällen"], options: ["morgonen", "eftermiddagen", "kvällen", "natten"] }] }
          - { id: 7ndz, type: gap, text: "Nils kommer hem från skolan klockan tre på ___.", gaps: [{ answers: ["eftermiddagen"], options: ["morgonen", "eftermiddagen", "kvällen", "natten"] }] }
          - id: 3wpy
            type: mc
            prompt: "Nils speelt **elke dinsdag** voetbal. Hoe zeg je dat?"
            options: ["på tisdagar", "på tisdag", "i tisdags"]
            answer: 0
            shuffle: false
            tip: "Elke dinsdag = op dinsdagen: på + meervoud."
          - id: pyw3
            type: mc
            prompt: "Welke zin is goed geschreven?"
            options: ["På fredag ska vi bada.", "På Fredag ska vi bada.", "på Fredag ska vi bada."]
            answer: 0
            shuffle: false
            tip: "Dagen van de week krijgen in het Zweeds geen hoofdletter."
          - { id: bzp4, type: gap, text: "Klockan tre på ___ sover alla.", gaps: [{ answers: ["natten"], options: ["morgonen", "eftermiddagen", "kvällen", "natten"] }] }
          - { id: wc8w, type: gap, text: "Bram läser tidningen på ___, innan han går till jobbet.", gaps: [{ answers: ["morgonen"], options: ["morgonen", "eftermiddagen", "kvällen", "natten"] }] }
          - { id: 8pjz, type: mc, prompt: "Ik werk **vanavond** (alleen deze keer). Hoe zeg je dat?", options: ["ikväll", "på kvällarna", "i går kväll"], answer: 0, tip: "Vanavond (één keer) = ikväll; på kvällarna = 's avonds (gewoonte)." }

      - id: meervoud-tabel-1
        title: Meervoud (1)
        instruction: Vul het meervoud en het bepaalde meervoud in.
        topic: plural
        items:
          - id: 4wsa
            type: table
            columns: ["Enkelvoud", "Meervoud", "Bepaald meervoud"]
            rows:
              - ["en flicka", { answers: ["flickor"], feedback: [{ match: "flickar", tip: "Een en-woord op -a: de -a wordt -or." }] }, { answers: ["flickorna"] }]
              - ["en bil", { answers: ["bilar"] }, { answers: ["bilarna"] }]
              - ["en film", { answers: ["filmer"], feedback: [{ match: "filmar", tip: "film is een leenwoord: meervoud op -er." }] }, { answers: ["filmerna"] }]
              - ["ett äpple", { answers: ["äpplen"] }, { answers: ["äpplena"], feedback: [{ match: "äpplenna", tip: "Na -n komt alleen -a: äpplena." }] }]
              - ["ett hus", { answers: ["hus"], feedback: [{ match: ["husar", "huser", "husen"], tip: "Een ett-woord op een medeklinker krijgt in het meervoud geen uitgang." }] }, { answers: ["husen"], feedback: [{ match: "husena", tip: "Bij woorden zonder meervoudsuitgang komt er -en achter: husen." }] }]

      - id: meervoud-tabel-2
        title: Meervoud (2)
        instruction: Vul het meervoud en het bepaalde meervoud in.
        topic: plural
        items:
          - id: nxht
            type: table
            columns: ["Enkelvoud", "Meervoud", "Bepaald meervoud"]
            rows:
              - ["en lärare", { answers: ["lärare"], feedback: [{ match: ["lärarer", "lärarar", "lärares"], tip: "Woorden op -are krijgen in het meervoud geen uitgang." }] }, { answers: ["lärarna"], feedback: [{ match: ["lärarena", "läraren", "lärarerna"], tip: "Bepaald meervoud van woorden op -are: -arna (lärarna)." }] }]
              - ["en tidning", { answers: ["tidningar"], feedback: [{ match: "tidninger", tip: "Woorden op -ing krijgen -ar." }] }, { answers: ["tidningarna"] }]
              - ["en pojke", { answers: ["pojkar"], feedback: [{ match: ["pojkear", "pojker"], tip: "Bij en-woorden op -e valt de -e weg en komt er -ar achter." }] }, { answers: ["pojkarna"] }]
              - ["ett barn", { answers: ["barn"], feedback: [{ match: ["barnar", "barner", "barnen"], tip: "Een ett-woord op een medeklinker krijgt in het meervoud geen uitgang." }] }, { answers: ["barnen"] }]
              - ["en student", { answers: ["studenter"], feedback: [{ match: "studentar", tip: "student heeft de klemtoon achteraan: meervoud op -er." }] }, { answers: ["studenterna"] }]

      - id: meervoud-kiezen
        title: Kies het meervoud en gebruik het
        instruction: Kies eerst het juiste meervoud. Vul daarna het bepaalde meervoud in de zin in.
        topic: plural
        items:
          - id: v8fy
            type: steps
            steps:
              - { type: mc, prompt: "en lampa → twee …", options: ["lampor", "lampar", "lampa"], answer: 0, tip: "Een en-woord op -a: -or." }
              - { type: gap, text: "Var är ___? (de lampen)", gaps: [{ answers: ["lamporna"] }] }
          - id: fvmh
            type: steps
            steps:
              - { type: mc, prompt: "en stol → twee …", options: ["stolar", "stoler", "stolor"], answer: 0, tip: "stol krijgt -ar, net als bil en dag." }
              - { type: gap, text: "___ står i köket. (de stoelen)", gaps: [{ answers: ["Stolarna"] }] }
          - id: d6hn
            type: steps
            steps:
              - { type: mc, prompt: "en banan → twee …", options: ["bananer", "bananar", "bananor"], answer: 0, tip: "banan heeft de klemtoon achteraan: -er." }
              - { type: gap, text: "Nils äter ___. (de bananen)", gaps: [{ answers: ["bananerna"] }] }
          - id: e9mk
            type: steps
            steps:
              - { type: mc, prompt: "ett bord → twee …", options: ["bord", "bordar", "borden"], answer: 0, tip: "Een ett-woord op een medeklinker: geen uitgang. „borden” is de bepaalde vorm." }
              - { type: gap, text: "___ är nya. (de tafels)", gaps: [{ answers: ["Borden"] }] }
          - id: mm67
            type: steps
            steps:
              - { type: mc, prompt: "ett äpple → twee …", options: ["äpplen", "äpplar", "äpple"], answer: 0, tip: "Een ett-woord op een klinker: -n." }
              - { type: gap, text: "Var ligger ___? (de appels)", gaps: [{ answers: ["äpplena"] }] }
          - id: 5ukf
            type: steps
            steps:
              - { type: mc, prompt: "en bok → twee …", options: ["böcker", "bokar", "boker"], answer: 0, tip: "bok is een uitzondering met klinkerwisseling: böcker." }
              - { type: gap, text: "Wilma läser ___. (de boeken)", gaps: [{ answers: ["böckerna"] }] }
          - id: 37e3
            type: steps
            steps:
              - { type: mc, prompt: "en flicka → twee …", options: ["flickor", "flickar", "flicka"], answer: 0, tip: "Een en-woord op -a: -or." }
              - { type: gap, text: "___ spelar fotboll. (de meisjes)", gaps: [{ answers: ["Flickorna"] }] }
          - id: am7h
            type: steps
            steps:
              - { type: mc, prompt: "ett hus → twee …", options: ["hus", "husar", "huser"], answer: 0, tip: "Een ett-woord op een medeklinker: geen uitgang." }
              - { type: gap, text: "___ är gamla. (de huizen)", gaps: [{ answers: ["Husen"] }] }

      - id: meervoud-in-zin
        title: Meervoud in een zin
        instruction: Vul het meervoud in van het woord tussen haakjes.
        topic: plural
        items:
          - { id: 8ah6, type: gap, text: "Ingrid och Olle har två ___ (barn).", gaps: [{ answers: ["barn"] }] }
          - { id: mq5z, type: gap, text: "Olle köper tre ___ (tidning).", gaps: [{ answers: ["tidningar"] }] }
          - { id: 3gre, type: gap, text: "Det finns många ___ (bil) på gatan.", gaps: [{ answers: ["bilar"] }] }
          - { id: u7n8, type: gap, text: "Det finns två ___ (katt) i trädgården.", gaps: [{ answers: ["katter"], feedback: [{ match: "kattar", tip: "katt is een uitzondering: katter." }] }] }
          - { id: dtkt, type: gap, text: "En vecka har sju ___ (dag).", gaps: [{ answers: ["dagar"] }] }
          - { id: wgak, type: gap, text: "Wilma har fem ___ (lektion) idag.", gaps: [{ answers: ["lektioner"], feedback: [{ match: "lektionar", tip: "Woorden op -tion krijgen -er: lektioner." }] }] }
          - { id: 2qu9, type: gap, text: "Vi har fyra ___ (stol) i köket.", gaps: [{ answers: ["stolar"] }] }
          - { id: p7ct, type: gap, text: "Bram dricker två ___ (kopp) kaffe.", gaps: [{ answers: ["koppar"] }] }

      - id: imperativ-invullen
        title: Gebiedende wijs
        instruction: "Vul de gebiedende wijs (imperativ) in van het werkwoord tussen haakjes. Let op: soms is de gebiedende wijs gelijk aan het werkwoord tussen haakjes (*Vänta!*), soms valt er iets weg (*Läs!*)."
        topic: imperativ
        items:
          - { id: 6ccu, type: gap, text: "___ (vänta)! Jag kommer.", gaps: [{ answers: ["Vänta"], feedback: [{ match: "Väntar", tip: "Dat is de presens. De imperativ van een -ar-werkwoord is gelijk aan de infinitief." }] }] }
          - { id: hc88, type: gap, text: "___ (läsa) texten!", gaps: [{ answers: ["Läs"], feedback: [{ match: "Läsa", tip: "läsa heeft de presens läser: haal de -a van de infinitief weg." }, { match: "Läser", tip: "Dat is de presens. Haal de -a van de infinitief weg: Läs!" }] }] }
          - { id: bdc3, type: gap, text: "___ (stänga) dörren!", gaps: [{ answers: ["Stäng"], feedback: [{ match: ["Stänga", "Stänger"], tip: "stänga – stänger: haal de -a van de infinitief weg." }] }] }
