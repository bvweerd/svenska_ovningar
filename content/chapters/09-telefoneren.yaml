chapter: 9
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik ken de stamtijden van werkwoorden en kan ze gebruiken", topics: [tempus] }
  - { text: "Ik kan doorgeven wat iemand anders zei", topics: [indirekt-tal] }
  - { text: "Ik ken de woorden en vaste zinnen rond telefoneren en internet", topics: [telefon, woordenschat] }

grammar:
  - id: tempus
    title: Alle tijden op een rij
    summary: "Van elk werkwoord leer je vier vormen: **infinitief – presens – preteritum – supinum**. Nieuw: de **pluskvamperfekt** = **hade + supinum** (had gedaan)."
    body: |
      | Infinitief | Presens | Preteritum | Supinum |
      |---|---|---|---|
      | svara | svarar | svarade | svarat |
      | ringa | ringer | ringde | ringt |
      | skicka | skickar | skickade | skickat |
      | förstå | förstår | förstod | förstått |
      | skriva | skriver | skrev | skrivit |
      | veta | vet | visste | vetat |

      ### De tijden
      | Tijd | Vorm | Voorbeeld |
      |---|---|---|
      | presens | ringer | Jag **ringer** dig. |
      | preteritum | ringde | Jag **ringde** igår. |
      | perfekt | har + supinum | Jag **har ringt** tre gånger. |
      | pluskvamperfekt | hade + supinum | Jag **hade** redan **ringt**. |
      | toekomst | ska + infinitief | Jag **ska ringa** imorgon. |

      ### Pluskvamperfekt
      Hiermee vertel je wat er **al eerder** gebeurd was, vóór een ander moment in het verleden:

      - När Fleur kom hem **hade** Bram redan **lagat** middag.
      - Tåget **hade** redan **gått** när vi kom till stationen.

  - id: indirekt-tal
    title: Indirecte rede – Han säger att …
    summary: "**säger att** + bewering, **frågar om** + ja/nee-vraag, **frågar var/när/vad** + vraagwoordvraag. Daarna: **onderwerp vóór het werkwoord**. Is *vem/vad* zelf het onderwerp, dan komt er **som** bij: *Hon frågar vem som ringde*."
    body: |
      Vertel je na wat iemand zegt of vraagt, dan maak je er een **bijzin** van:

      | Direct | Indirect |
      |---|---|
      | Olle: "Jag är sjuk." | Olle säger **att han är** sjuk. |
      | Fleur: "Kommer du?" | Fleur frågar **om jag kommer**. |
      | Bram: "När börjar filmen?" | Bram frågar **när filmen börjar**. |
      | Nils: "Var är mobilen?" | Nils undrar **var mobilen är**. |

      ### Twee dingen om op te letten
      1. Een ja/nee-vraag wordt een zin met **om** (of). Een vraag met een vraagwoord houdt dat vraagwoord.
      2. In de bijzin staat het **onderwerp vóór het werkwoord**, ook na een vraagwoord: *Bram frågar när **filmen börjar*** (niet *~~när börjar filmen~~*).

      3. Is het vraagwoord (*vem, vad, vilken*) zelf het **onderwerp**, dan zet je er **som** achter: *Vem ringde?* → *Hon frågar vem **som** ringde.* *Vad hände?* → *Jag vet inte vad **som** hände.* Is het vraagwoord niet het onderwerp, dan komt er géén *som*: *Hon frågar vem **du** ringde.*

      Ook na *Vet du …?*, *Jag vet inte …* en *Kan du säga …?* krijg je zo'n bijzin: *Vet du **när tåget går**?*

      Staat er *inte* in de bijzin, dan komt dat vóór het werkwoord: *Han säger att han **inte kommer***. Daar gaat hoofdstuk 10 verder op in.

  - id: telefon
    title: Aan de telefoon
    summary: "Opnemen met je naam (*Det är Fleur*). Iemand vragen: *Kan jag få prata med …?* Een bericht: *Kan jag lämna ett meddelande?*"
    body: |
      | Zweeds | Nederlands |
      |---|---|
      | Hallå? / Det är Fleur. | Hallo? / Met Fleur. |
      | Kan jag få prata med Ingrid? | Mag ik Ingrid spreken? |
      | Ett ögonblick. | Een ogenblik. |
      | Hon är inte här just nu. | Ze is er nu niet. |
      | Kan jag lämna ett meddelande? | Kan ik een bericht achterlaten? |
      | Kan du be henne ringa mig? | Kun je haar vragen mij te bellen? |
      | Jag ringer tillbaka senare. | Ik bel later terug. |
      | Du har ringt fel nummer. | Je hebt het verkeerde nummer gebeld. |
      | Jag skulle vilja boka en tid. | Ik wil graag een afspraak maken. |

      Een **tid** is hier een afspraak, bijvoorbeeld bij de dokter of de kapper.

sections:
  - id: oefeningen
    title: Oefeningen
    exercises:
      - id: stamtijden-1
        title: Stamtijden (1)
        instruction: Vul de ontbrekende vormen in.
        topic: tempus
        items:
          - id: yuwf
            type: table
            columns: ["Infinitief", "Presens", "Preteritum", "Supinum"]
            rows:
              - ["svara", { answers: ["svarar"] }, { answers: ["svarade"] }, { answers: ["svarat"] }]
              - ["skicka", { answers: ["skickar"] }, { answers: ["skickade"] }, { answers: ["skickat"] }]
              - ["höra", { answers: ["hör"] }, { answers: ["hörde"] }, { answers: ["hört"] }]
              - ["glömma", { answers: ["glömmer"] }, { answers: ["glömde"], feedback: [{ match: "glömmde", tip: "Dubbele m wordt enkel voor -de: glömde." }] }, { answers: ["glömt"], feedback: [{ match: "glömmt", tip: "Dubbele m wordt enkel voor -t: glömt." }] }]
              - ["lämna", { answers: ["lämnar"] }, { answers: ["lämnade"] }, { answers: ["lämnat"] }]

      - id: stamtijden-2
        title: Stamtijden (2) – sterk en onregelmatig
        instruction: Vul de ontbrekende vormen in.
        topic: tempus
        items:
          - id: jgr6
            type: table
            columns: ["Infinitief", "Presens", "Preteritum", "Supinum"]
            rows:
              - ["förstå", "förstår", { answers: ["förstod"], feedback: [{ match: "förstådde", tip: "förstå volgt stå: stod – förstod." }] }, { answers: ["förstått"] }]
              - ["sitta", "sitter", { answers: ["satt"] }, { answers: ["suttit"], feedback: [{ match: ["sittit", "sattit"], tip: "sitta – satt – suttit: de klinker wordt u." }] }]
              - ["ligga", "ligger", { answers: ["låg"] }, { answers: ["legat"], feedback: [{ match: ["liggit", "lågit"], tip: "ligga – låg – legat: onregelmatig." }] }]
              - ["veta", "vet", { answers: ["visste"], feedback: [{ match: ["vetade", "vete"], tip: "veta is onregelmatig: visste." }] }, { answers: ["vetat"] }]
              - ["ge", "ger", { answers: ["gav"] }, { answers: ["gett", "givit"] }]
              - ["bli", "blir", { answers: ["blev"] }, { answers: ["blivit"] }]

      - id: pluskvamperfekt
        title: Was al gebeurd
        instruction: Vul de supinum in. Samen met *hade* maak je de pluskvamperfekt.
        topic: tempus
        shuffle: true
        items:
          - { id: ux35, type: gap, text: "När Fleur kom hem hade Bram redan ___ (laga) middag.", gaps: [{ answers: ["lagat"] }] }
          - { id: uc2c, type: gap, text: "Jag hade aldrig ___ (se) en älg innan jag flyttade till Sverige.", gaps: [{ answers: ["sett"] }] }
          - { id: 3qzu, type: gap, text: "Tåget hade redan ___ (gå) när vi kom till stationen.", gaps: [{ answers: ["gått"] }] }
          - { id: g639, type: gap, text: "Wilma var trött, för hon hade ___ (sova) dåligt.", gaps: [{ answers: ["sovit"] }] }
          - { id: 4chk, type: gap, text: "Olle var arg, för någon hade ___ (ta) hans cykel.", gaps: [{ answers: ["tagit"] }] }
          - id: hjgv
            type: mc
            prompt: "Welke zin betekent: *Ik had het al gelezen.*"
            options: ["Jag hade redan läst den.", "Jag har redan läst den.", "Jag läste den redan."]
            answer: 0
            shuffle: false
            tip: "Had gelezen = hade + supinum."
          - { id: w9bf, type: gap, text: "Vi hade redan ___ (äta) när gästerna kom.", gaps: [{ answers: ["ätit"], feedback: [{ match: ["ätat", "ätt"], tip: "äta is sterk: åt – ätit." }] }] }
          - { id: hfg3, type: gap, text: "Bram hade ___ (glömma) nyckeln hemma.", gaps: [{ answers: ["glömt"], feedback: [{ match: ["glömmt", "glömmat"], tip: "glömma – glömde – glömt: met één m vóór de -t." }] }] }

      - id: att-of-om
        title: Att of om?
        instruction: Kies *att* of *om*.
        topic: indirekt-tal
        shuffle: true
        items:
          - { id: zye2, type: gap, text: "Hon frågar ___ du vill ha kaffe.", gaps: [{ answers: ["om"], options: ["att", "om"], shuffle: false, feedback: [{ match: "att", tip: "Een ja/nee-vraag wordt een bijzin met om." }] }] }
          - { id: d755, type: gap, text: "Han säger ___ han är trött.", gaps: [{ answers: ["att"], options: ["att", "om"], shuffle: false, feedback: [{ match: "om", tip: "Een bewering wordt een bijzin met att." }] }] }
          - { id: fye7, type: gap, text: "Jag undrar ___ det regnar i Stockholm.", gaps: [{ answers: ["om"], options: ["att", "om"], shuffle: false }] }
          - { id: kexa, type: gap, text: "Vi tror ___ det blir bra.", gaps: [{ answers: ["att"], options: ["att", "om"], shuffle: false }] }
          - { id: ebqf, type: gap, text: "Vet du ___ affären är öppen?", gaps: [{ answers: ["om"], options: ["att", "om"], shuffle: false }] }
          - { id: wqjn, type: gap, text: "Kan du kolla ___ tåget är försenat?", gaps: [{ answers: ["om"], options: ["att", "om"], shuffle: false }] }
          - { id: 2rp9, type: gap, text: "Mamma säger ___ maten är klar.", gaps: [{ answers: ["att"], options: ["att", "om"], shuffle: false }] }
          - { id: ptzm, type: gap, text: "Jag vet inte ___ hon är hemma.", gaps: [{ answers: ["om"], options: ["att", "om"], shuffle: false, feedback: [{ match: "att", tip: "Je weet het antwoord op een ja/nee-vraag niet: om (of)." }] }] }

      - id: indirect-maken
        title: Vertel het na
        instruction: "Maak er indirecte rede van. Jij vertelt na wat een ander zei: *jag* en *vi* van de spreker worden dus *han/hon* en *de*. Let ook op de woordvolgorde."
        topic: indirekt-tal
        items:
          - { id: kkqq, type: translate, prompt: "Olle säger: ”Jag är sjuk.”", answers: ["Olle säger att han är sjuk."], feedback: [{ match: "Olle säger att jag är sjuk", tip: "Olle praat over zichzelf: in de indirecte rede wordt dat han." }] }
          - { id: sr3a, type: translate, prompt: "Fleur frågar Bram: ”Kommer du ikväll?”", answers: ["Fleur frågar [Bram ]om {han|Bram} kommer {ikväll|i kväll}."], feedback: [{ contains: "om kommer", tip: "In de bijzin staat het onderwerp vóór het werkwoord: om han kommer." }, { contains: "att han kommer", tip: "Een ja/nee-vraag wordt een bijzin met om." }] }
          - { id: byx4, type: translate, prompt: "Nils undrar: ”Var är mobilen?”", answers: ["Nils undrar var mobilen är."], feedback: [{ match: "Nils undrar var är mobilen", tip: "In de bijzin: eerst het onderwerp (mobilen), dan het werkwoord (är)." }] }
          - { id: qfqv, type: translate, prompt: "Ingrid säger: ”Vi ska åka till Göteborg.”", answers: ["Ingrid säger att de ska åka till Göteborg."], feedback: [{ match: "Ingrid säger att vi ska åka till Göteborg", tip: "Ingrid bedoelt zichzelf en haar gezin: in de indirecte rede wordt vi dan de." }] }
          - { id: dce5, type: translate, prompt: "Ingrid frågar: ”Vem ringde?”", answers: ["Ingrid frågar vem som ringde."], feedback: [{ match: "Ingrid frågar vem ringde", tip: "vem is hier het onderwerp: in de bijzin komt er som bij (vem som ringde)." }] }
          - { id: rcc6, type: translate, prompt: "Bram frågar: ”När börjar filmen?”", answers: ["Bram frågar när filmen börjar."], feedback: [{ match: "Bram frågar när börjar filmen", tip: "In de bijzin: eerst het onderwerp (filmen), dan het werkwoord (börjar)." }] }
          - { id: vhmm, type: translate, prompt: "Wilma säger: ”Jag har ont i magen.”", answers: ["Wilma säger att hon har ont i magen."], feedback: [{ match: "Wilma säger att jag har ont i magen", tip: "Wilma praat over zichzelf: in de indirecte rede wordt dat hon." }] }
          - { id: 3zq7, type: translate, prompt: "Olle frågar oss: ”Har ni tid imorgon?”", answers: ["Olle frågar [oss ]om vi har tid {imorgon|i morgon}."], feedback: [{ contains: "om har", tip: "In de bijzin staat het onderwerp vóór het werkwoord: om vi har." }, { contains: "om ni har", tip: "Olle vraagt het aan ons: ni wordt vi." }] }

      - id: indirect-zinsbouw
        title: Vraag het beleefd
        instruction: Maak de zin af. In de bijzin komt het onderwerp vóór het werkwoord.
        topic: indirekt-tal
        items:
          - { id: xp56, type: order, start: "Kan du säga", tokens: ["var", "ligger", "stationen"], answers: ["Kan du säga var stationen ligger?"] }
          - { id: hupg, type: order, start: "Jag vet inte", tokens: ["om", "kommer", "han"], answers: ["Jag vet inte om han kommer."] }
          - { id: 6pz3, type: order, start: "Hon undrar", tokens: ["vad", "heter", "jag"], answers: ["Hon undrar vad jag heter."] }
          - { id: 7mmv, type: order, start: "Vet du", tokens: ["när", "går", "tåget"], answers: ["Vet du när tåget går?"] }
          - { id: hjfc, type: order, start: "Jag undrar", tokens: ["när", "börjar", "filmen"], answers: ["Jag undrar när filmen börjar."] }
          - { id: h3hs, type: order, start: "Vet du", tokens: ["vad", "kostar", "biljetten"], answers: ["Vet du vad biljetten kostar?"] }
          - { id: fbc5, type: order, start: "Hon frågar", tokens: ["om", "vill", "jag", "komma"], answers: ["Hon frågar om jag vill komma."] }
          - { id: 9djc, type: order, start: "Jag vet inte", tokens: ["var", "bor", "Olle"], answers: ["Jag vet inte var Olle bor."] }

      - id: telefoon-koppelen
        title: Aan de telefoon
        instruction: Koppel de Zweedse zin aan de betekenis.
        topic: telefon
        items:
          - id: 36jn
            type: match
            pairs:
              - ["Det är Bram.", "Met Bram."]
              - ["Kan jag få prata med Ingrid?", "Mag ik Ingrid spreken?"]
              - ["Ett ögonblick.", "Een ogenblik."]
              - ["Hon är inte här just nu.", "Ze is er nu niet."]
              - ["Kan jag lämna ett meddelande?", "Kan ik een bericht achterlaten?"]
              - ["Jag ringer tillbaka senare.", "Ik bel later terug."]
              - ["Du har ringt fel nummer.", "Je hebt het verkeerde nummer gebeld."]

      - id: zoek-de-fout
        title: Zoek de fout
        instruction: In elke zin staat één fout. Klik op het foute woord en verbeter daarna de zin.
        topic: indirekt-tal
        shuffle: true
        items:
          - { id: 47mc, type: findError, topic: indirekt-tal, sentence: "Bram frågar när börjar filmen.", wrong: [3, 4], answers: ["Bram frågar när filmen börjar."], tip: "Kijk naar de woordvolgorde in de bijzin." }
          - { id: c59j, type: findError, topic: indirekt-tal, sentence: "Hon frågar att du vill ha kaffe.", wrong: [2], answers: ["Hon frågar om du vill ha kaffe."], tip: "Is het een vraag of een bewering?" }
          - { id: egbq, type: findError, topic: tempus, sentence: "När vi kom hade tåget redan gick.", wrong: [6], answers: ["När vi kom hade tåget redan gått."], tip: "Na hade komt de supinum." }
          - { id: k4n4, type: findError, topic: indirekt-tal, sentence: "Kan du säga var ligger stationen?", wrong: [4, 5], answers: ["Kan du säga var stationen ligger?"], tip: "Kijk naar de woordvolgorde in de bijzin." }

      - id: lezen-gemist
        title: "Lezen: een gemiste oproep"
        instruction: Lees de tekst. Is de bewering **rätt** of **fel**? Is hij fout, schrijf dan de juiste zin op.
        topic: indirekt-tal
        textTitle: Ett missat samtal
        text: |
          I tisdags ringde Ingrid till Fleur, men Fleur svarade inte. Hon hade glömt mobilen hemma. Ingrid lämnade ett meddelande. Hon sa att hon hade två biljetter till en konsert på fredagen och frågade om Fleur ville följa med.

          När Fleur kom hem lyssnade hon på meddelandet och ringde tillbaka direkt. Hon sa att hon gärna ville följa med. Konserten var fantastisk!
        items:
          - { id: 3u8c, type: truefalse, statement: "Ingrid ringde i tisdags.", answer: true }
          - { id: sbmz, type: truefalse, statement: "Fleur svarade i telefon.", answer: false, tip: "Waarom niet?", correction: { answers: ["{Fleur|Hon} svarade inte[ i telefon].", "{Fleur|Hon} hade glömt mobilen hemma."] } }
          - { id: d3vq, type: truefalse, statement: "Ingrid lämnade ett meddelande.", answer: true }
          - { id: 4upp, type: truefalse, statement: "Ingrid hade tre biljetter.", answer: false, tip: "Hoeveel kaartjes had ze?", correction: { answers: ["{Ingrid|Hon} hade två biljetter."] } }
          - { id: 7qh7, type: truefalse, statement: "Konserten var på lördagen.", answer: false, tip: "Op welke dag was het concert?", correction: { answers: ["Konserten var {på fredagen|i fredags}."] } }
          - { id: peca, type: truefalse, statement: "Fleur ville inte följa med.", answer: false, tip: "Wat zei Fleur toen ze terugbelde?", correction: { answers: ["{Fleur|Hon} ville [gärna ]följa med."] } }

      - id: dialoog-afspraak
        title: Een afspraak maken
        instruction: Fleur belt de tandarts. Zet het gesprek in de goede volgorde.
        topic: telefon
        items:
          - id: c9p7
            type: dialogue
            lines:
              - "Receptionisten: Västerås tandvård, det är Maja."
              - "Fleur: Hej, det är Fleur van Dijk. Jag skulle vilja boka en tid."
              - "Receptionisten: Javisst. Passar det på torsdag klockan nio?"
              - "Fleur: Tyvärr inte, då jobbar jag. Har ni något på eftermiddagen?"
              - "Receptionisten: Ja, vi har en tid klockan fyra."
              - "Fleur: Perfekt, då tar jag den. Tack så mycket!"
              - "Receptionisten: Välkommen. Hej då!"

      - id: schrijven-bericht
        title: "Schrijven: een voicemail"
        instruction: Je belt een vriend(in), maar die neemt niet op. Spreek een bericht in.
        topic: telefon
        items:
          - id: jzpv
            type: free
            prompt: "Zeg wie je bent, waarom je belt (bijvoorbeeld een uitnodiging) en vraag of hij of zij terugbelt."
            minWords: 25
            require:
              - { any: ["det är", "jag heter"], label: "Je zegt wie je bent (Det är …)" }
              - { any: ["ringer", "ringa"], label: "Je vraagt om terug te bellen (ringa / ringer)" }
              - { any: ["vill du", "kan du", "skulle du"], label: "Je stelt een vraag (Vill du / Kan du …)" }
            model: "Hej Anna, det är Sanne. Jag ringer för att jag har två biljetter till teatern på lördag. Vill du följa med? Föreställningen börjar klockan sju. Kan du ringa mig ikväll eller imorgon? Mitt nummer är 070-123 45 67. Hej då!"

  - id: luisteren
    title: Luisteren
    intro: Deze oefeningen gebruiken de voorleesfunctie van je browser. Werkt dat niet goed, kijk dan bij „Luisteren instellen”.
    exercises:
      - id: luisteren-kiezen
        title: "Luisteren: wat hoor je?"
        instruction: Luister en kies het goede antwoord.
        topic: indirekt-tal
        shuffle: true
        items:
          - { id: 8z3g, type: listen, say: "Fleur frågar om Bram kommer i kväll.", prompt: "Wat vraagt Fleur?", options: ["of Bram vanavond komt", "wanneer Bram komt", "waarom Bram niet komt"], answer: 0 }
          - { id: kspu, type: listen, say: "Olle säger att han är sjuk.", prompt: "Wat zegt Olle?", options: ["dat hij ziek is", "dat hij moe is", "dat hij later komt"], answer: 0 }
          - { id: cyhp, type: listen, say: "Tåget hade redan gått.", prompt: "Welke vorm hoor je?", options: ["hade gått", "har gått", "gick"], answer: 0, topic: tempus }
          - { id: tgbh, type: listen, say: "Hej, det är Ingrid. Kan jag få prata med Olle?", prompt: "Wie belt er, en voor wie?", options: ["Ingrid, ze wil Olle spreken", "Olle, hij wil Ingrid spreken", "Ingrid, ze wil Bram spreken"], answer: 0, topic: telefon }
          - { id: 4af2, type: listen, say: "Han är inte här just nu. Vill du lämna ett meddelande?", prompt: "Wat wordt er gevraagd?", options: ["of je een bericht wilt achterlaten", "of je later terugbelt", "wat je telefoonnummer is"], answer: 0, topic: telefon }

      - id: luisteren-dictee
        title: "Dictee"
        instruction: Luister en schrijf de zin op.
        topic: indirekt-tal
        shuffle: true
        items:
          - { id: vgxc, type: listen, say: "Hon undrar var mobilen är." }
          - { id: x2gb, type: listen, say: "Vet du när filmen börjar?" }
          - { id: vfcg, type: listen, say: "Jag ringer tillbaka senare." }
          - { id: t5q5, type: listen, say: "Han hade glömt nyckeln." }
          - { id: 2e2f, type: listen, say: "Kan du säga var stationen ligger?" }

  - id: herhaling
    title: Herhaling
    intro: Gemengde oefeningen met stof uit hoofdstuk 1 tot en met 9.
    exercises:
      - id: herhaling-gemengd
        title: Gemengde herhaling
        instruction: Beantwoord de vragen. Ze gaan over hoofdstuk 1 tot en met 9 door elkaar.
        shuffle: true
        items:
          - { id: 62xp, type: gap, topic: indirekt-tal, text: "Kan du säga hur mycket klockan ___?", gaps: [{ answers: ["är"] }] }
          - { id: qnep, type: gap, topic: perfekt-preteritum, text: "Jag ___ (ringa) dig tre gånger igår!", gaps: [{ answers: ["ringde"], feedback: [{ match: "har ringt", tip: "igår is een bepaald moment: preteritum." }] }] }
          - { id: 2fva, type: gap, topic: tempus, text: "Bram hade redan ___ (äta) när Fleur kom hem.", gaps: [{ answers: ["ätit"] }] }
          - { id: 2ac8, type: gap, topic: det-finns, text: "Det finns ___ meddelanden i röstbrevlådan. (geen)", gaps: [{ answers: ["inga"], options: ["ingen", "inget", "inga"], shuffle: false }] }
          - { id: ucj7, type: translate, topic: tycka-tro-tanka, prompt: "Ik denk dat ze niet thuis is.", answers: ["Jag tror {inte att hon är hemma|att hon inte är hemma|inte hon är hemma|hon inte är hemma}."], feedback: [{ contains: "tycker att", tip: "Een vermoeden: tror." }, { contains: "hon är inte hemma", tip: "In een bijzin staat inte vóór het werkwoord: att hon inte är hemma." }] }
          - { id: fe8p, type: gap, topic: possessiv, text: "Har du sett ___ mobil? (mijn)", gaps: [{ answers: ["min"], options: ["min", "mitt", "mina"] }] }
