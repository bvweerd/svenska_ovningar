          - { id: m2u4, type: truefalse, statement: "Chefen frågade om Bram kunde komma till ett möte.", answer: true }
          - { id: fez2, type: truefalse, statement: "Bram kunde inte komma.", answer: false }

      - id: makkelijk-2
        title: "Makkelijk lezen: Lösenordet"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Lösenordet"
        text: |
          Wilma har glömt lösenordet till datorn. Hon ringer kundtjänst. En kvinna svarar. Wilma säger att hon inte vet lösenordet. Kvinnan frågar vad Wilma heter och skickar ett nytt lösenord i ett sms. Wilma tackar och lägger på.
        items:
          - { id: kbay, type: truefalse, statement: "Wilma har glömt lösenordet.", answer: true }
          - { id: b6w5, type: truefalse, statement: "Kvinnan skickar ett mejl.", answer: false }

      - id: dialoog-afspraak
        title: Een afspraak maken
        instruction: Fleur belt de tandarts. Zet het gesprek in de goede volgorde.
        topic: telefon
        items:
          - id: c9p7
            type: dialogue
            lines:
              - "Receptionisten: Västerås tandvård, det är Maja."
              - "Fleur: Hej, det är Fleur van Dijk. Jag skulle vilja boka en tid."
              - "Receptionisten: Javisst. Passar det på torsdag klockan nio?"
              - "Fleur: Tyvärr inte, då jobbar jag. Har ni något på eftermiddagen?"
              - "Receptionisten: Ja, vi har en tid klockan fyra."
              - "Fleur: Perfekt, då tar jag den. Tack så mycket!"
              - "Receptionisten: Välkommen. Hej då!"

      - id: schrijven-bericht
        title: "Schrijven: een voicemail"
        instruction: "Je belt je vriendin Anna en krijgt haar voicemail. Schrijf op wat je inspreekt. Bouw de tekst eerst op in vier stappen die de app nakijkt. Daarna schrijf je, als je wilt, het hele bericht op."
        topic: telefon
        items:
          - { id: d2j2, type: mc, prompt: "Je belt je vriendin Anna. Hoe begin je het bericht?", options: ["Hej Anna, det är Sanne.", "Hej Anna, jag är Sanne.", "God dag, mitt namn är Sanne."], answer: 0, tip: "Aan de telefoon zeg je wie je bent met Det är … God dag … is te formeel voor een vriendin." }
          - { id: yumb, type: gap, prompt: "Kies het woord dat past.", text: "Jag ringer ___ jag har två biljetter till teatern.", gaps: [{ answers: ["för att"], options: ["för att", "så att", "men"], tip: "Je geeft de reden: för att (omdat)." }] }
          - { id: z48w, type: translate, prompt: "Kun je me vanavond terugbellen?", answers: ["Kan du ringa {tillbaka|mig tillbaka|tillbaka till mig|upp mig|mig} {ikväll|i kväll}?"], feedback: [{ contains: "du kan ringa", tip: "In een ja/nee-vraag staat het werkwoord vooraan: Kan du …?" }] }
          - { id: xjjn, type: gap, topic: indirekt-tal, prompt: "Anna zegt: „Jag kan inte komma.” Vertel het verder.", text: "Anna säger att hon ___ komma.", gaps: [{ answers: ["inte kan"], options: ["inte kan", "kan inte"], shuffle: false, tip: "In een bijzin met att staat inte vóór het werkwoord: att hon inte kan." }] }
          - id: jzpv
            type: free
            prompt: "Schrijf op wat je op de voicemail inspreekt: zeg wie je bent, waarom je belt (bijvoorbeeld een uitnodiging) en vraag of ze terugbelt."
            minWords: 25
            require:
              - { any: ["det är", "jag heter"], label: "Je zegt wie je bent (Det är …)" }
              - { any: ["ringer", "ringa"], label: "Je vraagt om terug te bellen (ringa / ringer)" }
              - { any: ["vill du", "kan du", "skulle du"], label: "Je stelt een vraag (Vill du / Kan du …)" }
            model: "Hej Anna, det är Sanne. Jag ringer för att jag har två biljetter till teatern på lördag. Vill du följa med? Det börjar klockan sju. Kan du ringa mig ikväll eller imorgon? Mitt nummer är 070-123 45 67. Hej då!"

