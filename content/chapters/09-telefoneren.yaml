      - id: lezen-gemist
        title: "Lezen: een gemiste oproep"
        instruction: Lees de tekst. Is de bewering **rätt** of **fel**? Is hij fout, schrijf dan de juiste zin op.
        topic: indirekt-tal
        textTitle: Ett missat samtal
        text: |
          I tisdags ringde Ingrid till Fleur, men Fleur svarade inte. Hon hade glömt mobilen hemma. Ingrid lämnade ett meddelande. Hon sa att hon hade två biljetter till en konsert på fredagen och frågade om Fleur ville följa med.

          När Fleur kom hem lyssnade hon på meddelandet och ringde tillbaka direkt. Hon sa att hon gärna ville följa med. Ingrid frågade om de kunde träffas utanför konserthuset klockan sju.

          På fredagen tog Fleur bussen till centrum, men bussen var försenad. Hon skickade ett sms till Ingrid och skrev att hon var på väg. När Fleur kom fram hade konserten redan börjat. Ingrid väntade utanför, och de gick in tillsammans.

          Konserten var fantastisk! Efteråt drack de en kopp kaffe på ett café och pratade om musiken. Fleur var hemma klockan elva.
        items:
          - { id: 3u8c, type: truefalse, statement: "Ingrid ringde i tisdags.", answer: true }
          - { id: sbmz, type: truefalse, statement: "Fleur svarade i telefon.", answer: false, tip: "Waarom niet?", correction: { answers: ["{Fleur|Hon} svarade inte[ i telefon].", "{Fleur|Hon} hade glömt mobilen hemma."] } }
          - { id: d3vq, type: truefalse, statement: "Ingrid lämnade ett meddelande.", answer: true }
          - { id: 4upp, type: truefalse, statement: "Ingrid hade tre biljetter.", answer: false, tip: "Hoeveel kaartjes had ze?", correction: { answers: ["{Ingrid|Hon} hade två biljetter."] } }
          - { id: 7qh7, type: truefalse, statement: "Konserten var på lördagen.", answer: false, tip: "Op welke dag was het concert?", correction: { answers: ["Konserten var {på fredagen|i fredags}."] } }
          - { id: peca, type: truefalse, statement: "Fleur ville inte följa med.", answer: false, tip: "Wat zei Fleur toen ze terugbelde?", correction: { answers: ["{Fleur|Hon} ville [gärna ]följa med."] } }
          - { id: yyg8, type: truefalse, statement: "Fleur tog bilen till centrum.", answer: false, tip: "Hoe ging Fleur naar het centrum?", correction: { answers: ["{Fleur|Hon} tog bussen[ till centrum].", "På fredagen tog {Fleur|hon} bussen[ till centrum]."] } }
          - { id: 5kjn, type: truefalse, statement: "När Fleur kom fram hade konserten redan börjat.", answer: true }
          - { id: hdex, type: truefalse, statement: "Efter konserten drack de kaffe.", answer: true }
          - { id: pf5c, type: truefalse, statement: "Fleur var hemma klockan tio.", answer: false, tip: "Lees de laatste zin.", correction: { answers: ["{Fleur|Hon} var hemma [klockan ]elva.", "Klockan elva var {Fleur|hon} hemma."] } }

      - id: makkelijk-1
        title: "Makkelijk lezen: Tre missade samtal"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Tre missade samtal"
        text: |
          Bram hade glömt mobilen hemma. När han kom hem hade han tre missade samtal. Det var hans chef. Hon frågade om han kunde komma till ett möte imorgon. Bram ringde tillbaka och sa att han kunde komma.
        items:
