      - id: lezen-appartement
        title: "Lezen: een nieuw appartement"
        instruction: Lees de tekst. Is de bewering **rätt** of **fel**? Is hij fout, schrijf dan de juiste zin op.
        topic: subjunktioner
        textTitle: Ny lägenhet
        text: |
          Fleur och Bram har hittat en ny lägenhet. Den ligger på tredje våningen i ett gammalt hus nära centrum. Lägenheten har tre rum och kök. Vardagsrummet är stort och ljust eftersom det har två stora fönster. Sovrummet ligger bredvid badrummet, och där finns det både dusch och badkar.

          Bram tycker att köket är för litet, men Fleur säger att det inte gör något, eftersom de ändå ofta äter ute. De flyttar den första mars.

          Huset har ingen hiss, så Olle och Nils ska hjälpa dem att bära möblerna och alla kartonger. Innan de flyttar in vill Fleur måla väggarna i sovrummet, eftersom de är gamla och mörka.

          Hyran är 9 500 kronor i månaden. Det är lite dyrt, men lägenheten ligger bra. Det finns en tvättstuga i källaren och en liten trädgård bakom huset. Bram är glad, eftersom han bara behöver cykla tio minuter till jobbet.
        items:
          - { id: m7dn, type: truefalse, statement: "Lägenheten ligger på andra våningen.", answer: false, tip: "Op welke verdieping?", correction: { answers: ["{Lägenheten|Den} ligger på tredje våningen."] } }
