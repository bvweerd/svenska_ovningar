          - { id: cusy, type: truefalse, statement: "De flyttar i april.", answer: false, tip: "Wanneer verhuizen ze?", correction: { answers: ["De flyttar den {första|1} mars.", "De flyttar i mars."] } }
          - { id: 7krg, type: truefalse, statement: "Huset har en hiss.", answer: false, tip: "Lees het begin van de derde alinea.", correction: { answers: ["Huset har ingen hiss.", "Det finns ingen hiss[ i huset]."] } }
