      - id: klok-meerkeuze
        title: Welke tijd hoort erbij?
        instruction: Kies de juiste tijd.
        topic: klockan
        shuffle: true
        items:
          - { type: mc, prompt: "**halv fyra**", options: ["3.30", "4.30", "4.15"], answer: 0, shuffle: false, tip: "halv + het volgende uur: halv fyra = half vier." }
          - { type: mc, prompt: "**kvart i sex**", options: ["6.15", "5.45", "6.45"], answer: 1, shuffle: false, tip: "i = voor: een kwartier vóór zes." }
