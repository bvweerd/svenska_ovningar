chapter: 1
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan mezelf voorstellen en vertellen waar ik vandaan kom en welke talen ik spreek", topics: [presens, pronomen] }
  - { text: "Ik kan eenvoudige vragen stellen en een zin ontkennen", topics: [vragen, v2, inte] }
  - { text: "Ik weet of een woord en of ett is en kan de bepaalde vorm maken", topics: [substantiv] }
  - { text: "Ik kan getallen gebruiken en zeggen hoe laat het is", topics: [raknord, klockan] }

# Personages in dit hoofdstuk (zelf bedacht):
#   Fleur (31) en Bram (34), een Nederlands stel dat net in Västerås woont.
#   De buren: Ingrid en Olle Ek, met hun kinderen Wilma (15) en Nils (10).

grammar:
  - id: presens
    title: Werkwoorden in de tegenwoordige tijd (presens)
    summary: "Het werkwoord heeft in presens voor **alle personen dezelfde vorm**: *jag/du/hon/vi/de* **talar**."
    body: |
      Het Zweedse werkwoord verandert niet per persoon. *Jag talar, du talar, hon talar, vi talar, de talar.* Je hoeft per werkwoord dus maar één vorm te leren.

      Hoe je de presens maakt, hangt af van het werkwoord. Er zijn vier patronen:

      | Infinitief | Presens | Zo maak je hem |
      |---|---|---|
      | jobba, tala, stanna | jobbar, talar, stannar | **-r** achter de infinitief |
      | köpa, läsa, heta | köper, läser, heter | de **-a** wordt **-er** |
      | bo, tro, gå | bor, tror, går | korte werkwoorden: **-r** erachter |
      | vara, ha, göra | är, har, gör | onregelmatig: uit je hoofd leren |

      Of een werkwoord op *-a* een **-ar**- of een **-er**-vorm krijgt, zie je niet aan de infinitief. Leer daarom bij elk nieuw werkwoord meteen de presensvorm mee: *stanna – stannar*, *köpa – köper*.

  - id: v2
    title: Woordvolgorde – het werkwoord op plaats 2
    summary: "In een gewone zin staat het werkwoord **altijd op plaats 2**. Begin je met iets anders dan het onderwerp, dan komt het onderwerp **direct na** het werkwoord."
    body: |
      Net als in het Nederlands staat in een Zweedse hoofdzin de persoonsvorm op de **tweede plaats**.

      | Plaats 1 | Plaats 2 (werkwoord) | Onderwerp | Rest |
      |---|---|---|---|
      | Fleur | jobbar | – | på ett sjukhus. |
      | Idag | jobbar | Fleur | hemma. |
      | I Västerås | bor | vi | nu. |
      | Svenska | talar | Bram | lite. |

      Plaats 1 hoeft dus niet het onderwerp te zijn. Staat er iets anders (een tijd, een plaats, een voorwerp), dan wisselen onderwerp en werkwoord van plek: **inversie**. Fout is: *~~Idag Fleur jobbar~~*.

  - id: vragen
    title: Vragen stellen
    summary: "Ja/nee-vraag: het **werkwoord vooraan** (*Talar du svenska?*). Met vraagwoord: **vraagwoord + werkwoord + onderwerp** (*Var bor du?*)."
    body: |
      ### Ja/nee-vragen
      Zet het werkwoord vooraan en het onderwerp er direct achter:

      - *Du talar svenska.* → **Talar du** svenska?
      - *Olle har en bil.* → **Har Olle** en bil?

      ### Vragen met een vraagwoord
      Het vraagwoord staat op plaats 1, het werkwoord op plaats 2:

      | Vraagwoord | Betekenis | Voorbeeld |
      |---|---|---|
      | vad | wat | Vad heter du? |
      | var | waar | Var bor ni? |
      | varifrån | waarvandaan | Varifrån kommer du? |
      | vem | wie | Vem är det? |
      | hur | hoe | Hur mår du? |
      | varför | waarom | Varför bor ni i Sverige? |
      | när | wanneer | När börjar kursen? |

      Let op: *var* (waar) en *vad* (wat) lijken op elkaar!

  - id: inte
    title: Ontkennen met inte
    summary: "*Inte* (niet) staat in een hoofdzin **direct na het werkwoord**; bij inversie **na het onderwerp**."
    body: |
      - Jag talar **inte** finska.
      - Hon bor **inte** i Stockholm.

      Bij inversie staat het onderwerp na het werkwoord. *Inte* schuift dan mee naar achteren:

      - Idag jobbar Fleur **inte**.
      - Nu bor vi **inte** i Nederländerna.

      Let op: is het lijdend voorwerp een kort voornaamwoord (*mig, dig, honom, henne, det* …), dan staat dat meestal **vóór** *inte*:

      - Jag ser honom **inte**. (Ik zie hem niet.)
      - Jag tror det **inte**. (Ik geloof het niet.)

      Op een ja/nee-vraag antwoord je met *ja* of *nej*: *Talar du finska? – Nej, jag talar inte finska.*

  - id: pronomen
    title: Persoonlijke voornaamwoorden
    summary: "*jag, du, han, hon, den, det, vi, ni, de*. Voor dingen gebruik je **den** (en-woord) of **det** (ett-woord)."
    body: |
      | Enkelvoud | | Meervoud | |
      |---|---|---|---|
      | jag | ik | vi | wij |
      | du | jij | ni | jullie |
      | han | hij | de | zij |
      | hon | zij (vrouw) | | |
      | den / det | hij, zij, het (ding of dier) | | |

      Voor een ding of dier gebruik je *den* bij een en-woord en *det* bij een ett-woord:

      - Vi har **en** hund. **Den** heter Sigge.
      - Vi har **ett** hus. **Det** ligger i Västerås.

      *Den* is bij dieren altijd goed. Gaat het om een eigen huisdier met een naam, dan zeggen Zweden ook vaak *han* of *hon*: *Vi har en katt. **Hon** heter Pluto.*

      Spreek je meer mensen aan, dan gebruik je **ni**: *Fleur och Bram, var bor ni?*

  - id: substantiv
    title: En of ett – en de bepaalde vorm
    summary: "Er zijn **en-woorden** en **ett-woorden**. Het bepaalde lidwoord komt **achter** het woord: *en bil → bilen*, *ett hus → huset*."
    body: |
      Elk zelfstandig naamwoord is een **en-woord** of een **ett-woord**. Ongeveer drie op de vier woorden zijn en-woorden. Leer het lidwoord altijd mee.

      In het Zweeds plak je *de/het* **achter** het woord:

      | Onbepaald | Bepaald | Regel |
      |---|---|---|
      | en bil | bil**en** | en-woord + **-en** |
      | en lampa | lampa**n** | eindigt op klinker: alleen **-n** |
      | ett hus | hus**et** | ett-woord + **-et** |
      | ett äpple | äpple**t** | eindigt op klinker: alleen **-t** |

  - id: klockan
    title: Hoe laat is het?
    summary: "*Klockan är …*: **över** = over, **i** = voor, **halv** + het **volgende** uur (zoals in het Nederlands)."
    body: |
      Je vraagt: *Vad är klockan?* of *Hur mycket är klockan?* Je antwoordt met *Klockan är …*

      | Tijd | Zweeds |
      |---|---|
      | 7.00 | sju / prick sju |
      | 7.05 | fem över sju |
      | 7.15 | kvart över sju |
      | 7.25 | fem i halv åtta |
      | 7.30 | halv åtta |
      | 7.35 | fem över halv åtta |
      | 7.40 | tjugo i åtta |
      | 7.45 | kvart i åtta |
      | 7.55 | fem i åtta |

      De uren: *ett, två, tre, fyra, fem, sex, sju, åtta, nio, tio, elva, tolv*. Let op: bij de klok zeg je *ett*, niet *en*.

  - id: raknord
    title: Getallen
    summary: "0–12 leer je uit je hoofd; 13–19 eindigen op **-ton**, tientallen op **-tio** (behalve *tjugo*)."
    body: |
      | 0–4 | 5–9 | 10–14 | 15–19 |
      |---|---|---|---|
      | 0 noll | 5 fem | 10 tio | 15 femton |
      | 1 ett (en) | 6 sex | 11 elva | 16 sexton |
      | 2 två | 7 sju | 12 tolv | 17 sjutton |
      | 3 tre | 8 åtta | 13 tretton | 18 arton |
      | 4 fyra | 9 nio | 14 fjorton | 19 nitton |

      Tientallen: 20 *tjugo*, 30 *trettio*, 40 *fyrtio*, 50 *femtio*, 60 *sextio*, 70 *sjuttio*, 80 *åttio*, 90 *nittio*, 100 *(ett) hundra*.

      Samengestelde getallen schrijf je aan elkaar, het tiental eerst: 21 *tjugoett*, 34 *trettiofyra*, 58 *femtioåtta*.

sections:
  - id: oefeningen
    title: Oefeningen
    exercises:
      - id: presens-invullen
        title: Werkwoorden in presens
        instruction: Vul de juiste vorm van het werkwoord in. De infinitief staat tussen haakjes.
        topic: presens
        items:
          - id: wdrb
            type: gap
            text: "Fleur ___ (jobba) på ett sjukhus."
            gaps: [{ answers: ["jobbar"] }]
          - id: 89ae
            type: gap
            text: "Bram ___ (läsa) en tidning."
            gaps: [{ answers: ["läser"], feedback: [{ match: "läsar", tip: "Bij läsa wordt de -a een -er: läser." }] }]
          - id: ash8
            type: gap
            text: "Vi ___ (bo) i Västerås."
            gaps: [{ answers: ["bor"], feedback: [{ match: "boar", tip: "bo is een kort werkwoord: er komt alleen -r achter." }] }]
          - id: 5m7x
            type: gap
            text: "Wilma ___ (tala) engelska och lite tyska."
            gaps: [{ answers: ["talar"] }]
          - id: nj49
            type: gap
            text: "Olle ___ (köpa) bröd varje morgon."
            gaps: [{ answers: ["köper"], feedback: [{ match: "köpar", tip: "Bij köpa wordt de -a een -er: köper." }] }]
          - id: beuv
            type: gap
            text: "Jag ___ (vara) från Nederländerna."
            gaps: [{ answers: ["är"], feedback: [{ match: ["varar", "var"], tip: "vara is onregelmatig. In presens: jag är, du är, hon är …" }] }]
          - id: 9mhm
            type: gap
            text: "De ___ (ha) en katt."
            gaps: [{ answers: ["har"] }]
          - id: e3aa
            type: gap
            text: "Nils ___ (gå) till skolan."
            gaps: [{ answers: ["går"] }]
          - id: npzu
            type: gap
            text: "Du ___ (heta) Ingrid, eller hur?"
            gaps: [{ answers: ["heter"], feedback: [{ match: "hetar", tip: "Bij heta wordt de -a een -er: heter." }] }]

      - id: vorm-en-gebruik
        title: Kies de vorm en gebruik hem
        instruction: Kies eerst de juiste presensvorm. Gebruik het werkwoord daarna in een eigen zin.
        topic: presens
        items:
          - id: bgpv
            type: steps
            steps:
              - { type: mc, prompt: "**stanna** (blijven): Vi ___ hemma idag.", options: ["stannar", "stanner", "stanna"], answer: 0, tip: "stanna krijgt -r erachter: stannar. De infinitief zelf (stanna) is nooit de presens." }
              - { type: translate, prompt: "Maak de zin ontkennend: Vi stannar hemma idag.", answers: ["Vi stannar inte hemma {idag|i dag}."], topic: inte }
          - id: vfcd
            type: steps
            steps:
              - { type: mc, prompt: "**bygga** (bouwen): Grannarna ___ ett nytt hus.", options: ["bygger", "byggar", "bygga"], answer: 0, tip: "Bij bygga wordt de -a een -er: bygger." }
              - { type: translate, prompt: "Maak er een ja/nee-vraag van: Grannarna bygger ett nytt hus.", answers: ["Bygger grannarna ett nytt hus?"], topic: vragen }
          - id: k7ff
            type: steps
            steps:
              - { type: mc, prompt: "**tro** (geloven, denken): Jag ___ det.", options: ["tror", "troar", "troer"], answer: 0, tip: "tro is een kort werkwoord: alleen -r erachter." }
              - { type: translate, prompt: "Vertaal: Ik geloof het niet.", answers: ["Jag tror inte det.", "Jag tror det inte.", "Det tror jag inte."], topic: inte }
          - id: 5shr
            type: steps
            steps:
              - { type: mc, prompt: "**göra** (doen): Vad ___ du?", options: ["gör", "görar", "göra"], answer: 0, tip: "göra is onregelmatig: de presens is gör." }
              - { type: translate, prompt: "Vertaal: Wat doen jullie vandaag?", answers: ["Vad gör ni {idag|i dag}?"], topic: vragen }
          - id: k7zr
            type: steps
            steps:
              - { type: mc, prompt: "**flytta** (verhuizen): Vi ___ till Sverige i maj.", options: ["flyttar", "flytter", "flytta"], answer: 0, tip: "flytta krijgt -r erachter: flyttar." }
              - { type: translate, prompt: "Begin de zin met *I maj*: Vi flyttar till Sverige i maj.", answers: ["I maj flyttar vi till Sverige."], topic: v2 }
          - id: bcrt
            type: steps
            steps:
              - { type: mc, prompt: "**läsa** (lezen): Fleur ___ en bok.", options: ["läser", "läsar", "läsa"], answer: 0, tip: "Bij läsa wordt de -a een -er: läser." }
              - { type: translate, prompt: "Maak de zin ontkennend: Fleur läser en bok.", answers: ["Fleur läser {inte någon|ingen} bok."], feedback: [{ match: "Fleur läser inte en bok", tip: "Geen + en-woord: ingen (of inte någon). „Inte en” klinkt onnatuurlijk." }], topic: inte }
          - id: kvzv
            type: steps
            steps:
              - { type: mc, prompt: "**bo** (wonen): Var ___ ni?", options: ["bor", "boar", "boer"], answer: 0, tip: "bo is een kort werkwoord: alleen -r erachter." }
              - { type: translate, prompt: "Vertaal: Waar wonen jullie nu?", answers: ["Var bor ni nu?"], topic: vragen }
          - id: gycq
            type: steps
            steps:
              - { type: mc, prompt: "**titta** (kijken): Bram ___ på tv.", options: ["tittar", "titter", "titta"], answer: 0, tip: "titta krijgt -r erachter: tittar." }
              - { type: translate, prompt: "Begin de zin met *Varje kväll*: Bram tittar på tv.", answers: ["Varje kväll tittar Bram på {tv|teve}."], topic: v2 }

      - id: v2-herkennen
        title: Klopt de woordvolgorde?
        instruction: Welke zinnen hebben een **goede** woordvolgorde? Kies alle goede antwoorden.
        topic: v2
        items:
          - id: aa2p
            type: multi
            options:
              - "Idag jobbar jag hemma."
              - "Idag jag jobbar hemma."
              - "Jag jobbar hemma idag."
              - "Hemma jobbar jag idag."
              - "I Sverige vi bor nu."
              - "Nu bor vi i Sverige."
            answers: [0, 2, 3, 5]
            tip: "Zoek in elke zin het werkwoord: staat het op plaats 2?"

      - id: v2-zinsbouw
        title: Het werkwoord op plaats 2
        instruction: Maak een zin die begint met het gegeven woord. Klik de woorden in de goede volgorde aan.
        topic: v2
        items:
          - { id: 2wvz, type: order, start: "På måndag", tokens: ["börjar", "kursen"], answers: ["På måndag börjar kursen."] }
          - { id: awbj, type: order, start: "I Västerås", tokens: ["bor", "Fleur och Bram", "nu"], answers: ["I Västerås bor Fleur och Bram nu.", "I Västerås bor nu Fleur och Bram."] }
          - { id: wzdd, type: order, start: "Svenska", tokens: ["Bram", "talar", "lite"], answers: ["Svenska talar Bram lite."] }
          - { id: e9uj, type: order, start: "Varje morgon", tokens: ["kaffe", "dricker", "Olle"], answers: ["Varje morgon dricker Olle kaffe."] }
          - { id: 7nzt, type: order, start: "Där", tokens: ["Wilma", "går"], answers: ["Där går Wilma."] }
          - { id: ak53, type: order, start: "Idag", tokens: ["hemma", "Fleur", "jobbar"], answers: ["Idag jobbar Fleur hemma."] }
          - { id: 9wg9, type: order, start: "Nu", tokens: ["fotboll", "Nils", "spelar"], answers: ["Nu spelar Nils fotboll."] }
          - { id: ncsb, type: order, start: "I Sverige", tokens: ["svenska", "vi", "talar"], answers: ["I Sverige talar vi svenska."] }

      - id: v2-kiezen-maken
        title: Inversie of niet? Kies en schrijf
        instruction: Begin de zin met het **vetgedrukte** deel. Kies eerst de volgorde, schrijf dan de hele zin.
        topic: v2
        fixedOrder: true
        shuffle: true
        items:
          - id: 3vhe
            type: steps
            steps:
              - { type: mc, prompt: "Fleur läser tidningen idag. → Begin met **Idag**. Welke volgorde krijg je?", options: ["inversie: eerst het werkwoord, dan het onderwerp", "geen inversie: eerst het onderwerp, dan het werkwoord"], answer: 0, shuffle: false, tip: "Idag staat op plaats 1. Het werkwoord blijft op plaats 2, dus het onderwerp komt erachter: inversie." }
              - { type: mc, prompt: "**Waarom?** Waarom komt *läser* vóór *Fleur*?", options: ["Het werkwoord staat op plaats 2, en plaats 1 is al bezet door Idag.", "Het onderwerp staat in het Zweeds altijd achter het werkwoord.", "Na een tijdsbepaling wordt de zin een vraag."], answer: 0, tip: "Het onderwerp mag gewoon vooraan (Fleur läser …). Alleen als iets anders op plaats 1 staat, schuift het onderwerp achter het werkwoord." }
              - { type: translate, prompt: "Schrijf de zin, beginnend met **Idag**: Fleur läser tidningen idag.", answers: ["{Idag|I dag} läser Fleur tidningen."], feedback: [{ match: ["Idag Fleur läser tidningen", "I dag Fleur läser tidningen"], tip: "Na Idag komt eerst het werkwoord: Idag läser Fleur." }] }
          - id: 9asb
            type: steps
            steps:
              - { type: mc, prompt: "Vi bor i Västerås nu. → Begin met **Nu**. Welke volgorde krijg je?", options: ["inversie: eerst het werkwoord, dan het onderwerp", "geen inversie: eerst het onderwerp, dan het werkwoord"], answer: 0, shuffle: false, tip: "Nu staat op plaats 1, dus het onderwerp komt na het werkwoord." }
              - { type: translate, prompt: "Schrijf de zin, beginnend met **Nu**: Vi bor i Västerås nu.", answers: ["Nu bor vi i Västerås."], feedback: [{ match: "Nu vi bor i Västerås", tip: "Het werkwoord op plaats 2: Nu bor vi." }] }
          - id: d526
            type: steps
            steps:
              - { type: mc, prompt: "Idag dricker jag kaffe. → Begin met **Jag**. Welke volgorde krijg je?", options: ["inversie: eerst het werkwoord, dan het onderwerp", "geen inversie: eerst het onderwerp, dan het werkwoord"], answer: 1, shuffle: false, tip: "Het onderwerp (jag) staat zelf op plaats 1. Het werkwoord komt op plaats 2, er is geen inversie." }
              - { type: translate, prompt: "Schrijf de zin, beginnend met **Jag**: Idag dricker jag kaffe.", answers: ["Jag dricker kaffe {idag|i dag}."], feedback: [{ match: "Jag kaffe dricker idag", tip: "Het werkwoord staat op plaats 2, direct na jag." }, { match: ["Idag dricker jag kaffe", "I dag dricker jag kaffe"], tip: "Goed Zweeds, maar begin de zin met Jag: Jag dricker kaffe idag." }] }
          - id: bh8w
            type: steps
            steps:
              - { type: mc, prompt: "Wilma läser en bok på kvällen. → Begin met **På kvällen**. Welke volgorde krijg je?", options: ["inversie: eerst het werkwoord, dan het onderwerp", "geen inversie: eerst het onderwerp, dan het werkwoord"], answer: 0, shuffle: false, tip: "På kvällen is één geheel op plaats 1. Daarna het werkwoord, dan het onderwerp." }
              - { type: translate, prompt: "Schrijf de zin, beginnend met **På kvällen**: Wilma läser en bok på kvällen.", answers: ["På kvällen läser Wilma en bok."], feedback: [{ match: "På kvällen Wilma läser en bok", tip: "Na På kvällen komt eerst het werkwoord: läser Wilma." }] }
          - id: ze2q
            type: steps
            steps:
              - { type: mc, prompt: "Olle dricker kaffe klockan sju. → Begin met **Klockan sju**. Welke volgorde krijg je?", options: ["inversie: eerst het werkwoord, dan het onderwerp", "geen inversie: eerst het onderwerp, dan het werkwoord"], answer: 0, shuffle: false, tip: "Een tijd op plaats 1: het werkwoord blijft op plaats 2, het onderwerp komt erachter." }
              - { type: translate, prompt: "Schrijf de zin, beginnend met **Klockan sju**: Olle dricker kaffe klockan sju.", answers: ["Klockan sju dricker Olle kaffe."], feedback: [{ match: "Klockan sju Olle dricker kaffe", tip: "Het werkwoord op plaats 2: Klockan sju dricker Olle." }] }
          - id: 2v2h
            type: steps
            steps:
              - { type: mc, prompt: "De talar nederländska hemma. → Begin met **Hemma**. Welke volgorde krijg je?", options: ["inversie: eerst het werkwoord, dan het onderwerp", "geen inversie: eerst het onderwerp, dan het werkwoord"], answer: 0, shuffle: false, tip: "Ook een plaats op plaats 1 geeft inversie." }
              - { type: translate, prompt: "Schrijf de zin, beginnend met **Hemma**: De talar nederländska hemma.", answers: ["Hemma talar de {nederländska|holländska}."], feedback: [{ match: ["Hemma de talar nederländska", "Hemma de talar holländska"], tip: "Het werkwoord op plaats 2: Hemma talar de." }] }
          - id: zktg
            type: steps
            steps:
              - { type: mc, prompt: "I Västerås jobbar Olle på en skola. → Begin met **Olle**. Welke volgorde krijg je?", options: ["inversie: eerst het werkwoord, dan het onderwerp", "geen inversie: eerst het onderwerp, dan het werkwoord"], answer: 1, shuffle: false, tip: "Olle is het onderwerp en staat zelf op plaats 1: geen inversie." }
              - { type: translate, prompt: "Schrijf de zin, beginnend met **Olle**: I Västerås jobbar Olle på en skola.", answers: ["Olle jobbar på en skola i Västerås.", "Olle jobbar i Västerås på en skola."], feedback: [{ match: "Olle på en skola jobbar i Västerås", tip: "Het werkwoord staat op plaats 2, direct na Olle." }, { match: "I Västerås jobbar Olle på en skola", tip: "Goed Zweeds, maar begin de zin met Olle." }] }
          - id: pgjf
            type: steps
            steps:
              - { type: mc, prompt: "Fleur jobbar på ett sjukhus i Västerås. → Begin met **I Västerås**. Welke volgorde krijg je?", options: ["inversie: eerst het werkwoord, dan het onderwerp", "geen inversie: eerst het onderwerp, dan het werkwoord"], answer: 0, shuffle: false, tip: "I Västerås staat op plaats 1, dus het onderwerp komt na het werkwoord." }
              - { type: translate, prompt: "Schrijf de zin, beginnend met **I Västerås**: Fleur jobbar på ett sjukhus i Västerås.", answers: ["I Västerås jobbar Fleur på ett sjukhus."], feedback: [{ match: "I Västerås Fleur jobbar på ett sjukhus", tip: "Het werkwoord op plaats 2: I Västerås jobbar Fleur." }] }
          - id: jx8c
            type: steps
            steps:
              - { type: mc, prompt: "Varje morgon läser Bram tidningen. → Begin met **Bram**. Welke volgorde krijg je?", options: ["inversie: eerst het werkwoord, dan het onderwerp", "geen inversie: eerst het onderwerp, dan het werkwoord"], answer: 1, shuffle: false, tip: "Bram is het onderwerp en staat op plaats 1: geen inversie." }
