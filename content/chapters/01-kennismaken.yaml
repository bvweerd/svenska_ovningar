          - id: yjgk
            type: dialogue
            lines:
              - "Olle: Hej! Jag heter Olle. Vad heter du?"
              - "Bram: Hej, jag heter Bram."
              - "Olle: Varifrån kommer du, Bram?"
              - "Bram: Jag kommer från Nederländerna."
              - "Olle: Talar du svenska?"
              - "Bram: Ja, lite. Jag går en kurs i svenska."
              - "Olle: Vad bra! Välkommen till Västerås!"

      - id: lezen-fleur
        title: "Lezen: Fleur stelt zich voor"
        instruction: Lees de tekst. Is de bewering **rätt** (juist) of **fel** (fout)? Is hij fout, schrijf dan de juiste zin op.
        topic: v2
        textTitle: Hej!
        text: |
          Hej! Jag heter Fleur och jag kommer från Nederländerna. Jag är 31 år och jag jobbar på ett sjukhus i Västerås. Jag är gift med Bram. Han kommer också från Nederländerna. Han är 34 år och jobbar med IT.

          Hemma pratar vi nederländska, men på jobbet talar jag svenska. Vi har inga barn, men vi har en katt. Den heter Pluto. På fritiden springer jag. Bram spelar gitarr.
        items:
          - { id: h9yp, type: truefalse, statement: "Fleur kommer från Sverige.", answer: false, tip: "Kijk naar de eerste zin.", correction: { answers: ["{Fleur|Hon} kommer från Nederländerna.", "{Fleur|Hon} kommer inte från Sverige."] } }
          - { id: euw8, type: truefalse, statement: "Fleur jobbar på ett sjukhus.", answer: true, tip: "Kijk naar de tweede zin." }
          - { id: 6twn, type: truefalse, statement: "Bram är 31 år.", answer: false, tip: "31 is de leeftijd van Fleur.", correction: { answers: ["{Bram|Han} är 34 år[ gammal]."] } }
          - { id: djx9, type: truefalse, statement: "Bram jobbar med IT.", answer: true }
          - { id: d33z, type: truefalse, statement: "Hemma pratar de svenska.", answer: false, tip: "Lees het begin van de tweede alinea.", correction: { answers: ["Hemma {pratar|talar} de nederländska.", "De {pratar|talar} nederländska hemma."], feedback: [{ match: "Hemma de pratar nederländska", tip: "Let op de V2-regel: na Hemma komt eerst het werkwoord." }] } }
          - { id: asbb, type: truefalse, statement: "Fleur och Bram har en hund.", answer: false, tip: "Welk dier hebben ze?", correction: { answers: ["{Fleur och Bram|De} har en katt.", "{Fleur och Bram|De} har ingen hund."] } }

