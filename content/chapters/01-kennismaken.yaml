      - id: begroetingen
        title: Groeten en beleefdheid
        instruction: Koppel de Zweedse uitdrukking aan de Nederlandse betekenis.
        topic: woordenschat
        items:
          - type: match
            pairs:
              - ["Hej!", "Hoi! / Hallo!"]
              - ["Hej då!", "Doei! / Tot ziens!"]
              - ["God morgon!", "Goedemorgen!"]
              - ["Tack!", "Dank je!"]
              - ["Varsågod!", "Alsjeblieft! (bij het geven)"]
              - ["Ursäkta!", "Pardon!"]
              - ["Hur mår du?", "Hoe gaat het met je?"]

      - id: dialoog-kennismaken
        title: Een kennismaking
        instruction: Zet de zinnen van het gesprek tussen Olle en Bram in de goede volgorde.
        topic: vragen
        items:
          - type: dialogue
            lines:
              - "Olle: Hej! Jag heter Olle. Vad heter du?"
              - "Bram: Hej, jag heter Bram."
              - "Olle: Varifrån kommer du, Bram?"
              - "Bram: Jag kommer från Nederländerna."
              - "Olle: Talar du svenska?"
              - "Bram: Ja, lite. Jag läser svenska på en kurs."
              - "Olle: Vad bra! Välkommen till Västerås!"

      - id: lezen-fleur
        title: "Lezen: Fleur stelt zich voor"
        instruction: Lees de tekst. Is de bewering **rätt** (juist) of **fel** (fout)? Is hij fout, schrijf dan de juiste zin op.
        topic: v2
        textTitle: Hej!
        text: |
          Hej! Jag heter Fleur och jag kommer från Nederländerna. Jag är 31 år och jag jobbar på ett sjukhus i Västerås. Jag är gift med Bram. Han kommer också från Nederländerna. Han är 34 år och jobbar med IT.

          Hemma pratar vi nederländska, men på jobbet talar jag svenska. Vi har inga barn, men vi har en katt. Den heter Pluto. På fritiden springer jag. Bram spelar gitarr.
        items:
          - { type: truefalse, statement: "Fleur kommer från Sverige.", answer: false, tip: "Kijk naar de eerste zin.", correction: { answers: ["{Fleur|Hon} kommer från Nederländerna.", "{Fleur|Hon} kommer inte från Sverige."] } }
          - { type: truefalse, statement: "Fleur jobbar på ett sjukhus.", answer: true, tip: "Kijk naar de tweede zin." }
          - { type: truefalse, statement: "Bram är 31 år.", answer: false, tip: "31 is de leeftijd van Fleur.", correction: { answers: ["{Bram|Han} är 34 år[ gammal]."] } }
          - { type: truefalse, statement: "Bram jobbar med IT.", answer: true }
          - { type: truefalse, statement: "Hemma pratar de svenska.", answer: false, tip: "Lees het begin van de tweede alinea.", correction: { answers: ["Hemma {pratar|talar} de nederländska.", "De {pratar|talar} nederländska hemma."], feedback: [{ match: "Hemma de pratar nederländska", tip: "Let op de V2-regel: na Hemma komt eerst het werkwoord." }] } }
          - { type: truefalse, statement: "Fleur och Bram har en hund.", answer: false, tip: "Welk dier hebben ze?", correction: { answers: ["{Fleur och Bram|De} har en katt.", "{Fleur och Bram|De} har ingen hund."] } }

      - id: vertalen
        title: Vertaal
        instruction: Vertaal de zin naar het Zweeds.
        topic: v2
        items:
          - { type: translate, prompt: "Ik heet Bram.", answers: ["Jag heter Bram."] }
          - { type: translate, prompt: "Wij wonen in Zweden.", answers: ["Vi bor i Sverige."] }
          - { type: translate, prompt: "Spreek jij Zweeds?", answers: ["{Talar|Pratar} du svenska?"], topic: vragen }
          - { type: translate, prompt: "Vandaag werkt Fleur thuis.", answers: ["{Idag|I dag} {jobbar|arbetar} Fleur hemma."] }
          - { type: translate, prompt: "Het huis ligt in Västerås.", answers: ["Huset ligger i Västerås."], topic: substantiv }
          - { type: translate, prompt: "Hoe gaat het met je?", answers: ["Hur mår du?", "Hur är det[ med dig]?"], topic: vragen }
          - { type: translate, prompt: "Nils spreekt geen Fins.", answers: ["Nils {talar|pratar} inte finska."], topic: inte }

      - id: schrijven-voorstellen
        title: "Schrijven: stel jezelf voor"
        instruction: Schrijf een korte tekst over jezelf.
        topic: presens
        items:
          - type: free
            prompt: "Vertel hoe je heet, waar je vandaan komt, waar je woont, welke talen je spreekt en wat je werk is."
            minWords: 25
            require:
              - { word: "heter", label: "Je vertelt hoe je heet (heter)" }
              - { any: ["kommer från"], label: "Je vertelt waar je vandaan komt (kommer från)" }
              - { any: ["bor"], label: "Je vertelt waar je woont (bor)" }
              - { any: ["talar", "pratar"], label: "Je vertelt welke talen je spreekt (talar/pratar)" }
            model: "Hej! Jag heter Sanne och jag kommer från Nederländerna. Jag bor i Zwolle med min man och två barn. Jag talar nederländska, engelska och lite svenska. Jag jobbar på en bank. På fritiden läser jag och spelar tennis."

