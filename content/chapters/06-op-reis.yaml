      - id: taak-jeugdherberg
        title: "Taak: een bed in de jeugdherberg"
        instruction: "Je komt zonder reservering aan bij een jeugdherberg (*vandrarhem*) in Visby. **Doel:** regel een bed voor twee nachten, van 3 tot 5 juli, betaal met je pinpas en zoek uit hoe je met de bus naar het centrum komt. Kies of schrijf bij elke stap wat jij zegt."
        topic: transport
        items:
          - id: qhgs
            type: steps
            explain: "Gelukt: je hebt een bed van 3 tot 5 juli, je hebt met je pas betaald en je neemt de bus van over twintig minuten."
            steps:
              - type: mc
                topic: tidsprep
                prompt: "**Receptionisten:** Hej och välkommen! — *Je wilt een bed voor twee nachten.*"
                options:
                  - "Hej! Har ni någon ledig plats i två nätter?"
                  - "Hej! Har ni någon ledig plats i två natter?"
                  - "Hej! Har ni någon ledig plats om två nätter?"
                  - "Hej! Kan jag köpa en biljett till Visby?"
                answer: 0
                optionTips:
                  - null
                  - "*natt* heeft een onregelmatig meervoud: *en natt – två nätter*."
                  - "*om två nätter* betekent *over twee nachten* (vanaf nu). Hoe lang iets duurt: *i två nätter*."
                  - "Je bent al in Visby. Je wilt een bed (*en plats*), geen kaartje."
              - type: gap
                topic: ordningstal
                prompt: "**Receptionisten:** Vilka datum? — *Van 3 tot 5 juli.*"
                text: "Från den ___ (3) till den ___ (5) juli."
                gaps:
                  - answers: ["tredje"]
                    feedback: [{ match: "tre", tip: "Bij een datum gebruik je het rangtelwoord: *den tredje*." }]
                  - answers: ["femte"]
                    feedback: [{ match: "fem", tip: "Bij een datum gebruik je het rangtelwoord: *den femte*." }]
              - type: translate
                topic: tidsprep
                prompt: "Receptionisten: Har du bott hos oss förut? — Zeg: Ja, twee jaar geleden."
                answers:
                  - "Ja, för två år {sedan|sen}."
                  - "Ja, jag {bodde här|bodde hos er|var här} för två år {sedan|sen}."
                feedback:
                  - { match: "ja två år sedan", tip: "*Geleden* is *för … sedan*: *för två år sedan*." }
                  - { match: "ja för två år", tip: "*Geleden* is *för … sedan*: je mist *sedan*." }
                  - { contains: "i två år", tip: "*i två år* betekent *twee jaar lang*. *Geleden* is *för två år sedan*." }
              - type: mc
                topic: pengar
                prompt: "**Receptionisten:** Välkommen tillbaka! En plats kostar 350 kronor per natt, så det blir 700 kronor. — *Je wilt met je pinpas betalen.*"
                options:
                  - "Kan jag betala med kort?"
                  - "Kan jag betalar med kort?"
                  - "Kan jag betala med biljett?"
                  - "Vad kostar det?"
                answer: 0
                optionTips:
                  - null
                  - "Na *kan* komt de infinitief: *betala*."
                  - "*En biljett* is een kaartje voor trein of bus. Je pinpas is *ett kort*."
                  - "De prijs weet je al: 700 kronor. Je wilt weten of je met de kaart kunt betalen."
              - type: translate
                topic: transport
                prompt: "Receptionisten: Javisst. Varsågod, här är kvittot. — Vraag: Gaat er een bus naar het centrum?"
                answers:
                  - "{Går|Finns} det {en|någon} buss [in ]till {centrum|stan}?"
                  - "Går det bussar [in ]till {centrum|stan}?"
                feedback:
                  - { contains: "åker det", tip: "Van een bus die rijdt zeg je *gå*: *Går det en buss …?*" }
                  - { contains: "går en buss", tip: "Het Zweeds heeft hier *det* nodig, zoals het Nederlands *er*: *Går **det** en buss …?*" }
              - type: mc
                topic: transport
                prompt: "**Receptionisten:** Ja, buss 1 går från hållplatsen här utanför. Den går om fem minuter. — *Je wilt eerst je tas naar je bed brengen. Vijf minuten is te kort.*"
                options:
                  - "Det hinner jag inte. När går nästa buss?"
                  - "Det hinner jag inte. När går nästa bussen?"
                  - "Det hinner jag inte. När gick nästa buss?"
                  - "Det hinner jag inte. När går nästa tåg?"
                answer: 0
                optionTips:
                  - null
                  - "Na *nästa* komt de onbepaalde vorm: *nästa buss* (zoals *När går nästa tåg?*)."
                  - "Je vraagt naar iets wat nog moet komen: *När går …?*"
                  - "Je wilt met de bus, niet met de trein."
              - type: translate
                topic: transport
                prompt: "Receptionisten: Nästa buss går om tjugo minuter. — Zeg: Goed, dan neem ik die bus."
                answers:
