chapter: 6
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan zeggen wanneer iets gebeurt of gebeurd is (om, för … sedan, i)", topics: [tidsprep] }
  - { text: "Ik kan vertellen hoe ik reis en over prijzen praten", topics: [transport, pengar, raknord] }
  - { text: "Ik kan data en rangtelwoorden gebruiken", topics: [ordningstal] }

grammar:
  - id: tidsprep
    title: Tijdsuitdrukkingen – om, för … sedan, i, på, under
    summary: "**om** een week = over een week, **för** een week **sedan** = een week geleden, **i** tre år = drie jaar lang, **inte på** länge = lang niet, **under** = tijdens."
    body: |
      | Zweeds | Betekenis | Voorbeeld |
      |---|---|---|
      | **om** + periode | over (toekomst) | Tåget går **om** tio minuter. |
      | **för** + periode + **sedan** | geleden | Hon kom hem **för** tre dagar **sedan**. |
      | **i** + periode | (al) … lang | Jag har bott här **i** två år. |
      | **på** + periode | binnen, in (hoe lang iets duurt) | Vi körde till Göteborg **på** fyra timmar. |
      | **inte på** + periode | al … niet | Jag har **inte** sett honom **på** länge. |
      | **under** | tijdens | **Under** semestern läste jag fem böcker. |

      ### Seizoenen
      | | Nu of binnenkort | Afgelopen | In het algemeen |
      |---|---|---|---|
      | zomer | i sommar | i somras | på sommaren |
      | winter | i vinter | i vintras | på vintern |
      | herfst | i höst | i höstas | på hösten |
      | lente | i vår | i våras | på våren |

      *I sommar ska vi åka till Gotland.* – *I somras var vi i Dalarna.* – *På sommaren är det ljust hela natten.*

  - id: transport
    title: Op weg – åka, gå, köra, ta
    summary: "**åka** = gaan met een voertuig, **gå** = lopen (of: vertrekken, van bus of trein), **köra** = zelf rijden, **ta** bussen = de bus nemen."
    body: |
      | Zweeds | Betekenis | Voorbeeld |
      |---|---|---|
      | åka (+ buss, tåg, bil) | gaan, reizen met een voertuig | Jag **åker** buss till jobbet. |
      | ta + bussen/tåget | de bus/trein nemen | Jag **tar** tåget till Stockholm. |
      | gå | lopen, te voet gaan | Wilma **går** till skolan. |
      | gå (van een voertuig) | vertrekken, rijden | Tåget **går** klockan tio. |
      | köra | (zelf) rijden, besturen | Olle **kör** bil. |
      | flyga | vliegen | Vi **flyger** till London. |
      | cykla | fietsen | Nils **cyklar** till träningen. |

      Let op: na *åka* staat het voertuig meestal **zonder lidwoord**: *åka buss, åka tåg, åka bil*. Na *ta* gebruik je de **bepaalde vorm**: *ta bussen, ta tåget*.

      Handige vragen: *När går nästa tåg?* (Wanneer gaat de volgende trein?) *Var ska jag byta?* (Waar moet ik overstappen?) *Var ska jag stiga av?* (Waar moet ik uitstappen?)

  - id: pengar
    title: Geld en betalen
    summary: "*Vad kostar det?* – *Det kostar 95 kronor.* Munten en briefjes: *en tia* (munt van 10), *en tjuga* (briefje van 20), *en femtiolapp*, *en hundralapp*."
    body: |
      In Zweden betaal je met **kronor** (een *krona*, meervoud *kronor*). Bijna overal betaal je met kaart of met de app *Swish*; contant geld wordt steeds minder gebruikt.

      | Zweeds | Betekenis |
      |---|---|
      | en tia | een tientje (munt van 10 kronor) |
      | en tjuga | een briefje van 20 |
      | en femtiolapp | een briefje van 50 |
      | en hundralapp | een briefje van 100 |
      | Vad kostar det? | Wat kost het? |
      | Det blir 95 kronor. | Dat wordt 95 kronen. |
      | Kan jag betala med kort? | Kan ik met de kaart betalen? |
      | Kan jag få kvittot? | Mag ik het bonnetje? |

      Let op: een *tia* is een **munt**; *tjuga*, *femtiolapp* en *hundralapp* zijn papiergeld (*en lapp* = een briefje). Verwar het Nederlandse *biljet* niet met het Zweedse *en biljett*: dat is een (trein)kaartje.

  - id: ordningstal
    title: Rangtelwoorden en datums
    summary: "*första, andra, tredje, fjärde, femte* … Een datum zeg je met **den** + rangtelwoord: *den tredje maj*."
    body: |
      | | | | |
      |---|---|---|---|
      | 1 första | 6 sjätte | 11 elfte | 20 tjugonde |
      | 2 andra | 7 sjunde | 12 tolfte | 21 tjugoförsta |
      | 3 tredje | 8 åttonde | 13 trettonde | 30 trettionde |
      | 4 fjärde | 9 nionde | 14 fjortonde | 31 trettioförsta |
      | 5 femte | 10 tionde | 15 femtonde | |

      ### Datum
      - *Vilket datum är det idag?* – *Det är **den tredje maj**.* (geschreven: den 3 maj)
      - Maanden schrijf je met een kleine letter: *januari, februari, mars, april, maj, juni, juli, augusti, september, oktober, november, december*.
      - In een maand: **i** maj. Op een datum: **den** 3 maj.

sections:
  - id: oefeningen
    title: Oefeningen
    exercises:
      - id: seizoenen
        title: Welke zomer?
        instruction: Kies de juiste uitdrukking.
        topic: tidsprep
        shuffle: true
        items:
          - { id: umb4, type: mc, prompt: "**vorige** zomer", options: ["i somras", "i sommar", "på sommaren"], answer: 0, shuffle: false, tip: "Afgelopen seizoen: i + -as/-ras (i somras, i vintras)." }
          - { id: u9rb, type: mc, prompt: "**deze** zomer (die nog komt)", options: ["i somras", "i sommar", "på sommaren"], answer: 1, shuffle: false, tip: "Dit seizoen: i + seizoen (i sommar)." }
          - { id: fshv, type: mc, prompt: "in de zomer (**altijd**, in het algemeen)", options: ["i somras", "i sommar", "på sommaren"], answer: 2, shuffle: false, tip: "In het algemeen: på + bepaalde vorm (på sommaren)." }
          - { id: 3zt6, type: mc, prompt: "**vorige** winter", options: ["i vintras", "i vinter", "på vintern"], answer: 0, shuffle: false, tip: "Afgelopen seizoen: i vintras." }
          - { id: q5tu, type: mc, prompt: "**deze** herfst", options: ["i höstas", "i höst", "på hösten"], answer: 1, shuffle: false, tip: "Dit seizoen: i höst." }
          - { id: 4xx6, type: mc, prompt: "**vorige** herfst", options: ["i höstas", "i höst", "på hösten"], answer: 0, shuffle: false, tip: "Afgelopen seizoen: i höstas." }
          - { id: smay, type: mc, prompt: "in de winter (**altijd**, in het algemeen)", options: ["i vintras", "i vinter", "på vintern"], answer: 2, shuffle: false, tip: "In het algemeen: på + bepaalde vorm (på vintern)." }
          - { id: g7wr, type: mc, prompt: "**deze** lente", options: ["i våras", "i vår", "på våren"], answer: 1, shuffle: false, tip: "Dit seizoen: i vår." }

      - id: tidsprep-kiezen
        title: Om, i, på, för of under?
        instruction: Kies het juiste voorzetsel.
        topic: tidsprep
        shuffle: true
        items:
          - { id: 46z2, type: gap, text: "Vi reser till Sverige ___ några veckor.", hint: "(over een paar weken)", gaps: [{ answers: ["om"], options: ["om", "i", "på", "för", "under"], shuffle: false, feedback: [{ match: "i", tip: "Over een tijd (in de toekomst) = om." }] }] }
          - { id: ntt3, type: gap, text: "Fleur var hos doktorn ___ en vecka sedan.", gaps: [{ answers: ["för"], options: ["om", "i", "på", "för", "under"], shuffle: false }] }
          - { id: xhn7, type: gap, text: "Det har regnat ___ en vecka nu.", gaps: [{ answers: ["i"], options: ["om", "i", "på", "för", "under"], shuffle: false, feedback: [{ match: "på", tip: "Hoe lang iets al duurt (en nog doorgaat) = i." }] }] }
          - { id: j94y, type: gap, text: "Bram har inte träffat sin bror ___ länge.", gaps: [{ answers: ["på"], options: ["om", "i", "på", "för", "under"], shuffle: false, feedback: [{ match: "i", tip: "Na een ontkenning (inte … länge) gebruik je på." }] }] }
          - { id: 4xf8, type: gap, text: "___ semestern läste jag fem böcker.", gaps: [{ answers: ["Under"], options: ["Om", "I", "På", "För", "Under"], shuffle: false }] }
          - { id: acdz, type: gap, text: "Vi körde till Göteborg ___ fyra timmar.", gaps: [{ answers: ["på"], options: ["om", "i", "på", "för", "under"], shuffle: false, feedback: [{ match: "i", tip: "Hoe lang je erover deed (binnen vier uur) = på." }] }] }
          - { id: kczm, type: gap, text: "Filmen börjar ___ en halvtimme.", gaps: [{ answers: ["om"], options: ["om", "i", "på", "för", "under"], shuffle: false }] }
          - { id: n9fu, type: gap, text: "Jag har bott i Sverige ___ två år.", gaps: [{ answers: ["i"], options: ["om", "i", "på", "för", "under"], shuffle: false }] }

      - id: tidsprep-vertalen
        title: Vertaal de tijdsuitdrukking
        instruction: Vertaal naar het Zweeds.
        topic: tidsprep
        items:
          - { id: 4nhm, type: translate, prompt: "Over een uur vertrekt de trein.", answers: ["Om en timme {går|avgår} tåget.", "Tåget {går|avgår} om en timme."], feedback: [{ contains: "i en timme", tip: "Over een tijd (toekomst) = om." }] }
          - { id: gce5, type: translate, prompt: "Drie dagen geleden kwam ze thuis.", answers: ["För tre dagar {sedan|sen} kom hon hem.", "Hon kom hem för tre dagar {sedan|sen}."], feedback: [{ contains: "hemma", tip: "Thuiskomen is een richting: hem." }] }
          - { id: gmmc, type: translate, prompt: "Ik heb hem lang niet gezien.", answers: ["Jag har inte {sett|träffat} honom på länge."], feedback: [{ contains: "i länge", tip: "Na een ontkenning: inte … på länge." }] }
          - { id: eexr, type: translate, prompt: "Tijdens de vakantie zwommen we elke dag.", answers: ["Under semestern {badade|simmade} vi varje dag.", "Vi {badade|simmade} varje dag under semestern."] }
          - { id: m5u7, type: translate, prompt: "Deze zomer gaan we naar Gotland.", answers: ["I sommar ska vi [åka ]till Gotland.", "I sommar åker vi till Gotland.", "Vi {ska åka|ska|åker} till Gotland i sommar."], feedback: [{ contains: "i somras", tip: "i somras is afgelopen zomer. Voor deze (komende) zomer: i sommar." }] }
          - { id: ajdd, type: translate, prompt: "Over twee weken begint de cursus.", answers: ["Om två veckor börjar kursen.", "Kursen börjar om två veckor."], feedback: [{ contains: "i två veckor", tip: "Over een tijd (toekomst) = om." }, { contains: "veckor kursen börjar", tip: "Na de tijdsbepaling vooraan komt eerst het werkwoord." }] }
          - { id: wur3, type: translate, prompt: "Een week geleden was ik in Uppsala.", answers: ["För en vecka {sedan|sen} var jag i Uppsala.", "Jag var i Uppsala för en vecka {sedan|sen}."], feedback: [{ contains: ["sedan jag var", "sen jag var"], tip: "Na de tijdsbepaling vooraan komt eerst het werkwoord." }] }
          - { id: bnr7, type: translate, prompt: "We hebben twee uur gewacht.", answers: ["Vi har väntat [i ]två timmar.", "Vi väntade [i ]två timmar."], feedback: [{ contains: "på två timmar", tip: "Een duur zonder ontkenning: i två timmar (of zonder voorzetsel)." }] }

      - id: tidsprep-kiezen-maken
        title: Over, geleden of lang? Kies en vertaal
        instruction: Kies eerst de tijdsuitdrukking die past, vertaal dan de zin.
        topic: tidsprep
        shuffle: true
        items:
          - id: e3xj
            type: steps
            steps:
              - { type: mc, prompt: "De bus komt over vijf minuten. Welke uitdrukking?", options: ["om", "för … sedan", "i", "på"], answer: 0, shuffle: false, tip: "Over (in de toekomst) = om." }
              - { type: translate, prompt: "Vertaal: De bus komt over vijf minuten.", answers: ["Bussen kommer om fem minuter."], feedback: [{ contains: "på fem minuter", tip: "Over vijf minuten (vanaf nu): om." }] }
          - id: f3yy
            type: steps
            steps:
              - { type: mc, prompt: "Ik heb haar een week geleden gezien. Welke uitdrukking?", options: ["om", "för … sedan", "i", "på"], answer: 1, shuffle: false, tip: "Geleden = för … sedan." }
              - { type: mc, prompt: "**Waarom?** Waarom wordt het *Jag såg henne* (preteritum) en niet *Jag har sett henne*?", options: ["För en vecka sedan is een tijdstip in het verleden.", "Se is een sterk werkwoord.", "Na för komt altijd de preteritum."], answer: 0, tip: "Met een tijdstip in het verleden gebruik je de preteritum (hoofdstuk 5)." }
              - { type: translate, prompt: "Vertaal: Ik heb haar een week geleden gezien.", answers: ["Jag {såg|träffade} henne för en vecka {sedan|sen}."], feedback: [{ contains: ["har sett", "har träffat"], tip: "För en vecka sedan is een tijdstip: preteritum, såg." }, { match: ["Jag såg henne en vecka sedan.", "En vecka sedan såg jag henne."], tip: "Geleden = för … sedan." }] }
          - id: tdfq
            type: steps
            steps:
              - { type: mc, prompt: "We wonen hier al twee jaar. Welke uitdrukking?", options: ["om", "för … sedan", "i", "på"], answer: 2, shuffle: false, tip: "Hoe lang iets al duurt: i." }
              - { type: translate, prompt: "Vertaal: We wonen hier al twee jaar.", answers: ["Vi har bott här [i ]två år."], feedback: [{ contains: "på två år", tip: "(Al) twee jaar lang: i två år." }, { contains: "Vi bor här", tip: "Het loopt tot nu door: perfekt, Vi har bott." }] }
          - id: ecmc
            type: steps
            steps:
              - { type: mc, prompt: "Nils ontbeet in vijf minuten. Welke uitdrukking?", options: ["om", "för … sedan", "i", "på"], answer: 3, shuffle: false, tip: "Hoe lang je erover doet: på." }
              - { type: translate, prompt: "Vertaal: Nils ontbeet in vijf minuten.", answers: ["Nils åt frukost på fem minuter."], feedback: [{ contains: "i fem minuter", tip: "Hoe lang hij erover deed: på fem minuter." }] }
          - id: nm7x
            type: steps
            steps:
              - { type: mc, prompt: "Ik heb Olle lang niet gezien. Welke uitdrukking?", options: ["om", "för … sedan", "i", "på"], answer: 3, shuffle: false, tip: "Lang niet = inte på länge." }
              - { type: translate, prompt: "Vertaal: Ik heb Olle lang niet gezien.", answers: ["Jag har inte {sett|träffat} Olle på länge."], feedback: [{ contains: "i länge", tip: "Lang niet = inte på länge." }] }
          - id: hxvj
            type: steps
            steps:
              - { type: mc, prompt: "Over een maand gaan we naar Gotland. Welke uitdrukking?", options: ["om", "för … sedan", "i", "på"], answer: 0, shuffle: false, tip: "Over (in de toekomst) = om." }
              - { type: translate, prompt: "Vertaal: Over een maand gaan we naar Gotland.", answers: ["Om en månad åker vi till Gotland.", "Om en månad ska vi [åka ]till Gotland."], feedback: [{ contains: "Om en månad vi", tip: "Na Om en månad komt eerst het werkwoord: Om en månad åker vi." }] }
          - id: ha9k
            type: steps
            steps:
              - { type: mc, prompt: "Olle kocht twee weken geleden een nieuwe auto. Welke uitdrukking?", options: ["om", "för … sedan", "i", "på"], answer: 1, shuffle: false, tip: "Geleden = för … sedan." }
              - { type: translate, prompt: "Vertaal: Olle kocht twee weken geleden een nieuwe auto.", answers: ["Olle köpte en ny bil för två veckor {sedan|sen}."], feedback: [{ contains: "har köpt", tip: "För två veckor sedan is een tijdstip: preteritum, köpte." }] }
          - id: mb2p
            type: steps
            steps:
              - { type: mc, prompt: "Wilma las een uur lang. Welke uitdrukking?", options: ["om", "för … sedan", "i", "på"], answer: 2, shuffle: false, tip: "Hoe lang iets duurde: i." }
              - { type: translate, prompt: "Vertaal: Wilma las een uur lang.", answers: ["Wilma läste [i ]en timme."], feedback: [{ contains: "på en timme", tip: "Hoe lang ze las: i en timme. På en timme = binnen een uur." }] }
          - id: yqxk
            type: steps
            steps:
              - { type: mc, prompt: "Hij schreef de brief in tien minuten. Welke uitdrukking?", options: ["om", "för … sedan", "i", "på"], answer: 3, shuffle: false, tip: "Hoe lang hij erover deed: på." }
              - { type: translate, prompt: "Vertaal: Hij schreef de brief in tien minuten.", answers: ["Han skrev brevet på tio minuter."], feedback: [{ contains: "i tio minuter", tip: "Hoe lang hij erover deed: på tio minuter." }] }

      - id: transport-kiezen
        title: Åka, gå, köra of ta?
        instruction: Kies het werkwoord dat past.
        topic: transport
        shuffle: true
        items:
          - { id: 45uf, type: gap, text: "Bram ___ buss till jobbet.", gaps: [{ answers: ["åker"], options: ["åker", "går", "kör", "tar"], shuffle: false, feedback: [{ match: "går", tip: "gå = lopen. Met een voertuig: åka." }, { match: "tar", tip: "ta + bepaalde vorm: tar bussen. Bij „buss” zonder lidwoord: åker." }] }] }
          - { id: twqj, type: gap, text: "Wilma ___ till skolan. Det är bara 500 meter.", gaps: [{ answers: ["går"], options: ["åker", "går", "kör", "tar"], shuffle: false }] }
          - { id: hqmq, type: gap, text: "Olle ___ bil, men Ingrid har inget körkort.", gaps: [{ answers: ["kör"], options: ["åker", "går", "kör", "tar"], shuffle: false }] }
          - { id: f5nu, type: gap, text: "Tåget ___ klockan 10.15.", gaps: [{ answers: ["går"], options: ["åker", "går", "kör", "tar"], shuffle: false, feedback: [{ match: "åker", tip: "Van een bus of trein die vertrekt zeg je: går." }] }] }
          - { id: w6wu, type: gap, text: "Fleur ___ tåget till Uppsala.", gaps: [{ answers: ["tar"], options: ["åker", "går", "kör", "tar"], shuffle: false }] }
          - { id: n9xh, type: gap, text: "Vi ___ till London i morgon.", hint: "(vliegen)", gaps: [{ answers: ["flyger"], feedback: [{ match: "flygar", tip: "flyga – flyger." }] }] }
          - { id: w575, type: gap, text: "Sista bussen ___ klockan elva.", gaps: [{ answers: ["går"], options: ["åker", "går", "kör", "tar"], shuffle: false, feedback: [{ match: "åker", tip: "Van een bus of trein die vertrekt zeg je: går." }] }] }
          - { id: bh55, type: gap, text: "Ingrid har inget körkort, så hon ___ aldrig bil.", gaps: [{ answers: ["kör"], options: ["åker", "går", "kör", "tar"], shuffle: false }] }

      - id: transport-vertalen
        title: Onderweg
        instruction: Vertaal naar het Zweeds.
        topic: transport
        items:
          - { id: 2saf, type: translate, prompt: "Ik neem de trein naar Stockholm.", answers: ["Jag tar tåget till Stockholm.", "Jag åker {tåg|med tåget} till Stockholm."], feedback: [{ match: "Jag tar tåg till Stockholm", tip: "Na ta: bepaalde vorm (tåget)." }] }
          - { id: 64zu, type: translate, prompt: "Fleur gaat met de bus naar haar werk.", answers: ["Fleur {åker buss|tar bussen|åker med bussen} till {jobbet|arbetet}."], feedback: [{ contains: "går med bussen", tip: "Met een voertuig: åka (of ta bussen). gå = lopen." }] }
          - { id: thyg, type: translate, prompt: "Hoe laat vertrekt de bus?", answers: ["{När|Hur dags|Vilken tid} {går|avgår} bussen?"], topic: vragen }
          - { id: hdb5, type: translate, prompt: "Waar moet ik overstappen?", answers: ["Var ska jag byta?", "Var måste jag byta?"] }
          - { id: e7zs, type: translate, prompt: "Wij vliegen naar Kiruna.", answers: ["Vi flyger till Kiruna."], feedback: [{ contains: "flygar", tip: "flyga – flyger." }] }
          - { id: ffhd, type: translate, prompt: "Wilma loopt naar school.", answers: ["Wilma går till skolan."], feedback: [{ contains: "åker", tip: "Lopen = gå. åka gebruik je met een voertuig." }] }
          - { id: 32hz, type: translate, prompt: "Olle rijdt met de auto naar Uppsala.", answers: ["Olle kör [bil ]till Uppsala.", "Olle åker bil till Uppsala.", "Olle tar bilen till Uppsala."] }
          - { id: 97uz, type: translate, prompt: "Neem jij de veerboot naar Gotland?", answers: ["Tar du färjan till Gotland?", "Åker du {färja|med färjan} till Gotland?"], topic: vragen }

      - id: geld
        title: Geld
        instruction: Koppel het Zweedse woord aan de betekenis.
        topic: pengar
        items:
          - id: hnq4
            type: match
            pairs:
              - ["en tia", "een munt van tien kronen"]
              - ["en tjuga", "een briefje van twintig"]
              - ["en hundralapp", "een briefje van honderd"]
              - ["ett kvitto", "een bonnetje"]
              - ["Vad kostar det?", "Wat kost het?"]
              - ["Kan jag betala med kort?", "Kan ik pinnen?"]

      - id: prijzen
        title: Wat kost het?
        instruction: Schrijf het bedrag in woorden.
        topic: pengar
        shuffle: true
        items:
          - { id: y7s3, type: gap, topic: raknord, text: "Kaffet kostar ___ kronor. (35)", gaps: [{ answers: ["trettiofem"], feedback: [{ match: "femtrettio", tip: "Het tiental eerst: trettio + fem." }] }] }
          - { id: pfdt, type: gap, topic: raknord, text: "Biljetten kostar ___ kronor. (95)", gaps: [{ answers: ["nittiofem"] }] }
          - { id: 7s8b, type: gap, topic: raknord, text: "Det blir ___ kronor. (120)", gaps: [{ answers: ["[ett]hundratjugo"], feedback: [{ contains: "hundra ", tip: "Getallen schrijf je in het Zweeds aan elkaar: hundratjugo." }] }] }
          - { id: 6ey7, type: gap, topic: raknord, text: "Boken kostar ___ kronor. (249)", gaps: [{ answers: ["tvåhundrafyrtionio"], feedback: [{ contains: "hundra ", tip: "Getallen schrijf je in het Zweeds aan elkaar: tvåhundrafyrtionio." }] }] }
          - { id: y4ej, type: gap, topic: raknord, text: "Glassen kostar ___ kronor. (58)", gaps: [{ answers: ["femtioåtta"], feedback: [{ match: "åttafemtio", tip: "Het tiental eerst: femtio + åtta." }] }] }
