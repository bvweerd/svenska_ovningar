          - { id: pg8v, type: gap, text: "Jag sätter ett ___ på såret.", gaps: [{ answers: ["plåster"], options: ["plåster", "ansikte", "bröst", "hår"] }] }
          - { id: 3s5x, type: gap, text: "Hon bröt benet och måste gå med ___ i sex veckor.", gaps: [{ answers: ["kryckor"], options: ["kryckor", "ambulanser", "termometrar", "patienter"], feedback: [{ match: "ambulanser", tip: "Met een gebroken been loop je met krukken: kryckor." }] }] }
          - { id: 74af, type: gap, text: "Ring 112! Vi behöver en ___ direkt.", gaps: [{ answers: ["ambulans"], options: ["ambulans", "termometer", "krycka", "hud"], feedback: [{ match: "termometer", tip: "Bij een noodgeval (112) komt er een ambulance: ambulans." }] }] }
