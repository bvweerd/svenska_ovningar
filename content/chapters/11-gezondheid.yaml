      - id: lezen-rug
        title: "Lezen: Olle heeft rugpijn"
        instruction: Lees de tekst. Is de bewering **rätt** of **fel**? Is hij fout, schrijf dan de juiste zin op.
        topic: kroppen
        textTitle: Ont i ryggen
        text: |
          Olle har haft ont i ryggen i en vecka. I måndags ringde han till vårdcentralen och fick en tid på onsdagen. Läkaren undersökte honom och sa att det inte var något farligt. Olle hade lyft något tungt i trädgården. Han fick tabletter mot smärtan och läkaren sa att han skulle vila sig och inte lyfta tunga saker på två veckor.

          I fredags kände sig Olle lite bättre. Han satte sig vid bordet i köket och åt frukost med familjen. Sedan ville han gå ut och arbeta i trädgården, men Ingrid sa nej. ”Lägg dig i soffan igen”, sa hon. ”Du ska vila i två veckor!”

          Nu ligger Olle i soffan och läser, men han tycker att det är tråkigt! Han hoppas att ryggen blir bra snart. Ingrid måste göra allt arbete i trädgården. Varje morgon ställer hon en kopp kaffe på bordet bredvid soffan och lägger tidningen där. Nils och Wilma hjälper henne och diskar efter middagen.
        items:
          - { id: 2zvb, type: truefalse, statement: "Olle har ont i huvudet.", answer: false, tip: "Waar heeft hij pijn?", correction: { answers: ["{Olle|Han} har ont i ryggen."] } }
          - { id: gb85, type: truefalse, statement: "Olle fick en tid på onsdagen.", answer: true }
          - { id: d8gx, type: truefalse, statement: "Läkaren sa att det var farligt.", answer: false, tip: "Wat zei de arts?", correction: { answers: ["{Läkaren|Hon|Han} sa att det inte var [något ]farligt."], feedback: [{ contains: "det var inte", tip: "In de bijzin staat inte vóór het werkwoord: att det inte var farligt." }] } }
          - { id: knga, type: truefalse, statement: "Olle ska vila sig.", answer: true }
          - { id: t8uk, type: truefalse, statement: "Olle får lyfta tunga saker.", answer: false, tip: "Wat zei de arts over tillen?", correction: { answers: ["{Olle|Han} får inte lyfta tunga saker[ på två veckor].", "{Olle|Han} ska inte lyfta tunga saker[ på två veckor]."] } }
          - { id: 3xbb, type: truefalse, statement: "I fredags mådde Olle fortfarande dåligt.", answer: false, tip: "Hoe voelde Olle zich op vrijdag?", correction: { answers: ["{I fredags|På fredagen} kände {sig Olle|Olle sig|han sig} [lite ]bättre.", "{I fredags|På fredagen} mådde {Olle|han} [lite ]bättre.", "{Olle|Han} {kände sig|mådde} [lite ]bättre[ {i fredags|på fredagen}]."] } }
          - { id: 9abg, type: truefalse, statement: "Olle åt frukost i soffan i fredags.", answer: false, tip: "Waar at Olle op vrijdag zijn ontbijt?", correction: { answers: ["{Olle|Han} åt frukost {vid bordet i köket|i köket}[ med familjen][ {i fredags|på fredagen}].", "{I fredags|På fredagen} åt {Olle|han} frukost {vid bordet i köket|i köket}[ med familjen].", "{Olle|Han} satte sig vid bordet i köket och åt frukost[ med familjen]."] } }
          - { id: u86b, type: truefalse, statement: "Olle tycker att det är roligt att ligga i soffan.", answer: false, tip: "Lees het begin van de laatste alinea.", correction: { answers: ["{Olle|Han} tycker [att ]det är tråkigt[ att ligga i soffan]."] } }
          - { id: vcam, type: truefalse, statement: "Varje morgon ställer Ingrid en kopp kaffe bredvid soffan.", answer: true }
          - { id: 9xdh, type: truefalse, statement: "Ingrid diskar efter middagen.", answer: false, tip: "Wie wast er af?", correction: { answers: ["{Nils och Wilma|De} diskar[ efter middagen].", "{Nils och Wilma|De} hjälper {Ingrid|henne} och diskar[ efter middagen]."] } }

      - id: makkelijk-1
        title: "Makkelijk lezen: Hos läkaren"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Hos läkaren"
        text: |
          Olle har haft ont i ryggen i en vecka. Idag går han till vårdcentralen. Han sätter sig och väntar. Sedan undersöker läkaren honom. Hon säger att han ska vila sig och ta en tablett på kvällen. Olle tackar och går hem.
        items:
          - { id: hkde, type: truefalse, statement: "Olle har ont i magen.", answer: false }
          - { id: 6pcu, type: truefalse, statement: "Läkaren undersöker Olle.", answer: true }

      - id: makkelijk-2
        title: "Makkelijk lezen: Var ligger nycklarna?"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Var ligger nycklarna?"
        text: |
          Fleur letar efter nycklarna. De ligger inte på bordet och de hänger inte i hallen. Bram sitter i soffan och läser.

          – Har du sett mina nycklar? frågar Fleur.

          – De ligger i din väska, säger Bram.

          Fleur tittar i väskan. Där ligger de! Hon skrattar.
        items:
          - { id: arte, type: truefalse, statement: "Nycklarna hänger i hallen.", answer: false }
          - { id: upzz, type: truefalse, statement: "Nycklarna ligger i Fleurs väska.", answer: true }

      - id: makkelijk-3
        title: "Makkelijk lezen: Förkyld"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Förkyld"
        text: |
          Wilma vaknar och känner sig sjuk. Hon har ont i halsen och i huvudet. Hon stannar hemma från skolan och lägger sig i soffan. Mamma ställer en kopp te på bordet och lägger en filt över henne. Wilma vilar sig hela dagen. På kvällen mår hon lite bättre.
        items:
          - { id: nd5n, type: mc, prompt: "Var har Wilma ont?", options: ["I magen och i ryggen.", "I halsen och i huvudet.", "I benet."], answer: 1 }
          - { id: cna9, type: truefalse, statement: "Wilma går till skolan.", answer: false }
          - { id: s73k, type: truefalse, statement: "På kvällen mår hon lite bättre.", answer: true }

