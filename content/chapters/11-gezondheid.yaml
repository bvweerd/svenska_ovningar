      - id: luisteren-gesprek
        title: "Luisteren: de huisarts bellen"
        instruction: Luister naar het gesprek. Is de bewering **rätt** of **fel**? Lees de tekst pas als je klaar bent.
        topic: kroppen
        listen: true
        textTitle: "Samtal till vårdcentralen"
        text: |
          Sjuksköterskan: Vårdcentralen, hej. Hur kan jag hjälpa dig?

          Ingrid: Hej. Min son Nils har haft ont i halsen och feber sedan igår.

          Sjuksköterskan: Hur hög feber har han?

