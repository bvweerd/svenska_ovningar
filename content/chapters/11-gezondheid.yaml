          - { id: fmeg, type: gap, text: "Jag cyklar varje dag och får mycket ___.", gaps: [{ answers: ["motion"], options: ["motion", "influensa", "värk", "gips"], feedback: [{ match: "influensa", tip: "Fietsen is beweging: motion. Influensa is griep." }] }] }
          - { id: rg9w, type: gap, text: "Läkaren träffar tjugo ___ varje dag.", gaps: [{ answers: ["patienter"], options: ["patienter", "kryckor", "termometrar", "ambulanser"] }] }
          - { id: t6pt, type: gap, text: "Gatan var blöt efter regnet, så jag ___.", gaps: [{ answers: ["halkade"], options: ["halkade", "svalde", "nös", "läkte"], feedback: [{ match: "nös", tip: "Att nysa = niezen. Op een natte vloer glijd je uit: halka (halkade)." }] }] }
          - { id: j5ey, type: gap, text: "Tabletten är stor, så det är svårt att ___ den.", gaps: [{ answers: ["svälja"], options: ["svälja", "nysa", "läka", "halka"], feedback: [{ match: "nysa", tip: "Een tablet moet je doorslikken: svälja." }] }] }
          - { id: d8b8, type: gap, text: "Hon är förkyld och ___ hela morgonen.", gaps: [{ answers: ["nyser"], options: ["nyser", "sväljer", "läker", "avbokar"], feedback: [{ match: "sväljer", tip: "Bij een allergie nies je: nysa (jag nyser)." }] }] }
          - { id: fp2b, type: gap, text: "Vi är sjuka och måste ___ resan.", gaps: [{ answers: ["avboka"], options: ["avboka", "svälja", "läka", "halka"], feedback: [{ match: "läka", tip: "Läka = genezen. Een afspraak afzeggen is avboka." }] }] }
          - { id: 89um, type: gap, text: "Var ___! Det är inget farligt.", gaps: [{ answers: ["lugn"], options: ["lugn", "stressad", "skadad", "allvarlig"], feedback: [{ match: "stressad", tip: "Er is niets ergs aan de hand: dan blijf je rustig (lugn)." }] }] }
          - { id: v5pp, type: gap, text: "Jag har så mycket att göra på jobbet att jag är ___ hela tiden.", gaps: [{ answers: ["stressad"], options: ["stressad", "lugn", "pigg", "utomhus"], feedback: [{ match: "lugn", tip: "Veel werk maakt je eerder gestrest (stressad) dan rustig." }] }] }
          - { id: kjhc, type: gap, text: "På sommaren tränar jag ___, inte på gymmet.", gaps: [{ answers: ["utomhus"], options: ["utomhus", "lugn", "pigg", "farligt"], feedback: [{ match: "lugn", tip: "Bij mooi weer eet je buiten: utomhus." }] }] }

      - id: wat-zeg-je
        title: Wat zeg je?
        instruction: Wat zeg je in het Zweeds? Er is vaak meer dan één goed antwoord.
        kind: situatie
        items:
          - { id: d2hr, type: translate, topic: kroppen, prompt: "Bij de dokter: zeg dat je hoofdpijn hebt.", answers: ["Jag har ont i huvudet.", "Jag har huvudvärk."] }
          - { id: 4y9j, type: translate, topic: reflexiv, prompt: "Zeg dat je je niet lekker voelt.", answers: ["Jag mår {inte bra|dåligt|inte så bra}.", "Jag känner mig {sjuk|dålig|inte bra|inte så bra|inte riktigt bra}."], feedback: [{ contains: "Jag känner inte bra", tip: "Je voelen is wederkerend: jag känner mig." }] }
          - { id: 8w4n, type: translate, topic: reflexiv, prompt: "Er staat een vriend in je kamer. Zeg dat hij moet gaan zitten.", answers: ["[Varsågod och ]sätt dig[, är du snäll].", "Du kan sätta dig.", "Sitt ner[, är du snäll]."], feedback: [{ contains: "Sitt dig", tip: "Gaan zitten is sätta sig: Sätt dig!" }] }
          - { id: axzb, type: translate, topic: placera, prompt: "Je komt binnen bij iemand. Vraag waar je je jas kunt ophangen.", answers: ["Var kan jag hänga {jackan|min jacka}?", "Var kan jag hänga {upp|av mig} {jackan|min jacka}?", "Var kan jag hänga av mig?"] }
          - { id: k24z, type: translate, topic: positionsverb, prompt: "Een vriend belt en vraagt wat je aan het doen bent. Zeg dat je op de bank zit te lezen.", answers: ["[Jag ]sitter {i|på} soffan och läser[ en bok].", "[Jag ]sitter och läser[ en bok] {i|på} soffan."], feedback: [{ match: ["[Jag ]läser {i|på} soffan"], tip: "Zit te lezen = *sitter och läser*." }, { contains: ["och läsa", "och läste"], tip: "Beide werkwoorden in dezelfde tijd: *jag sitter och läser*." }, { contains: ["sitter att läsa", "sitter te"], tip: "Zitten te lezen = *sitter och läser*." }, { contains: ["ligger", "står"], tip: "Je zit op de bank: *sitter*." }] }
          - { id: xv72, type: translate, topic: placera, prompt: "Je huisgenoot zoekt de sleutels. Zeg dat je ze op de tafel hebt gelegd.", answers: ["Jag {har lagt|lade|la} {dem|nycklarna} på bordet."], feedback: [{ contains: ["har legat", "har ligat"], tip: "*legat* hoort bij *ligga* (liggen). Iets neerleggen = *lägga*: *jag har lagt dem*." }, { contains: ["har ställt", "har satt"], tip: "Sleutels leg je neer: *lägga → har lagt*." }, { contains: ["lagt de ", "lagt dom", "lade de ", "la de "], tip: "Ze (lijdend voorwerp) = *dem*." }, { contains: ["har lägt", "har läggt"], tip: "Het supinum van *lägga* is *lagt*." }] }
