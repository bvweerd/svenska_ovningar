        topic: woordenschat
        shuffle: true
        items:
          - { id: sxe3, type: gap, text: "Jag har ont i ___ när jag lyfter armen.", gaps: [{ answers: ["axeln"], options: ["axeln", "tån", "läppen", "huden"] }] }
          - { id: jrvc, type: gap, text: "Jag har ont i ___, så jag kan inte titta åt sidan.", gaps: [{ answers: ["nacken"], options: ["nacken", "tån", "läppen", "håret"] }] }
          - { id: xnkc, type: gap, text: "Wilma tvättar ___ varje morgon i duschen.", gaps: [{ answers: ["håret"], options: ["håret", "blodet", "gipset", "plåstret"] }] }
          - { id: fbma, type: gap, text: "Skon är för liten, och det gör ont i ___.", gaps: [{ answers: ["tårna"], options: ["tårna", "axlarna", "läpparna", "tungorna"], feedback: [{ match: "axlarna", tip: "Een schoen zit om je voet: dan doen je tenen pijn (tårna)." }] }] }
          - { id: d4gh, type: gap, text: "På bilden ser man bara hans ___, inte hela kroppen.", gaps: [{ answers: ["ansikte"], options: ["ansikte", "blod", "gips", "värk"] }] }
          - { id: jyp6, type: gap, text: "Det kom ___ ur näsan, så hon satte sig ner.", gaps: [{ answers: ["blod"], options: ["blod", "hår", "gips", "motion"] }] }
          - { id: uyvv, type: gap, text: "Efter en dag på stranden var ___ på armarna alldeles röd.", gaps: [{ answers: ["huden"], options: ["huden", "tungan", "kryckan", "nacken"] }] }
          - { id: x7mm, type: gap, text: "Jag tror att jag har feber. Var är ___?", gaps: [{ answers: ["termometern"], options: ["termometern", "kryckan", "ambulansen", "motionen"], feedback: [{ match: "kryckan", tip: "Koorts meet je met een thermometer: termometern." }] }] }
          - { id: fyxc, type: gap, text: "Läkaren vill titta på ___, så jag öppnar munnen.", gaps: [{ answers: ["tungan"], options: ["tungan", "nacken", "axeln", "tån"], feedback: [{ match: "nacken", tip: "Als je je mond opendoet, ziet de dokter je tong: tungan." }] }] }
          - { id: g3dn, type: gap, text: "Läkaren lyssnar på hjärtat och lägger handen på ___.", gaps: [{ answers: ["bröstet"], options: ["bröstet", "håret", "tån", "gipset"] }] }

