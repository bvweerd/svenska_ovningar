      - id: lezen-rug
        title: "Lezen: Olle heeft rugpijn"
        instruction: Lees de tekst. Is de bewering **rätt** of **fel**? Is hij fout, schrijf dan de juiste zin op.
        topic: kroppen
        textTitle: Ont i ryggen
        text: |
          Olle har haft ont i ryggen i en vecka. I måndags ringde han till vårdcentralen och fick en tid på onsdagen. Läkaren undersökte honom och sa att det inte var något farligt. Olle hade lyft något tungt i trädgården.

          Han fick tabletter mot smärtan och läkaren sa att han skulle vila sig och inte lyfta tunga saker på två veckor. Nu ligger Olle i soffan och läser, men han tycker att det är tråkigt!
        items:
          - { id: 2zvb, type: truefalse, statement: "Olle har ont i huvudet.", answer: false, tip: "Waar heeft hij pijn?", correction: { answers: ["{Olle|Han} har ont i ryggen."] } }
          - { id: gb85, type: truefalse, statement: "Olle fick en tid på onsdagen.", answer: true }
          - { id: d8gx, type: truefalse, statement: "Läkaren sa att det var farligt.", answer: false, tip: "Wat zei de arts?", correction: { answers: ["{Läkaren|Hon|Han} sa att det inte var [något ]farligt."], feedback: [{ contains: "det var inte", tip: "In de bijzin staat inte vóór het werkwoord: att det inte var farligt." }] } }
          - { id: knga, type: truefalse, statement: "Olle ska vila sig.", answer: true }
          - { id: t8uk, type: truefalse, statement: "Olle får lyfta tunga saker.", answer: false, tip: "Wat zei de arts over tillen?", correction: { answers: ["{Olle|Han} får inte lyfta tunga saker[ på två veckor].", "{Olle|Han} ska inte lyfta tunga saker[ på två veckor]."] } }
          - { id: u86b, type: truefalse, statement: "Olle tycker att det är roligt att ligga i soffan.", answer: false, tip: "Lees de laatste zin.", correction: { answers: ["{Olle|Han} tycker [att ]det är tråkigt[ att ligga i soffan]."] } }

      - id: dialoog-dokter
        title: Bij de dokter
        instruction: Zet het gesprek in de goede volgorde.
        topic: kroppen
        items:
          - id: s3qk
            type: dialogue
            lines:
              - "Läkaren: Välkommen in. Vad kan jag hjälpa dig med?"
              - "Fleur: Jag har haft ont i halsen i tre dagar och jag känner mig så trött."
              - "Läkaren: Har du feber?"
              - "Fleur: Ja, igår hade jag 38,5."
              - "Läkaren: Får jag titta i halsen? Ja, den är lite röd. Det är nog en förkylning."
              - "Fleur: Behöver jag medicin?"
              - "Läkaren: Nej, men vila dig och drick mycket vatten. Ring igen om det inte blir bättre."

      - id: schrijven-ziek
        title: "Schrijven: ziekmelden"
        instruction: "Bouw eerst je bericht op in vier stappen die de app nakijkt. Daarna schrijf je, als je wilt, het hele bericht."
        topic: reflexiv
        items:
          - { id: 9e7n, type: mc, topic: v2, prompt: "Kies de beste openingszin voor je bericht aan Karin.", options: ["Hej Karin! Tyvärr kan jag inte komma till jobbet idag.", "Hej Karin! Tyvärr jag kan inte komma till jobbet idag.", "Hej Karin! Tyvärr kan jag inte kommer till jobbet idag."], answer: 0, tip: "Na tyvärr komt het werkwoord op plaats 2 (kan jag), en na kan volgt de hele vorm: komma." }
          - { id: 46hv, type: gap, topic: kroppen, prompt: "Kies het goede woord.", text: "Jag har feber och ont ___ halsen.", gaps: [{ answers: ["i"], options: ["i", "på", "med"], tip: "Pijn in een lichaamsdeel: ont i." }] }
          - { id: a8kd, type: gap, prompt: "Kies het goede woord.", text: "Jag känner ___ väldigt trött.", gaps: [{ answers: ["mig"], options: ["mig", "jag", "sig"], tip: "känna sig: bij jag hoort mig." }] }
          - { id: sw46, type: translate, prompt: "Ik hoop dat ik me donderdag beter voel.", answers: ["Jag hoppas[ att] jag {mår bättre|känner mig bättre} på torsdag."], feedback: [{ contains: "känner jag", tip: "Na att komt een bijzin: eerst het onderwerp, dan het werkwoord (att jag känner mig …)." }] }
          - id: 4cd6
            type: free
            prompt: "Zeg dat je ziek bent, wat je klachten zijn, en wanneer je denkt terug te zijn."
            minWords: 25
            require:
              - { any: ["ont i", "huvudvärk", "feber", "förkyld"], label: "Je beschrijft je klachten (ont i, feber …)" }
              - { any: ["känner mig", "mår"], label: "Je zegt hoe je je voelt (känner mig / mår)" }
              - { any: ["kan inte", "kommer inte"], label: "Je zegt dat je niet kunt komen" }
            model: "Hej Karin! Tyvärr kan jag inte komma till jobbet idag. Jag har feber och ont i halsen, och jag känner mig väldigt trött. Jag ska vila mig och dricka mycket te. Jag hoppas att jag mår bättre på torsdag. Hälsningar, Sanne"

