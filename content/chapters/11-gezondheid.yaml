chapter: 11
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan zeggen waar iets ligt, staat of zit, en iets ergens neerleggen of neerzetten", topics: [positionsverb, placera] }
  - { text: "Ik kan bij de dokter zeggen waar ik pijn heb (ont i …), en wederkerende werkwoorden gebruiken (känna sig, lägga sig, skynda sig …)", topics: [kroppen, reflexiv] }

grammar:
  - id: positionsverb
    title: Ligger, sitter, står och …
    summary: "**sitter och läser** = zit te lezen. Beide werkwoorden in **dezelfde tijd**: *satt och läste*. Ook voor dingen: een boek **ligger**, een vaas **står**, een schilderij **hänger**, een sleutel **sitter**."
    body: |
      ### Bezig zijn met iets
      Waar het Nederlands *zitten te lezen* zegt, gebruikt het Zweeds **positiewerkwoord + och + werkwoord**:

      | Zweeds | Nederlands |
      |---|---|
      | Jag **sitter och läser**. | Ik zit te lezen. |
      | Hon **står och diskar**. | Ze staat af te wassen. |
      | Nils **ligger och sover**. | Nils ligt te slapen. |
      | Vi **går och pratar**. | We lopen te praten. |

      Beide werkwoorden staan in **dezelfde tijd**: *Olle **satt och tittade** på tv.*

      ### Waar iets is
      Ook bij dingen zeg je hoe ze staan of liggen:

      | Werkwoord | Wanneer | Voorbeeld |
      |---|---|---|
      | ligger | plat, liggend | Boken **ligger** på bordet. |
      | står | rechtop | Vasen **står** på bordet. Mjölken **står** i kylen. |
      | hänger | hangend | Tavlan **hänger** på väggen. |
      | sitter | vastgemaakt, vast | Nyckeln **sitter** i dörren. |

  - id: placera
    title: Leggen, zetten – lägga, ställa, sätta
    summary: "Iets **neerleggen** = *lägga* → het **ligger**. Iets **neerzetten** = *ställa* → het **står**. **Gaan zitten** = *sätta sig* → je **sitter**. **Ophangen** = *hänga* → het **hänger**."
    body: |
      Bij elk positiewerkwoord hoort een werkwoord voor de beweging ernaartoe:

      | Beweging (iets ergens neerleggen/zetten) | Resultaat (waar het is) |
      |---|---|
      | **lägga** (lägger, la/lade, lagt) | **ligga** (ligger, låg, legat) |
      | **ställa** (ställer, ställde, ställt) | **stå** (står, stod, stått) |
      | **sätta** (sätter, satte, satt) | **sitta** (sitter, satt, suttit) |
      | **hänga** (hänger, hängde, hängt) | **hänga** (hänger, hängde, hängt) |

      - Bram **lägger** boken på bordet. → Nu **ligger** boken på bordet.
      - Fleur **ställer** vasen på bordet. → Nu **står** vasen på bordet.
      - Nils **sätter sig** på stolen. → Nu **sitter** han på stolen.
      - **Lägg** dig! (Ga liggen!) **Sätt** dig! (Ga zitten!)

  - id: kroppen
    title: Het lichaam – ont i …
    summary: "Pijn: **Jag har ont i** huvudet / magen / ryggen. Of: **Det gör ont i** knät. Let op het meervoud: *ögon, öron, händer, fötter, tänder*."
    body: |
      | Zweeds | Nederlands | Meervoud |
      |---|---|---|
      | ett huvud | hoofd | huvuden |
      | ett öga | oog | ögon |
      | ett öra | oor | öron |
      | en näsa | neus | näsor |
      | en mun | mond | munnar |
      | en hals | hals, keel | halsar |
      | en arm | arm | armar |
      | en hand | hand | händer |
      | ett finger | vinger | fingrar |
      | en rygg | rug | ryggar |
      | en mage | buik, maag | magar |
      | ett ben | been | ben |
      | ett knä | knie | knän |
      | en fot | voet | fötter |
      | en tand | tand | tänder |

      ### Pijn hebben
      - Jag har **ont i** huvudet. (of: Jag har **huvudvärk**.)
      - Har du **ont i** halsen?
      - **Det gör ont i** knät.

      Na *ont i* volgt de **bepaalde vorm**: *ont i magen, ont i fötterna*.

  - id: reflexiv
    title: Wederkerende werkwoorden – sig
    summary: "*jag tvättar **mig**, du … **dig**, han/hon … **sig**, vi … **oss**, ni … **er**, de … **sig***. Bijvoorbeeld: *känna sig, sätta sig, lägga sig, vila sig, skynda sig*."
    body: |
      | | Voorbeeld |
      |---|---|
      | jag – mig | Jag känner **mig** sjuk. |
      | du – dig | Skynda **dig**! |
      | han, hon – sig | Bram lägger **sig** tidigt. |
      | vi – oss | Vi måste vila **oss**. |
      | ni – er | Sätt **er**, är ni snälla! |
      | de – sig | Barnen klär på **sig**. |

      Veelgebruikte wederkerende werkwoorden:

      | Zweeds | Nederlands |
      |---|---|
      | känna sig | zich voelen |
      | sätta sig | gaan zitten |
      | lägga sig | gaan liggen, naar bed gaan |
      | vila sig | (uit)rusten |
      | skynda sig | zich haasten |
      | klä på sig | zich aankleden |
      | gifta sig | trouwen |

      Niet elk Nederlands wederkerend werkwoord is in het Zweeds wederkerend, en andersom. *Ik verveel me* is *Jag har tråkigt*.

sections:
  - id: oefeningen
    title: Oefeningen
    exercises:
      - id: ligt-of-staat
        title: Ligt, staat, hangt of zit het?
        instruction: Kies het werkwoord dat past.
        topic: positionsverb
        shuffle: true
        items:
          - { id: nb5h, type: gap, text: "Boken ___ på bordet.", gaps: [{ answers: ["ligger"], options: ["ligger", "står", "hänger", "sitter"], shuffle: false }] }
          - { id: peqh, type: gap, text: "Vasen ___ på bordet.", gaps: [{ answers: ["står"], options: ["ligger", "står", "hänger", "sitter"], shuffle: false, feedback: [{ match: "ligger", tip: "Een vaas staat rechtop: står." }] }] }
          - { id: ybsh, type: gap, text: "Tavlan ___ på väggen.", gaps: [{ answers: ["hänger"], options: ["ligger", "står", "hänger", "sitter"], shuffle: false }] }
          - { id: 7w54, type: gap, text: "Nyckeln ___ i dörren.", gaps: [{ answers: ["sitter"], options: ["ligger", "står", "hänger", "sitter"], shuffle: false, feedback: [{ match: ["står", "hänger"], tip: "Iets wat vastzit (een sleutel in het slot): sitter." }] }] }
          - { id: q3x7, type: gap, text: "Mjölken ___ i kylskåpet.", gaps: [{ answers: ["står"], options: ["ligger", "står", "hänger", "sitter"], shuffle: false, feedback: [{ match: "ligger", tip: "Een pak melk staat rechtop: står." }] }] }
          - { id: wjk9, type: gap, text: "Telefonen ___ på golvet.", gaps: [{ answers: ["ligger"], options: ["ligger", "står", "hänger", "sitter"], shuffle: false }] }
          - { id: k529, type: gap, text: "Jackan ___ i hallen.", gaps: [{ answers: ["hänger"], options: ["ligger", "står", "hänger", "sitter"], shuffle: false }] }
          - { id: gexx, type: gap, text: "Katten ___ i soffan och sover.", gaps: [{ answers: ["ligger"], options: ["ligger", "står", "hänger", "sitter"], shuffle: false }] }
          - { id: yetv, type: gap, text: "Gaffeln ___ bredvid tallriken.", gaps: [{ answers: ["ligger"], options: ["ligger", "står", "hänger", "sitter"], shuffle: false, feedback: [{ match: "står", tip: "Een vork ligt plat op tafel: ligger." }] }] }
          - { id: tuds, type: gap, text: "En flaska vin ___ på bordet.", gaps: [{ answers: ["står"], options: ["ligger", "står", "hänger", "sitter"], shuffle: false, feedback: [{ match: "ligger", tip: "Een fles staat rechtop: står." }] }] }

      - id: zit-te
        title: Zitten te …
        instruction: Vertaal naar het Zweeds.
        topic: positionsverb
        items:
          - { id: xpay, type: translate, prompt: "Ik zit te lezen.", answers: ["Jag sitter och läser."], feedback: [{ contains: "sitter att", tip: "Het Zweeds gebruikt och: sitter och läser." }, { contains: "sitter och läsa", tip: "Beide werkwoorden in dezelfde vorm: sitter och läser." }] }
          - { id: xqwa, type: translate, prompt: "Ze staat af te wassen.", answers: ["Hon står och diskar."] }
          - { id: kwgt, type: translate, prompt: "Nils ligt te slapen.", answers: ["Nils ligger och sover."] }
          - { id: vx9b, type: translate, prompt: "Olle zat tv te kijken.", answers: ["Olle satt och {tittade|såg} på {tv|teve}."], feedback: [{ contains: "satt och tittar", tip: "Beide werkwoorden in dezelfde tijd: satt och tittade." }] }
          - { id: t5qy, type: translate, prompt: "Wij liepen te praten.", answers: ["Vi gick och pratade."], feedback: [{ contains: "gick och pratar", tip: "Beide werkwoorden in dezelfde tijd: gick och pratade." }] }
          - { id: pjdj, type: translate, prompt: "Fleur ligt te lezen.", answers: ["Fleur ligger och läser."], feedback: [{ contains: "ligger och läsa", tip: "Beide werkwoorden in dezelfde vorm: ligger och läser." }] }
          - { id: bn8q, type: translate, prompt: "Bram staat te koken.", answers: ["Bram står och lagar mat."] }
          - { id: hs9g, type: translate, prompt: "Wij zaten te eten.", answers: ["Vi satt och åt."], feedback: [{ contains: "satt och äter", tip: "Beide werkwoorden in dezelfde tijd: satt och åt." }] }

      - id: positie-kiezen-maken
        title: Welk werkwoord? Kies en vertaal
        instruction: Kies eerst het werkwoord dat past, vertaal dan de zin.
        topic: positionsverb
        shuffle: true
        items:
          - id: m4ms
            type: steps
            steps:
              - { type: mc, prompt: "Waar is mijn jas? – Hij hangt in de hal. Welk werkwoord?", options: ["ligger", "står", "hänger", "sitter"], answer: 2, shuffle: false, tip: "Een jas aan de kapstok hangt: hänger." }
              - { type: translate, prompt: "Vertaal: Hij (de jas) hangt in de hal.", answers: ["{Den|Jackan} hänger i hallen."], feedback: [{ contains: "Han hänger", tip: "Een jas is een ding (en jacka): den." }] }
          - id: 6mfn
            type: steps
            steps:
              - { type: mc, prompt: "De schoenen staan onder het bed. Welk werkwoord?", options: ["ligger", "står", "hänger", "sitter"], answer: 1, shuffle: false, tip: "Schoenen staan, net als in het Nederlands: står." }
              - { type: translate, prompt: "Vertaal: De schoenen staan onder het bed.", answers: ["Skorna står under sängen."], feedback: [{ contains: "ligger", tip: "Schoenen staan: står." }] }
          - id: qunk
            type: steps
            steps:
              - { type: mc, prompt: "Mijn telefoon ligt in mijn tas. Welk werkwoord?", options: ["ligger", "står", "hänger", "sitter"], answer: 0, shuffle: false, tip: "Plat, liggend: ligger." }
              - { type: translate, prompt: "Vertaal: Mijn telefoon ligt in mijn tas.", answers: ["Min {mobil|mobiltelefon|telefon} ligger i {min väska|väskan}."], feedback: [{ contains: "står", tip: "Een telefoon ligt plat: ligger." }] }
          - id: nwp9
            type: steps
            steps:
              - { type: mc, prompt: "Het schilderij hangt in de woonkamer. Welk werkwoord?", options: ["ligger", "står", "hänger", "sitter"], answer: 2, shuffle: false, tip: "Aan de muur: hänger." }
              - { type: translate, prompt: "Vertaal: Het schilderij hangt in de woonkamer.", answers: ["Tavlan hänger i vardagsrummet."], feedback: [{ contains: "sitter", tip: "Een schilderij hangt: hänger." }] }
          - id: hzfw
            type: steps
            steps:
              - { type: mc, prompt: "Wilma ligt in bed te lezen. Welk werkwoord?", options: ["ligger och läser", "står och läser", "sitter och läser"], answer: 0, shuffle: false, tip: "Ze ligt in bed: ligger och läser." }
              - { type: translate, prompt: "Vertaal: Wilma ligt in bed te lezen.", answers: ["Wilma ligger {i sängen och läser|och läser i sängen}."], feedback: [{ contains: "att läsa", tip: "Zweeds: positiewerkwoord + och + werkwoord in dezelfde tijd: ligger … och läser." }] }
          - id: c72u
            type: steps
            steps:
              - { type: mc, prompt: "Bram zat gisteren tv te kijken. Welke vorm?", options: ["satt och tittade", "satt och tittar", "sitter och tittade"], answer: 0, shuffle: false, tip: "Beide werkwoorden in de preteritum: satt och tittade." }
              - { type: mc, prompt: "**Waarom?** Waarom *satt och tittade*?", options: ["Beide werkwoorden staan in dezelfde tijd.", "Na och komt altijd de preteritum.", "Sitta is een sterk werkwoord."], answer: 0, tip: "Bij sitter och … staan beide werkwoorden altijd in dezelfde tijd: sitter och tittar (nu), satt och tittade (toen)." }
              - { type: translate, prompt: "Vertaal: Bram zat gisteren tv te kijken.", answers: ["Bram satt och {tittade|såg} på {tv|teve} {igår|i går}.", "Bram satt {igår|i går} och {tittade|såg} på {tv|teve}."], feedback: [{ contains: ["och tittar", "och ser"], tip: "Beide werkwoorden in dezelfde tijd: satt och tittade." }, { contains: "sitter", tip: "Gisteren: preteritum, satt och tittade." }] }
          - id: kvn4
            type: steps
            steps:
              - { type: mc, prompt: "Olle staat in de keuken te koken. Welk werkwoord?", options: ["ligger och lagar", "står och lagar", "sitter och lagar"], answer: 1, shuffle: false, tip: "Ze staat in de keuken: står och lagar mat." }
              - { type: translate, prompt: "Vertaal: Olle staat in de keuken te koken.", answers: ["Olle står {i köket och lagar mat|och lagar mat i köket}."], feedback: [{ contains: "att laga", tip: "Zweeds: står … och lagar, beide in de presens." }] }
          - id: tgxq
            type: steps
            steps:
              - { type: mc, prompt: "De fietsen staan buiten. Welk werkwoord?", options: ["ligger", "står", "hänger", "sitter"], answer: 1, shuffle: false, tip: "Een fiets staat rechtop: står." }
              - { type: translate, prompt: "Vertaal: De fietsen staan buiten.", answers: ["Cyklarna står {ute|utomhus|utanför}."], feedback: [{ contains: "står ut", tip: "Ze zijn buiten, geen beweging: ute." }] }
          - id: 3yyy
            type: steps
            steps:
              - { type: mc, prompt: "Ingrid zit in de tuin te lezen. Welk werkwoord?", options: ["ligger och läser", "står och läser", "sitter och läser"], answer: 2, shuffle: false, tip: "Ze zit: sitter och läser." }
              - { type: translate, prompt: "Vertaal: Ingrid zit in de tuin te lezen.", answers: ["Ingrid sitter {i trädgården och läser|och läser i trädgården}."], feedback: [{ contains: "att läsa", tip: "Zweeds: sitter … och läser, beide in de presens." }] }

      - id: leggen-en-liggen
        title: Leggen en liggen
        instruction: Kies eerst wat iemand doet. Vul daarna in waar het nu is.
        topic: placera
        items:
          - id: cq2q
            type: steps
            steps:
              - { type: mc, prompt: "Fleur ___ vasen på bordet.", options: ["ställer", "står"], answer: 0, shuffle: false, tip: "Fleur zet de vaas neer (beweging): ställer." }
              - { type: gap, text: "Nu ___ vasen på bordet.", gaps: [{ answers: ["står"], feedback: [{ match: "ställer", tip: "Nu gaat het om waar de vaas is (resultaat): står." }] }] }
          - id: rwp3
            type: steps
            steps:
              - { type: mc, prompt: "Bram ___ boken på bordet.", options: ["lägger", "ligger"], answer: 0, shuffle: false, tip: "Bram legt het boek neer (beweging): lägger." }
              - { type: gap, text: "Nu ___ boken på bordet.", gaps: [{ answers: ["ligger"], feedback: [{ match: "lägger", tip: "Nu gaat het om waar het boek is (resultaat): ligger." }] }] }
          - id: 6uuu
            type: steps
            steps:
              - { type: mc, prompt: "Nils ___ sig på stolen.", options: ["sätter", "sitter"], answer: 0, shuffle: false, tip: "Gaan zitten (beweging) = sätta sig." }
              - { type: gap, text: "Nu ___ han på stolen.", gaps: [{ answers: ["sitter"], feedback: [{ match: "sätter", tip: "Nu gaat het om waar hij is (resultaat): sitter." }] }] }
          - id: mbja
            type: steps
            steps:
              - { type: mc, prompt: "Ingrid ___ sig i sängen.", options: ["lägger", "ligger"], answer: 0, shuffle: false, tip: "Gaan liggen (beweging) = lägga sig." }
              - { type: gap, text: "Nu ___ hon i sängen och läser.", gaps: [{ answers: ["ligger"] }] }
          - id: 7hqa
            type: steps
            steps:
              - { type: mc, prompt: "Nils ___ mobilen på bordet.", options: ["lägger", "ligger"], answer: 0, shuffle: false, tip: "Nils legt de telefoon neer (beweging): lägger." }
              - { type: gap, text: "Nu ___ mobilen på bordet.", gaps: [{ answers: ["ligger"], feedback: [{ match: "lägger", tip: "Nu gaat het om waar de telefoon is (resultaat): ligger." }] }] }
          - id: gv3p
            type: steps
            steps:
              - { type: mc, prompt: "Fleur ___ sig i soffan.", options: ["sätter", "sitter"], answer: 0, shuffle: false, tip: "Gaan zitten (beweging) = sätta sig." }
              - { type: gap, text: "Nu ___ hon i soffan och tittar på tv.", gaps: [{ answers: ["sitter"], feedback: [{ match: "sätter", tip: "Nu gaat het om waar ze is (resultaat): sitter." }] }] }
          - id: 4zeu
            type: steps
            steps:
              - { type: mc, prompt: "Olle ___ flaskan i kylskåpet.", options: ["ställer", "står"], answer: 0, shuffle: false, tip: "Olle zet de fles neer (beweging): ställer." }
              - { type: gap, text: "Nu ___ flaskan i kylskåpet.", gaps: [{ answers: ["står"], feedback: [{ match: "ställer", tip: "Nu gaat het om waar de fles is (resultaat): står." }] }] }
          - id: 5en7
            type: steps
            steps:
              - { type: mc, prompt: "Bram ___ sig på golvet.", options: ["lägger", "ligger"], answer: 0, shuffle: false, tip: "Gaan liggen (beweging) = lägga sig." }
              - { type: gap, text: "Nu ___ han på golvet och vilar.", gaps: [{ answers: ["ligger"] }] }

      - id: zet-het-neer
        title: Zet het neer!
        instruction: Vul de gebiedende wijs in.
        topic: placera
        shuffle: true
        items:
          - { id: yayy, type: gap, text: "___ (lägga) boken på bordet!", gaps: [{ answers: ["Lägg"] }] }
          - { id: rckw, type: gap, text: "___ (ställa) cykeln där!", gaps: [{ answers: ["Ställ"] }] }
          - { id: 86hz, type: gap, text: "___ (sätta) dig, är du snäll!", gaps: [{ answers: ["Sätt"], feedback: [{ match: ["Sitt", "Sitta"], tip: "Gaan zitten (beweging) = sätta sig: Sätt dig!" }] }] }
          - { id: eg6y, type: gap, text: "___ (hänga) jackan i hallen!", gaps: [{ answers: ["Häng"] }] }
          - { id: dbyt, type: gap, text: "___ (lägga) dig och vila en stund!", gaps: [{ answers: ["Lägg"], feedback: [{ match: ["Ligg", "Ligga"], tip: "Gaan liggen (beweging) = lägga sig: Lägg dig!" }] }] }
          - { id: 8wcr, type: gap, text: "___ (ställa) vasen på bordet!", gaps: [{ answers: ["Ställ"] }] }
          - { id: gc9w, type: gap, text: "___ (sätta) nyckeln i dörren!", gaps: [{ answers: ["Sätt"] }] }
          - { id: yz7h, type: gap, text: "___ (lägga) inte mobilen på golvet!", gaps: [{ answers: ["Lägg"] }] }

      - id: lichaam-koppelen
        title: Het lichaam
        instruction: Koppel het Zweedse woord aan de betekenis.
        topic: kroppen
        items:
          - id: qebh
            type: match
            pairs:
              - ["ett huvud", "een hoofd"]
              - ["ett öga", "een oog"]
              - ["ett öra", "een oor"]
              - ["en mun", "een mond"]
              - ["en hals", "een keel, een hals"]
              - ["en rygg", "een rug"]
              - ["en mage", "een buik"]
              - ["en fot", "een voet"]

      - id: lichaam-meervoud
        title: Meervoud van lichaamsdelen
        instruction: Vul het meervoud in. Veel van deze woorden zijn onregelmatig.
        topic: kroppen
        items:
          - id: kfr4
            type: table
            columns: ["Enkelvoud", "Meervoud"]
            rows:
              - ["ett öga", { answers: ["ögon"], feedback: [{ match: ["ögan", "ögor"], tip: "öga is onregelmatig: ögon." }] }]
              - ["ett öra", { answers: ["öron"], feedback: [{ match: ["öran", "öror"], tip: "öra is onregelmatig: öron." }] }]
              - ["en hand", { answers: ["händer"], feedback: [{ match: ["hander", "handar"], tip: "hand heeft klinkerwisseling: händer." }] }]
              - ["en fot", { answers: ["fötter"], feedback: [{ match: ["foter", "fotar"], tip: "fot heeft klinkerwisseling: fötter." }] }]
              - ["en tand", { answers: ["tänder"] }]
              - ["ett finger", { answers: ["fingrar"], feedback: [{ match: "fingers", tip: "finger – fingrar (de e valt weg)." }] }]
              - ["en arm", { answers: ["armar"] }]
              - ["ett ben", { answers: ["ben"] }]

      - id: pijn
        title: Waar doet het pijn?
        instruction: Vertaal naar het Zweeds.
        topic: kroppen
        items:
          - { id: f54d, type: translate, prompt: "Ik heb hoofdpijn.", answers: ["Jag har ont i huvudet.", "Jag har huvudvärk."], feedback: [{ match: "Jag har ont i huvud", tip: "Na ont i: bepaalde vorm (huvudet)." }] }
          - { id: 7uuw, type: translate, prompt: "Mijn rug doet pijn.", answers: ["Jag har ont i ryggen.", "Det gör ont i ryggen.", "{Min rygg|Ryggen} gör ont."] }
          - { id: 2wqb, type: translate, prompt: "Nils heeft buikpijn.", answers: ["Nils har {ont i magen|magont|magvärk}."] }
          - { id: ug9y, type: translate, prompt: "Heb je keelpijn?", answers: ["Har du ont i halsen?"], topic: vragen }
          - { id: aqxw, type: translate, prompt: "Mijn voeten doen pijn.", answers: ["Jag har ont i fötterna.", "Det gör ont i fötterna.", "{Mina fötter|Fötterna} gör ont."], feedback: [{ contains: "fotarna", tip: "fot – fötter – fötterna." }] }
          - { id: zgn3, type: translate, prompt: "Wilma heeft oorpijn.", answers: ["Wilma har {ont i örat|ont i öronen|öronvärk}."], feedback: [{ contains: "ont i öra ", tip: "Na ont i: bepaalde vorm (örat)." }] }
          - { id: 788e, type: translate, prompt: "Mijn arm doet pijn.", answers: ["Jag har ont i armen.", "Det gör ont i armen.", "{Min arm|Armen} gör ont."] }
          - { id: 6myw, type: translate, prompt: "Doet je knie pijn?", answers: ["Har du ont i knät?", "Gör det ont i knät?", "Gör {knät|ditt knä} ont?"], topic: vragen, feedback: [{ contains: "ont i knä?", tip: "Na ont i: bepaalde vorm (knät)." }] }

